<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>ローン申込情報入力画面</title>
    <style>
        body {
        background-color: #f0f0f0;
        margin: 0;
        padding: 0;
        display: flex;
        padding-top: 40px;
        padding-bottom: 40px;
        justify-content: center;
        align-items: center;
        min-height: 85vh;
        overflow: auto;
        }
        .content {
         background-color: #ffffff;
         width: 80%;
         padding: 20px;
         border-radius: 10px;
         box-shadow: 0 4px 8px rgba(0,0,0,0.1);
         min-height: 50vh;
         overflow: auto;
        }
        .form-control {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            box-sizing: border-box;
        }
        .name-inputs {
            display: flex;
            gap: 10px;
        }
        .name-inputs .form-control {
            flex: 1;
            min-width: 0;
        }
        .text-danger {
        color: red;
        }
        .form-control-button {
        width: 80px;
        padding: 10px 20px;
        margin-top: 10px;
        border: none;
        cursor: pointer;
        border-radius: 5px;
        }
        .form-confirmation-button{
        color: white;
        background-color: #2185D0;
        }
        .form-confirmation-button:hover {
        background-color: #1678c2;
        }
        .form-clear-button{
        color: black;
        background-color: #E0E1E2;
        }
        .form-clear-button:hover {
        background-color: #CCCCCC;
        }

        .was-validated .form-control:invalid {
            border: 2px solid #dc3545;
            background-color: #fff5f5;
            outline: none;
        }

        .was-validated .form-control:invalid:focus {
            box-shadow: 0 0 4px rgba(220, 53, 69, 0.5);
        }

        .form-control:user-invalid {
            border: 2px solid #dc3545 !important;
            background-color: #fff5f5;
            outline: none;
        }

        .form-control:user-invalid:focus {
            box-shadow: 0 0 4px rgba(220, 53, 69, 0.5);
        }

    </style>
</head>
<body>
<div class="content">
    <h1>ローン申込情報入力</h1>

    <form action="#" th:action="@{/bankLoanDetails}" th:object="${bankLoanApplication}" method="post"
          class="needs-validation">
        <p><label class="ml-1">お名前: <small class="text-danger ml-1">※</small></label><br>
            <input type="text" th:field="*{debtorLastName}" class="form-control" placeholder="姓"
                   minlength="1" maxlength="20" pattern="[^0-9０-９]*[^0-9０-９\s][^0-9０-９]*"
                   title="姓は数字や空白だけでは入力できません" autocomplete="family-name"required/></p>
            <input type="text" th:field="*{debtorFirstName}" class="form-control" placeholder="名"
                   minlength="1" maxlength="20" pattern="[^0-9０-９]*[^0-9０-９\s][^0-9０-９]*"
                   title="名は数字や空白だけでは入力できません" autocomplete="given-name"required/></p>
        <p>
            <label class="ml-1">
                生年月日:
                <small class="text-danger ml-1">※</small>
            </label><br>

            <input type="date"
                   th:field="*{birthDate}"
                   th:max="${today}"
                   class="form-control"
                   title="この日付は選択できません"
                   required/>
        </p>
        <p>
            <label>
                ご本人様の前年度年収（税込）:
                <small class="text-danger">※</small>
            </label><br>

            <input type="number"
                   th:field="*{annualIncome}"
                   class="form-control"
                   min="200"
                   placeholder="500"
                   step="1"
                   title="年収は200万円以上で入力してください"
                   required/>
            <span>万円</span>
        </p>
        <p><label class="ml-1">金融機関名: <small class="text-danger ml-1">※</small></label><br>
            <select th:field="*{bankName}" class="form-control" required>
                <option value="">選択してください</option>
                <option th:each="option : ${nameOptions}"
                        th:value="${option}"
                        th:text="${option}">選択肢
                </option>
            </select></p>
        <p><label class="ml-1">支店名: <small class="text-danger ml-1">※</small></label><br>
            <select th:field="*{branchName}" class="form-control" required>
                <option value="">選択してください</option>
                <option th:each="option : ${branchOptions}"
                        th:value="${option}"
                        th:text="${option}">選択肢
                </option>
            </select>
        <p><label class="ml-1">科目名:<small class="text-danger ml-1">※</small></label><br>
            <select th:field="*{subjectName}" class="form-control"
                    required>
                <option value="">選択してください</option>

                <option th:each="subject : ${subjectOptions}"
                        th:value="${subject}"
                        th:text="${subject}">
                </option>
            </select>
        </p>


        <p><label class="ml-1">口座番号: <small class="text-danger ml-1">※</small></label><br>
            <input type="text"
                   th:field="*{bankAccountNum}"
                   class="form-control"
                   inputmode="numeric"
                   pattern="[0-9]{7}"
                   minlength="7"
                   maxlength="7"
                   placeholder="1234567"
                   title="口座番号は半角数字7桁で入力してください"
                   required/>

        <p style="text-align: center;"><input type="submit" value="次へ"
                                              class="form-control-button form-confirmation-button"/>
            <input type="reset" value="クリア" class="form-control-button form-clear-button"/></p>
    </form>
</div>
</body>

</html>
