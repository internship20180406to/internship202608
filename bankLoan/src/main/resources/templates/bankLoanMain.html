<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>カードローン申込情報入力画面</title>
    <link rel="stylesheet" th:href="@{/css/bankLoanMain.css}"/>
</head>
<body>
<div class="container">
    <div class="form-card">
        <div class="session-info">
            <span id="sessionNormalMessage">
                セキュリティ保護のため、一定時間操作がない場合は自動終了します
            </span>

            <span id="sessionWarning" class="session-warning">
                あと <strong id="sessionTimer">02:00</strong> で自動終了します
            </span>
        </div>

        <h1>カードローン申込情報入力</h1>
        <form action="#" th:action="@{/bankLoanConfirmation}" th:object="${bankLoanApplication}" method="post">

            <p>
                <label>氏名: <small class="text-danger">※</small></label>

            <div class="name-row">
                <div class="name-field">
                    <label for="lastName">姓</label>
                    <input type="text"
                           th:field="*{lastName}"
                           id="lastName"
                           class="form-control"
                           placeholder="松岡">

                    <span class="text-danger server-error"
                          th:if="${#fields.hasErrors('lastName')}"
                          th:errors="*{lastName}">
            </span>

                    <span id="lastNameClientError"
                          class="text-danger client-error"></span>
                </div>

                <div class="name-field">
                    <label for="firstName">名</label>
                    <input type="text"
                           th:field="*{firstName}"
                           id="firstName"
                           class="form-control"
                           placeholder="慎吾">

                    <span class="text-danger server-error"
                          th:if="${#fields.hasErrors('firstName')}"
                          th:errors="*{firstName}">
            </span>

                    <span id="firstNameClientError"
                          class="text-danger client-error"></span>
                </div>
            </div>
            </p>

            <p>
                <label>フリガナ: <small class="text-danger">※</small></label>

            <div class="name-row">
                <div class="name-field">
                    <label for="lastNameKana">セイ</label>
                    <input type="text"
                           th:field="*{lastNameKana}"
                           id="lastNameKana"
                           class="form-control"
                           placeholder="マツオカ">

                    <span class="text-danger server-error"
                          th:if="${#fields.hasErrors('lastNameKana')}"
                          th:errors="*{lastNameKana}">
            </span>

                    <span id="lastNameKanaClientError"
                          class="text-danger client-error"></span>
                </div>

                <div class="name-field">
                    <label for="firstNameKana">メイ</label>
                    <input type="text"
                           th:field="*{firstNameKana}"
                           id="firstNameKana"
                           class="form-control"
                           placeholder="シンゴ">

                    <span class="text-danger server-error"
                          th:if="${#fields.hasErrors('firstNameKana')}"
                          th:errors="*{firstNameKana}">
            </span>

                    <span id="firstNameKanaClientError"
                          class="text-danger client-error"></span>
                </div>
            </div>
            </p>

            <p>
                <label for="birthDate">
                    生年月日:
                    <small class="text-danger">※</small>
                </label>
                <br>

                <input type="date"
                       th:field="*{birthDate}"
                       id="birthDate"
                       class="form-control">

                <span id="birthDateServerError"
                      class="text-danger server-error"
                      th:if="${#fields.hasErrors('birthDate')}"
                      th:errors="*{birthDate}">
                </span>

                <span id="ageServerError"
                      class="text-danger server-error"
                      th:if="${#fields.hasErrors('ageEligible')}"
                      th:errors="*{ageEligible}">
                </span>

                <span id="birthDateClientError"
                      class="text-danger client-error">
                </span>
            </p>

            <p><label class="ml-1">金融機関名: <small class="text-danger ml-1">※</small></label><br>
                <select th:field="*{bankName}"
                        id="bankName"
                        class="form-control">
                    <option value="">選択してください</option>

                    <option th:each="option : ${nameOptions}"
                            th:value="${option}"
                            th:text="${option}">選択肢
                    </option>
                </select>

                <span id="bankNameClientError"
                      class="text-danger client-error">
            </span>
                <span class="text-danger server-error"
                      th:if="${#fields.hasErrors('bankName')}"
                      th:errors="*{bankName}">
            </span>
            </p>

            <p>
                <label class="ml-1">支店名: <small class="text-danger ml-1">※</small></label><br>

                <input type="text"
                       id="branchSearch"
                       class="form-control"
                       placeholder="支店名を検索">

                <select th:field="*{branchName}"
                        id="branchName"
                        class="form-control"
                        th:data-selected="${branchName}">

                    <option value="">金融機関を先に選択してください</option>
                </select>

                <input type="hidden"
                       id="selectedBranch"
                       th:value="*{branchName}">

                <span class="text-danger server-error"
                      th:if="${#fields.hasErrors('branchName')}"
                      th:errors="*{branchName}">
            </span>
                <span id="branchNameClientError"
                      class="text-danger client-error"></span>
            </p>

            <p>
                <label class="ml-1">
                    科目名:
                    <small class="text-danger ml-1">※</small>
                </label>

            <div class="radio-group">

                <label class="radio-label">
                    <input type="radio"
                           th:field="*{bankAccountType}"
                           value="普通預金">
                    普通預金
                </label>

                <label class="radio-label">
                    <input type="radio"
                           th:field="*{bankAccountType}"
                           value="当座預金">
                    当座預金
                </label>

            </div>

            <span class="text-danger server-error"
                  th:if="${#fields.hasErrors('bankAccountType')}"
                  th:errors="*{bankAccountType}">
                </span>

            <span id="bankAccountTypeClientError"
                  class="text-danger client-error">
                </span>
            </p>

            <p>
            <div class="form-group">
                <label for="bankAccountNum">
                    口座番号:
                    <small class="text-danger">※</small>
                </label>

                <div class="account-number-area">

                    <input type="password"
                           th:field="*{bankAccountNum}"
                           id="bankAccountNum"
                           maxlength="7"
                           inputmode="numeric"
                           class="form-control"
                           placeholder="1234567">

                    <button type="button"
                            id="toggleAccountNumber"
                            class="account-toggle-button">
                        表示
                    </button>

                </div>

                <span id="bankAccountNumServerError"
                      class="text-danger server-error"
                      th:if="${#fields.hasErrors('bankAccountNum')}"
                      th:errors="*{bankAccountNum}">
            </span>

                <span id="bankAccountNumClientError"
                      class="text-danger client-error">
                </span>

            </div>
            </p>

            <p>
                <label class="ml-1">
                    年収（万円）:
                    <small class="text-danger ml-1">※</small>
                </label>
                <br>

                <input type="text"
                       th:field="*{annualIncome}"
                       id="annualIncome"
                       inputmode="numeric"
                       maxlength="6"
                       class="form-control"
                       placeholder="500">

                <span class="text-danger server-error"
                      th:if="${#fields.hasErrors('annualIncome')}"
                      th:errors="*{annualIncome}">
    </span>

                <span id="annualIncomeClientError"
                      class="text-danger client-error">
    </span>

            <div class="loan-limit-box">
        <span id="loanLimit">
            年収を入力してください
        </span>
            </div>
            </p>

            <p><label class="ml-1">希望借入金額（万円）: <small class="text-danger ml-1">※</small></label><br>
                <input type="text"
                       th:field="*{loanAmount}"
                       id="loanAmount"
                       inputmode="numeric"
                       maxlength="4"
                       class="form-control"
                       placeholder="300"/>

                <span id="loanAmountClientError"
                      class="text-danger client-error">
            </span>
                <span class="text-danger server-error"
                      th:if="${#fields.hasErrors('loanAmount')}"
                      th:errors="*{loanAmount}">
            </span>
                <span id="loanLimitClientError"
                      class="text-danger client-error">
            </span>
                <span id="loanLimitServerError"
                      class="text-danger server-error"
                      th:if="${#fields.hasErrors('loanAmountWithinLimit')}"
                      th:errors="*{loanAmountWithinLimit}">
            </span>
            </p>
            <p>
                <label>
                    金利（％）
                    <small class="interest-note">
                        ※借入限度額に応じて決まります
                    </small>
                </label>

            <div class="interest-rate-box">
                <span id="interestRateDisplay">％</span>
            </div>

            <input type="hidden"
                   th:field="*{interestRate}"
                   id="interestRate">
            </p>

            <p style="text-align: center;">
            <div class="button-area">
                <input type="button"
                       value="クリア"
                       class="form-control-button form-clear-button"
                       onclick="clearForm()">
                <input type="submit"
                       value="確認画面へ"
                       class="form-control-button confirm-button">
            </div>
            </p>
        </form>
    </div>
</div>

<script th:src="@{/js/bankLoanMain.js}"></script>

</body>

</html>
