<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8"/>
    <title>ローン申込情報入力画面</title>
    <style>
        body {
            /* 全体の背景を爽やかな薄いブルーのグラデーションに */
            background: linear-gradient(135deg, #f4f8fc, #e1ecf7);
            margin: 0;
            display: flex;
            padding: 40px 0;
            justify-content: center;
            align-items: center;
            min-height: 85vh;
            overflow: auto;
        }
        .content {
            /* カードを純白にし、リッチで優しい影をつける */
            background-color: #ffffff;
            width: 80%;
            max-width: 600px;
            padding: 30px 40px;
            box-sizing: border-box;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(33, 133, 208, 0.1);
            min-height: 50vh;
            overflow: auto;
        }
        h1 {
            font-size: 22px;
            color: #1a365d;
            margin-top: 0;
            margin-bottom: 25px;
            padding-bottom: 8px;
            border-bottom: 3px solid #3182ce;
            border-left: 6px solid #3182ce;
            padding-left: 10px;
        }
        fieldset {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px 20px 10px 20px;
            margin-bottom: 20px;
            background-color: #f7fafc;
        }
        legend {
            font-weight: bold;
            color: #2b6cb0;
            padding: 0 8px;
            font-size: 15px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            font-size: 14px;
            font-weight: bold;
            color: #2d3748;
        }
        .form-control {
            width: 100%;
            padding: 8px 10px;
            margin-top: 4px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #ffffff;
        }
        .form-control:focus {
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
            outline: none;
        }

        /* 入力欄の右に単位や敬称を並べる設定 */
        .input-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .input-group .form-control {
            flex: 1;
        }
        .input-suffix {
            font-size: 14px;
            font-weight: bold;
            color: #2d3748;
            white-space: nowrap;
        }

        /* 未入力エラー時の赤枠とエラーメッセージの共通スタイル */
        .text-danger {
            color: #e53e3e;
        }
        .form-control-button {
            width: 110px;
            padding: 10px 15px;
            margin: 10px 5px 0 5px;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .form-confirmation-button {
            color: white;
            background-color: #3182ce;
            box-shadow: 0 4px 10px rgba(49, 130, 206, 0.3);
        }
        .form-confirmation-button:hover {
            background-color: #2b6cb0;
        }
        .form-clear-button {
            color: #4a5568;
            background-color: #edf2f7;
        }
        .form-clear-button:hover {
            background-color: #e2e8f0;
        }
    </style>
</head>
<body>
<div class="content">
    <h1>ローン申込情報入力</h1>
    <form id="loanForm" action="#" th:action="@{/bankLoanConfirmation}" th:object="${bankLoanApplication}" method="post" novalidate>

        <!-- 口座情報グループ -->
        <fieldset>
            <legend>口座情報</legend>

            <!-- 金融機関名 -->
            <div class="form-group">
                <label>金融機関名 <small class="text-danger">※</small></label>
                <label style="display: block; width: 100%;">
                    <input type="text" th:field="*{bankName}" list="bankNameOptions" class="form-control" placeholder="例: テスト銀行 （選択または直接入力）" required/>
                </label>
                <datalist id="bankNameOptions">
                    <option th:each="option : ${nameOptions}" th:value="${option}"></option>
                </datalist>
            </div>

            <!-- 支店名 -->
            <div class="form-group">
                <label>支店名 <small class="text-danger">※</small></label>
                <label style="display: block; width: 100%;">
                    <input type="text" th:field="*{branchName}" class="form-control" placeholder="福岡支店" required/>
                </label>
            </div>

            <!-- 預金種別 -->
            <div class="form-group">
                <label>預金種別 <small class="text-danger">※</small></label>
                <label style="display: block; width: 100%;">
                    <select th:field="*{bankAccountType}" class="form-control" required>
                        <option value="">-- 選択してください --</option>
                        <option th:each="option : ${depositTypeOptions}"
                                th:value="${option}"
                                th:text="${option}">選択肢
                        </option>
                    </select>
                </label>
            </div>

            <!-- 口座番号 -->
            <div class="form-group">
                <label>口座番号 <small class="text-danger">※</small></label>
                <label style="display: block; width: 100%;">
                    <input type="number" th:field="*{bankAccountNum}" class="form-control" placeholder="1234567" required/>
                </label>
            </div>
        </fieldset>

        <!-- お客様情報グループ（自動保存・オートフィル対応） -->
        <fieldset>
            <legend>お客様情報</legend>

            <!-- 債務者名 -->
            <div class="form-group">
                <label>債務者名 <small class="text-danger">※</small></label>
                <div class="input-group">
                    <label style="flex: 1;">
                        <input type="text" th:field="*{name}" class="form-control" placeholder="山田 太郎" autocomplete="name" required/>
                    </label>
                    <span class="input-suffix">様</span>
                </div>
            </div>

            <!-- フリガナ -->
            <div class="form-group">
                <label>フリガナ <small class="text-danger">※</small></label>
                <div class="input-group">
                    <label style="flex: 1;">
                        <input type="text" th:field="*{nameKana}" class="form-control" placeholder="ヤマダ タロウ" autocomplete="name" required/>
                    </label>
                    <span class="input-suffix">様</span>
                </div>
            </div>

            <!-- 生年月日 -->
            <div class="form-group">
                <label for="birthDate">生年月日 <small class="text-danger">※</small></label>
                <input type="date" id="birthDate" th:field="*{birthDate}" class="form-control" autocomplete="day" required/>
            </div>

            <!-- 電話番号 -->
            <div class="form-group">
                <label for="phoneNumber">電話番号 <small class="text-danger">※</small></label>
                <input type="tel" id="phoneNumber" th:field="*{phoneNumber}" class="form-control" placeholder="090-1234-5678" autocomplete="tel" required/>
            </div>

            <!-- メールアドレス -->
            <div class="form-group">
                <label>メールアドレス <small class="text-danger">※</small></label>
                <label style="display: block; width: 100%;">
                    <input type="email" th:field="*{email}" class="form-control" placeholder="example@email.com" autocomplete="email" required/>
                </label>
            </div>

            <!-- 郵便番号 -->
            <div class="form-group">
                <label>郵便番号 <small class="text-danger">※</small></label>
                <label style="display: block; width: 100%;">
                    <input type="text" th:field="*{postalCode}" class="form-control" placeholder="810-0001" autocomplete="postal-code" required/>
                </label>
            </div>

            <!-- 住所 -->
            <div class="form-group">
                <label>住所 <small class="text-danger">※</small></label>
                <label style="display: block; width: 100%;">
                    <input type="text" th:field="*{address}" class="form-control" placeholder="福岡県福岡市中央区天神1-1-1" autocomplete="street-address" required/>
                </label>
            </div>
        </fieldset>

        <!-- ローン条件グループ -->
        <fieldset>
            <legend>ローン条件</legend>

            <!-- ローン種類 -->
            <div class="form-group">
                <label for="accountType">ローン種類 <small class="text-danger">※</small></label>
                <select id="accountType" th:field="*{accountType}" class="form-control" required>
                    <option value="">-- 選択してください --</option>
                    <option th:each="option : ${accountTypeOptions}"
                            th:value="${option}"
                            th:text="${option}">選択肢
                    </option>
                </select>
            </div>

            <!-- ★ 追加：ローン年数（返済期間） -->
            <div class="form-group">
                <label for="loanYears">返済期間（ローン年数） <small class="text-danger">※</small></label>
                <select id="loanYears" th:field="*{loanYears}" class="form-control" required>
                    <option value="">-- 選択してください --</option>
                    <option th:each="option : ${loanYearsOptions}"
                            th:value="${option}"
                            th:text="${option}">選択肢
                    </option>
                </select>
            </div>

            <!-- 借入年収 -->
            <div class="form-group">
                <label for="annualIncome">借入年収（万円） <small class="text-danger">※</small></label>
                <input type="number" id="annualIncome" th:field="*{annualIncome}" class="form-control" placeholder="400" required/>
            </div>

            <!-- 借入金額 -->
            <div class="form-group">
                <label for="loanAmount">借入金額（円） <small class="text-danger">※</small></label>
                <input type="text" id="loanAmount" th:field="*{loanAmount}" class="form-control" placeholder="1,000,000" required/>
            </div>

            <!-- 金利 -->
            <div class="form-group">
                <label for="interestRate">金利（％） <small class="text-danger">※</small></label>
                <input type="number" step="0.01" id="interestRate" th:field="*{interestRate}" class="form-control" placeholder="1.5" required/>
            </div>
        </fieldset>

        <!-- 確認ボタン / クリアボタン -->
        <p style="text-align: center; margin-top: 25px;">
            <input type="submit" value="確認" class="form-control-button form-confirmation-button"/>
            <input type="reset" value="クリア" class="form-control-button form-clear-button"/>
        </p>
    </form>
</div>

<script>
    const defaultInterestRates = {
        "住宅ローン": 0.85,
        "マイカーローン": 2.50,
        "教育ローン": 1.80,
        "フリーローン": 5.00,
        "カードローン": 14.00
    };

    document.addEventListener('DOMContentLoaded', function() {
        const birthDateInput = document.getElementById('birthDate');
        if (birthDateInput) {
            const today = new Date();
            const maxYear = today.getFullYear() - 20;
            const maxMonth = String(today.getMonth() + 1).padStart(2, '0');
            const maxDay = String(today.getDate()).padStart(2, '0');
            birthDateInput.max = `${maxYear}-${maxMonth}-${maxDay}`;
        }

        const loanAmountInput = document.getElementById('loanAmount');
        if (loanAmountInput && loanAmountInput.value) {
            let rawVal = loanAmountInput.value.replace(/,/g, '');
            if (!isNaN(rawVal) && rawVal !== '') {
                loanAmountInput.value = Number(rawVal).toLocaleString();
            }
        }
    });

    // 電話番号の自動ハイフン挿入処理
    const phoneInput = document.getElementById('phoneNumber');
    if (phoneInput) {
        phoneInput.addEventListener('input', function() {
            let value = this.value.replace(/[^0-9]/g, '');
            if (value.length > 3 && value.length <= 7) {
                value = value.slice(0, 3) + '-' + value.slice(3);
            } else if (value.length > 7) {
                value = value.slice(0, 3) + '-' + value.slice(3, 7) + '-' + value.slice(7, 11);
            }
            this.value = value;
        });
    }

    const accountTypeSelect = document.getElementById('accountType');
    const interestRateInput = document.getElementById('interestRate');

    if (accountTypeSelect && interestRateInput) {
        accountTypeSelect.addEventListener('change', function() {
            const selectedType = this.value;
            if (defaultInterestRates.hasOwnProperty(selectedType)) {
                interestRateInput.value = defaultInterestRates[selectedType];
            } else if (selectedType === "") {
                interestRateInput.value = "";
            }
        });
    }

    const loanAmountInput = document.getElementById('loanAmount');
    if (loanAmountInput) {
        loanAmountInput.addEventListener('focus', function() {
            this.value = this.value.replace(/,/g, '');
        });

        loanAmountInput.addEventListener('blur', function() {
            let val = this.value.replace(/,/g, '');
            if (val !== '' && !isNaN(val)) {
                this.value = Number(val).toLocaleString();
            }
        });
    }

    document.getElementById('loanForm').addEventListener('submit', function(e) {
        let isValid = true;
        const requiredInputs = this.querySelectorAll('[required]');

        this.querySelectorAll('.error-msg').forEach(el => el.remove());
        requiredInputs.forEach(input => input.classList.remove('is-invalid'));

        requiredInputs.forEach(input => {
            if (!input.value.trim()) {
                isValid = false;
                input.classList.add('is-invalid');

                const msg = document.createElement('span');
                msg.className = 'error-msg';
                msg.innerText = '※ この項目を入力（選択）してください。';

                if (input.parentNode.classList.contains('input-group')) {
                    input.parentNode.parentNode.appendChild(msg);
                } else {
                    input.parentNode.appendChild(msg);
                }
            }
        });

        const birthDateInput = document.getElementById('birthDate');
        if (birthDateInput && birthDateInput.value) {
            const birthDate = new Date(birthDateInput.value);
            const today = new Date();
            let adultDate = new Date(today.getFullYear() - 20, today.getMonth(), today.getDate());

            if (birthDate > adultDate) {
                isValid = false;
                birthDateInput.classList.add('is-invalid');

                const msg = document.createElement('span');
                msg.className = 'error-msg';
                msg.innerText = '※ 満20歳未満の方はローンを申し込むことができません。';
                birthDateInput.parentNode.appendChild(msg);
            }
        }

        const annualIncomeInput = document.getElementById('annualIncome');

        if (annualIncomeInput && loanAmountInput && annualIncomeInput.value && loanAmountInput.value) {
            const incomeYen = parseFloat(annualIncomeInput.value) * 10000;
            const loanAmountYen = parseFloat(loanAmountInput.value.replace(/,/g, ''));
            const maxLimit = Math.floor(incomeYen / 3);
            const minLimit = 10000;

            if (isNaN(loanAmountYen)) {
                isValid = false;
                loanAmountInput.classList.add('is-invalid');

                const msg = document.createElement('span');
                msg.className = 'error-msg';
                msg.innerText = '※ 有効な数値を入力してください。';
                loanAmountInput.parentNode.appendChild(msg);
            } else if (loanAmountYen < minLimit) {
                isValid = false;
                loanAmountInput.classList.add('is-invalid');

                const msg = document.createElement('span');
                msg.className = 'error-msg';
                msg.innerText = `※ 借入金額は ${minLimit.toLocaleString()}円 以上で入力してください。`;
                loanAmountInput.parentNode.appendChild(msg);
            } else if (loanAmountYen > maxLimit) {
                isValid = false;
                loanAmountInput.classList.add('is-invalid');

                const msg = document.createElement('span');
                msg.className = 'error-msg';
                msg.innerText = `※ 借入金額は年収の3分の1（${maxLimit.toLocaleString()}円）以下で入力してください。`;
                loanAmountInput.parentNode.appendChild(msg);
            }
        }

        if (loanAmountInput && loanAmountInput.value) {
            loanAmountInput.value = loanAmountInput.value.replace(/,/g, '');
        }

        if (!isValid) {
            e.preventDefault();
            const firstInvalid = this.querySelector('.is-invalid');
            if (firstInvalid) {
                firstInvalid.focus();
            }
        }
    });

    document.querySelector('.form-clear-button').addEventListener('click', function() {
        const form = document.getElementById('loanForm');
        form.querySelectorAll('.error-msg').forEach(el => el.remove());
        form.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));
    });
</script>
</body>
</html>
