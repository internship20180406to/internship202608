<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>基本情報</title>
    <style>
        body {
            background-color: #f2f2f2;
            color: #111111;
            margin: 0;
            padding: 50px 0;
            display: flex;
            justify-content: center;
            min-height: 85vh;
            font-family:
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    "Hiragino Kaku Gothic ProN",
                    "Yu Gothic",
                    sans-serif;
        }

        .content {
            background-color: #ffffff;
            width: 80%;
            max-width: 950px;
            padding: 35px;
            border: 1px solid #d0d0d0;
            border-radius: 6px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            padding-bottom: 15px;
            border-bottom: 3px solid #111111;
            font-size: 30px;
        }

        .section-title {
            margin-top: 35px;
            padding: 10px 0 10px 15px;
            border-left: 6px solid #111111;
            border-bottom: 1px solid #cccccc;
            color: #111111;
            font-size: 23px;
        }

        .form-group {
            margin: 16px 0;
        }

        form label {
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            max-width: 600px;
            padding: 11px;
            margin: 7px 0;
            box-sizing: border-box;
            color: #111111;
            background-color: #ffffff;
            border: 1px solid #777777;
            border-radius: 3px;
            font-size: 15px;
        }

        .form-control:focus {
            border: 2px solid #111111;
            outline: none;
        }

        .name-inputs {
            display: flex;
            gap: 12px;
            max-width: 600px;
        }

        .name-inputs .form-control {
            flex: 1;
            min-width: 0;
            max-width: none;
        }

        .text-danger {
            color: #c00000;
        }

        .button-area {
            margin-top: 30px;
            text-align: center;
        }

        .form-control-button {
            min-width: 100px;
            padding: 12px 22px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: 0.2s;
        }

        .form-confirmation-button {
            color: #ffffff;
            background-color: #111111;
            border: 2px solid #111111;
        }

        .form-confirmation-button:hover {
            color: #111111;
            background-color: #ffffff;
        }

        .form-clear-button {
            color: #111111;
            background-color: #ffffff;
            border: 2px solid #777777;
        }

        .form-clear-button:hover {
            background-color: #e5e5e5;
        }

        .form-control:user-invalid {
            border: 2px solid #dc3545 !important;
            background-color: #fff5f5;
            outline: none;
        }

        .form-control:user-invalid:focus {
            box-shadow: 0 0 4px rgba(220, 53, 69, 0.5);
        }

        .was-validated .form-control:invalid {
            border: 2px solid #dc3545;
            background-color: #fff5f5;
            outline: none;
        }

        .step-progress {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-bottom: 30px;
        }

        .progress-step {
            padding: 10px 5px;
            text-align: center;
            color: #555555;
            background-color: #e0e0e0;
            border-radius: 3px;
            font-size: 14px;
        }

        .progress-step.active {
            color: #ffffff;
            background-color: #111111;
            font-weight: bold;
        }

        .progress-step.completed {
            color: #111111;
            background-color: #bfbfbf;
        }

        @media (max-width: 700px) {
            body {
                padding: 20px 0;
            }

            .content {
                width: 90%;
                padding: 20px;
            }

            h1 {
                font-size: 25px;
            }

            .name-inputs {
                display: block;
            }
        }

        form > p,
        .form-group {
            margin-top: 26px;
            margin-bottom: 26px;
        }

        .form-control.is-invalid {
            border: 2px solid #dc3545 !important;
            background-color: #fff5f5;
            outline: none;
        }

        .field-error {
            display: block;
            max-width: 600px;
            margin-top: 5px;
            color: #c00000;
            font-size: 13px;
            font-weight: 600;
        }

        /* 姓と名の両方が未入力でも、メッセージは1つだけ表示 */
        .name-inputs ~ .field-error + .field-error {
            display: none;
        }

        .search-control {
            display: block;
            width: 100%;
            max-width: 600px;
            padding: 8px;
            margin: 8px 0 5px;
            box-sizing: border-box;
            border: 1px solid #aaaaaa;
            border-radius: 4px;
            background-color: #f7f7f7;
        }

        .search-control:focus {
            border-color: #333333;
            outline: none;
            box-shadow: 0 0 3px rgba(0, 0, 0, 0.25);
        }

        .bank-information {
            max-width: 600px;
            margin: 20px 0 30px;
            padding: 18px 20px;
            background-color: #f5f5f5;
            border-left: 6px solid #111111;
        }

        .bank-information-main {
            margin: 0 0 8px;
            font-size: 18px;
            font-weight: bold;
        }

        .bank-information-sub {
            margin: 0;
            color: #555555;
            font-size: 14px;
        }

        .account-verification-error {
            max-width: 600px;
            margin: 20px 0;
            padding: 15px 20px;
            color: #a00000;
            background-color: #fff5f5;
            border: 2px solid #dc3545;
            border-radius: 4px;
            font-weight: bold;
        }

    </style>
</head>
<body>
<div class="content">

    <div class="step-progress">
        <div class="progress-step active" aria-current="step">1. 基本情報</div>
        <div class="progress-step">2. 借入内容</div>
        <div class="progress-step">3. 内容確認</div>
        <div class="progress-step">4. 申込完了</div>
    </div>

    <h1>口座情報の確認</h1>

    <div class="bank-information">
        <p class="bank-information-main">
            カウカウ銀行の口座をお持ちのお客さま
        </p>

        <p class="bank-information-sub">
            ご本人様確認のため、口座情報と生年月日を
            入力してください。
        </p>
    </div>

    <div class="account-verification-error"
         th:if="${accountVerificationError != null}"
         th:text="${accountVerificationError}"
         role="alert">
    </div>

    <form th:action="@{/bankLoanDetails}"
          th:object="${bankLoanApplication}"
          method="post"
          class="needs-validation">

        <!-- 確認画面から戻った場合に借入内容を保持 -->
        <input type="hidden"
               th:field="*{desiredLoanAmount}"/>

        <input type="hidden"
               th:field="*{loanYears}"/>

        <input type="hidden"
               th:field="*{annualIncome}"/>

        <input type="hidden"
               th:field="*{interestType}"/>

        <input type="hidden"
               th:field="*{interestRate}"/>

        <!-- 当行はカウカウ銀行で固定 -->
        <input type="hidden"
               th:field="*{bankName}"/>

        <h2 class="section-title">ご返済用口座</h2>

        <p>
            <label for="branchName">
                支店名:
                <small class="text-danger">※</small>
            </label><br>

            <select id="branchName"
                    th:field="*{branchName}"
                    class="form-control"
                    data-required-message="支店名を選択してください。"
                    required>

                <option value="">選択してください</option>

                <option th:each="branch : ${branchOptions}"
                        th:value="${branch}"
                        th:text="${branch}">
                </option>
            </select>
        </p>

        <p>
            <label for="subjectName">
                科目名:
                <small class="text-danger">※</small>
            </label><br>

            <select id="subjectName"
                    th:field="*{subjectName}"
                    class="form-control"
                    data-required-message="科目名を選択してください。"
                    required>

                <option value="">選択してください</option>

                <option th:each="subject : ${subjectOptions}"
                        th:value="${subject}"
                        th:text="${subject}">
                </option>
            </select>
        </p>

        <p>
            <label for="bankAccountNum">
                口座番号:
                <small class="text-danger">※</small>
            </label><br>

            <input type="text"
                   id="bankAccountNum"
                   th:field="*{bankAccountNum}"
                   class="form-control"
                   inputmode="numeric"
                   pattern="[0-9]{7}"
                   minlength="7"
                   maxlength="7"
                   data-required-message="口座番号を入力してください。"
                   data-pattern-message="口座番号は半角数字7桁で入力してください。"
                   placeholder="2200001"
                   title="口座番号は半角数字7桁で入力してください"
                   autocomplete="off"
                   required/>
        </p>

        <p>
            <label for="birthDate">
                生年月日:
                <small class="text-danger">※</small>
            </label><br>

            <input type="date"
                   id="birthDate"
                   th:field="*{birthDate}"
                   th:max="${today}"
                   class="form-control"
                   data-required-message="生年月日を入力してください。"
                   title="この日付は選択できません"
                   autocomplete="bday"
                   required/>
        </p>

        <p class="button-area">
            <input type="reset"
                   value="クリア"
                   class="form-control-button form-clear-button"/>

            <input type="submit"
                   value="口座を確認して次へ"
                   class="form-control-button form-confirmation-button"/>
        </p>
    </form>
</div>

<script th:src="@{/js/bankLoanValidation.js}"></script>

</body>

</html>
