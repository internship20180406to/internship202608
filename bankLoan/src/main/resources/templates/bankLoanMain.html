<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>基本情報</title>
    <style>
        body {
            background-color: #f2f2f2;
            color: #111111;
            margin: 0;
            padding: 50px 0;
            display: flex;
            justify-content: center;
            min-height: 85vh;
            font-family:
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    "Hiragino Kaku Gothic ProN",
                    "Yu Gothic",
                    sans-serif;
        }

        .content {
            background-color: #ffffff;
            width: 80%;
            max-width: 950px;
            padding: 35px;
            border: 1px solid #d0d0d0;
            border-radius: 6px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            padding-bottom: 15px;
            border-bottom: 3px solid #111111;
            font-size: 30px;
        }

        .section-title {
            margin-top: 35px;
            padding: 10px 0 10px 15px;
            border-left: 6px solid #111111;
            border-bottom: 1px solid #cccccc;
            color: #111111;
            font-size: 23px;
        }

        .form-group {
            margin: 16px 0;
        }

        form label {
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            max-width: 600px;
            padding: 11px;
            margin: 7px 0;
            box-sizing: border-box;
            color: #111111;
            background-color: #ffffff;
            border: 1px solid #777777;
            border-radius: 3px;
            font-size: 15px;
        }

        .form-control:focus {
            border: 2px solid #111111;
            outline: none;
        }

        .name-inputs {
            display: flex;
            gap: 12px;
            max-width: 600px;
        }

        .name-inputs .form-control {
            flex: 1;
            min-width: 0;
            max-width: none;
        }

        .text-danger {
            color: #c00000;
        }

        .button-area {
            margin-top: 30px;
            text-align: center;
        }

        .form-control-button {
            min-width: 100px;
            padding: 12px 22px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: 0.2s;
        }

        .form-confirmation-button {
            color: #ffffff;
            background-color: #111111;
            border: 2px solid #111111;
        }

        .form-confirmation-button:hover {
            color: #111111;
            background-color: #ffffff;
        }

        .form-clear-button {
            color: #111111;
            background-color: #ffffff;
            border: 2px solid #777777;
        }

        .form-clear-button:hover {
            background-color: #e5e5e5;
        }

        .form-control:user-invalid {
            border: 2px solid #dc3545 !important;
            background-color: #fff5f5;
            outline: none;
        }

        .form-control:user-invalid:focus {
            box-shadow: 0 0 4px rgba(220, 53, 69, 0.5);
        }

        .was-validated .form-control:invalid {
            border: 2px solid #dc3545;
            background-color: #fff5f5;
            outline: none;
        }

        .step-progress {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-bottom: 30px;
        }

        .progress-step {
            padding: 10px 5px;
            text-align: center;
            color: #555555;
            background-color: #e0e0e0;
            border-radius: 3px;
            font-size: 14px;
        }

        .progress-step.active {
            color: #ffffff;
            background-color: #111111;
            font-weight: bold;
        }

        .progress-step.completed {
            color: #111111;
            background-color: #bfbfbf;
        }

        @media (max-width: 700px) {
            body {
                padding: 20px 0;
            }

            .content {
                width: 90%;
                padding: 20px;
            }

            h1 {
                font-size: 25px;
            }

            .name-inputs {
                display: block;
            }
        }

        form > p,
        .form-group {
            margin-top: 26px;
            margin-bottom: 26px;
        }

        .form-control.is-invalid {
            border: 2px solid #dc3545 !important;
            background-color: #fff5f5;
            outline: none;
        }

        .field-error {
            display: block;
            max-width: 600px;
            margin-top: 5px;
            color: #c00000;
            font-size: 13px;
            font-weight: 600;
        }

        /* 姓と名の両方が未入力でも、メッセージは1つだけ表示 */
        .name-inputs ~ .field-error + .field-error {
            display: none;
        }

    </style>
</head>
<body>
<div class="content">

    <div class="step-progress">
        <div class="progress-step active" aria-current="step">1. 基本情報</div>
        <div class="progress-step">2. 借入内容</div>
        <div class="progress-step">3. 内容確認</div>
        <div class="progress-step">4. 申込完了</div>
    </div>

    <h1>基本情報</h1>

    <form action="#" th:action="@{/bankLoanDetails}" th:object="${bankLoanApplication}" method="post"
          class="needs-validation">
        <!-- 確認画面から戻ったときに借入条件を保持する -->
        <input type="hidden" th:field="*{desiredLoanAmount}"/>
        <input type="hidden" th:field="*{loanYears}"/>
        <input type="hidden" th:field="*{interestType}"/>
        <input type="hidden" th:field="*{interestRate}"/>
        <h2 class="section-title">ご本人様情報</h2>
        <div class="form-group">
            <label>
                お名前:
                <small class="text-danger">※</small>
            </label>

            <div class="name-inputs">
                <input type="text"
                       th:field="*{debtorLastName}"
                       class="form-control"
                       placeholder="姓"
                       minlength="1"
                       maxlength="20"
                       pattern="[^0-9０-９]*[^0-9０-９\s][^0-9０-９]*"
                       title="姓は数字や空白だけでは入力できません"
                       autocomplete="family-name"
                       required/>

                <input type="text"
                       th:field="*{debtorFirstName}"
                       class="form-control"
                       placeholder="名"
                       minlength="1"
                       maxlength="20"
                       pattern="[^0-9０-９]*[^0-9０-９\s][^0-9０-９]*"
                       title="名は数字や空白だけでは入力できません"
                       autocomplete="given-name"
                       required/>
            </div>
        </div>
        <p>
            <label class="ml-1">
                生年月日:
                <small class="text-danger ml-1">※</small>
            </label><br>

            <input type="date"
                   th:field="*{birthDate}"
                   th:max="${today}"
                   class="form-control"
                   title="この日付は選択できません"
                   required/>
        </p>
        <p>
            <label>
                ご本人様の前年度年収（税込）:
                <small class="text-danger">※</small>
            </label><br>

            <input type="number"
                   th:field="*{annualIncome}"
                   class="form-control"
                   min="200"
                   max="100000"
                   placeholder="500"
                   step="1"
                   title="年収は200万円以上10億円以下で入力してください"
                   required/>
            <span>万円</span>
        </p>
        <h2 class="section-title">口座情報</h2>
        <p><label class="ml-1">金融機関名: <small class="text-danger ml-1">※</small></label><br>
            <select th:field="*{bankName}" class="form-control" required>
                <option value="">選択してください</option>
                <option th:each="option : ${nameOptions}"
                        th:value="${option}"
                        th:text="${option}">選択肢
                </option>
            </select></p>
        <p><label class="ml-1">支店名: <small class="text-danger ml-1">※</small></label><br>
            <select th:field="*{branchName}" class="form-control" required>
                <option value="">選択してください</option>
                <option th:each="option : ${branchOptions}"
                        th:value="${option}"
                        th:text="${option}">選択肢
                </option>
            </select>
        <p><label class="ml-1">科目名:<small class="text-danger ml-1">※</small></label><br>
            <select th:field="*{subjectName}" class="form-control"
                    required>
                <option value="">選択してください</option>

                <option th:each="subject : ${subjectOptions}"
                        th:value="${subject}"
                        th:text="${subject}">
                </option>
            </select>
        </p>


        <p><label class="ml-1">口座番号: <small class="text-danger ml-1">※</small></label><br>
            <input type="text"
                   th:field="*{bankAccountNum}"
                   class="form-control"
                   inputmode="numeric"
                   pattern="[0-9]{7}"
                   minlength="7"
                   maxlength="7"
                   placeholder="1234567"
                   title="口座番号は半角数字7桁で入力してください"
                   required/>

        <p class="button-area">
            <input type="reset"
                   value="クリア"
                   class="form-control-button form-clear-button"/>

            <input type="submit"
                   value="次へ"
                   class="form-control-button form-confirmation-button"/>
        </p>
    </form>
</div>

<script src="/js/bankLoanValidation.js"></script>
</body>

</html>
