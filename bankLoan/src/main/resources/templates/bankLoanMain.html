<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>ローン申込情報入力画面</title>
    <style>
        body {
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            padding-top: 40px;
            padding-bottom: 40px;
            justify-content: center;
            align-items: center;
            min-height: 85vh;
            overflow: auto;
        }

        .content {
            background-color: #ffffff;
            width: 80%;
            max-width: 600px; /* ★幅が広がりすぎるのを防ぐ */
            padding: 30px 40px; /* ★余白を広げて文字を端から離す */
            box-sizing: border-box; /* ★余白を含めて幅を適切に計算する */
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            min-height: 50vh;
            overflow: auto;
        }

        .form-control {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            box-sizing: border-box;
        }
        .text-danger {
            color: red;
        }
        .form-control-button {
            width: 80px;
            padding: 10px 20px;
            margin-top: 10px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        .form-confirmation-button {
            color: white;
            background-color: #2185D0;
        }
        .form-confirmation-button:hover {
            background-color: #1678c2;
        }
        .form-clear-button {
            color: black;
            background-color: #E0E1E2;
        }
        .form-clear-button:hover {
            background-color: #CCCCCC;
        }
    </style>
</head>
<body>
<div class="content">
    <h1>ローン申込情報入力</h1>
    <form action="#" th:action="@{/bankLoanConfirmation}" th:object="${bankLoanApplication}" method="post">
        <!-- 金融機関名 -->
        <p><label class="ml-1">金融機関名: <small class="text-danger ml-1">※</small></label><br>
            <select th:field="*{bankName}" class="form-control">
                <option th:each="option : ${nameOptions}"
                        th:value="${option}"
                        th:text="${option}">選択肢
                </option>
            </select></p>

        <!-- 支店名 -->
        <p><label class="ml-1">支店名: <small class="text-danger ml-1">※</small></label><br>
            <input type="text" th:field="*{branchName}" class="form-control" placeholder="福岡支店"/></p>

        <!-- 科目名（プルダウン選択） -->
        <p><label class="ml-1">科目名: <small class="text-danger ml-1">※</small></label><br>
            <select th:field="*{accountType}" class="form-control">
                <option value="">-- 選択してください --</option>
                <option th:each="option : ${accountTypeOptions}"
                        th:value="${option}"
                        th:text="${option}">選択肢
                </option>
            </select></p>

        <!-- 口座番号 -->
        <p><label class="ml-1">口座番号: <small class="text-danger ml-1">※</small></label><br>
            <input type="number" th:field="*{bankAccountNum}" class="form-control" placeholder="1234567"/></p>

        <!-- 債務者名（旧：口座名義） -->
        <p><label class="ml-1">債務者名: <small class="text-danger ml-1">※</small></label><br>
            <input type="text" th:field="*{debtorName}" class="form-control" placeholder="山田 太郎"/></p>

        <!-- 借入金額（旧：金額） -->
        <p><label class="ml-1">借入金額（円）: <small class="text-danger ml-1">※</small></label><br>
            <input type="number" th:field="*{borrowingAmount}" class="form-control" placeholder="1000000"/></p>

        <!-- 借入年収（追加） -->
        <p><label class="ml-1">借入年収（万円）: <small class="text-danger ml-1">※</small></label><br>
            <input type="number" th:field="*{annualIncome}" class="form-control" placeholder="400"/></p>

        <!-- 金利（追加） -->
        <p><label class="ml-1">金利（％）: <small class="text-danger ml-1">※</small></label><br>
            <input type="number" step="0.01" th:field="*{interestRate}" class="form-control" placeholder="1.5"/></p>


        <!-- 確認ボタン / クリアボタン -->
        <p style="text-align: center;">
            <input type="submit" value="確認" class="form-control-button form-confirmation-button"/>
            <input type="reset" value="クリア" class="form-control-button form-clear-button"/>
        </p>
    </form>
</div>
</body>
</html>
