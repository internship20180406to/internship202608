<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>ローン申込情報入力画面</title>
    <style>
        body {
        background-color: #f0f0f0;
        margin: 0;
        padding: 0;
        display: flex;
        padding-top: 40px;
        padding-bottom: 40px;
        justify-content: center;
        align-items: center;
        min-height: 85vh;
        overflow: auto;
        }
        .content {
         background-color: #ffffff;
         width: 80%;
         padding: 20px;
         border-radius: 10px;
         box-shadow: 0 4px 8px rgba(0,0,0,0.1);
         min-height: 50vh;
         overflow: auto;
        }
        .form-control {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            box-sizing: border-box;
        }
        .text-danger {
        color: red;
        }
        .form-control-button {
        width: 80px;
        padding: 10px 20px;
        margin-top: 10px;
        border: none;
        cursor: pointer;
        border-radius: 5px;
        }
        .form-confirmation-button{
        color: white;
        background-color: #2185D0;
        }
        .form-confirmation-button:hover {
        background-color: #1678c2;
        }
        .form-clear-button{
        color: black;
        background-color: #E0E1E2;
        }
        .form-clear-button:hover {
        background-color: #CCCCCC;
        }

    </style>
</head>
<body>
<div class="content">
    <h1>ローン申込情報入力</h1>
    <form action="#" th:action="@{/bankLoanConfirmation}" th:object="${bankLoanApplication}" method="post">

        <p><label class="ml-1">債務者名: <small class="text-danger ml-1">※</small></label><br>
            <input type="text"
                   th:field="*{name}"
                   class="form-control"
                   placeholder="債務者名を入力してください">

            <span class="text-danger validation-error"
                  th:if="${#fields.hasErrors('name')}"
                  th:errors="*{name}">
            </span>
        </p>

        <p><label class="ml-1">金融機関名: <small class="text-danger ml-1">※</small></label><br>
            <select th:field="*{bankName}"
                    id="bankName"
                    class="form-control">
                <option value="">選択してください</option>

                <option th:each="option : ${nameOptions}"
                        th:value="${option}"
                        th:text="${option}">選択肢
                </option>
            </select>

            <span class="text-danger validation-error"
                  th:if="${#fields.hasErrors('bankName')}"
                  th:errors="*{bankName}">
            </span>
        </p>

        <p>
            <label class="ml-1">支店名: <small class="text-danger ml-1">※</small></label><br>

            <input type="text"
                   id="branchSearch"
                   class="form-control"
                   placeholder="支店名を検索">

            <select th:field="*{branchName}"
                    id="branchName"
                    class="form-cobntrol"
                    th:data-selected="${branchName}">

                <option value="">金融機関を先に選択してください</option>
            </select>

            <input type="hidden"
                   id="selectedBranch"
                   th:value="*{branchName}">

            <span class="text-danger validation-error"
                  th:if="${#fields.hasErrors('branchName')}"
                  th:errors="*{branchName}">
            </span>
        </p>

        <p><label class="ml-1">科目名: <small class="text-danger ml-1">※</small></label><br>
            <select th:field="*{bankAccountType}" class="form-control">
                <option value="">選択してください</option>
                <option value="普通預金">普通預金</option>
                <option value="当座預金">当座預金</option>
            </select>

            <span class="text-danger validation-error"
                  th:if="${#fields.hasErrors('bankAccountType')}"
                  th:errors="*{bankAccountType}">
            </span>
        </p>

        <p><label class="ml-1">口座番号: <small class="text-danger ml-1">※</small></label><br>
            <input type="text"
                   th:field="*{bankAccountNum}"
                   maxlength="7"
                   inputmode="numeric"
                   class="form-control"
                   placeholder="1234567"/>
            <span class="text-danger validation-error"
                  th:if="${#fields.hasErrors('bankAccountNum')}"
                  th:errors="*{bankAccountNum}">
            </span>
        </p>

        <p><label class="ml-1">借入年収（万円）: <small class="text-danger ml-1">※</small></label><br>
            <input type="text"
                   th:field="*{annualIncome}"
                   inputmode="numeric"
                   maxlength="7"
                   class="form-control"
                   placeholder="500"/>
            <span class="text-danger validation-error"
                  th:if="${#fields.hasErrors('annualIncome')}"
                  th:errors="*{annualIncome}">
            </span>
            <span id="loanLimit"></span>
        </p>

        <p><label class="ml-1">希望借入金額（万円）: <small class="text-danger ml-1">※</small></label><br>
            <input type="text"
                   th:field="*{loanAmount}"
                   inputmode="numeric"
                   maxlength="6"
                   class="form-control"
                   placeholder="300"/>
            <span class="text-danger validation-error"
                  th:if="${#fields.hasErrors('loanAmount')}"
                  th:errors="*{loanAmount}">
            </span>
            <span class="text-danger validation-error"
                  th:if="${#fields.hasErrors('loanAmountWithinLimit')}"
                  th:errors="*{loanAmountWithinLimit}">
            </span>
        </p>

        <p><label class="ml-1">金利（％）: <small class="text-danger ml-1">※</small></label><br>
            <input type="number"
               th:field="*{interestRate}"
               min="0"
               max="20"
               step="0.01"
               class="form-control"
               placeholder="2.50">
            <span class="text-danger validation-error"
                  th:if="${#fields.hasErrors('interestRate')}"
                  th:errors="*{interestRate}">
            </span>
        </p>

        <p style="text-align: center;"><input type="submit" value="確認"
                                              class="form-control-button form-confirmation-button"/>
            <input type="button"
                   value="クリア"
                   class="form-control-button form-clear-button"
                   onclick="clearForm()"/>
        </p>
    </form>
</div>

<script>
    function clearForm() {
        const form = document.querySelector('form');

        form.querySelectorAll('input[type="text"], input[type="number"]').forEach(input => {
            input.value = '';
        });

        form.querySelectorAll('select').forEach(select => {
            select.selectedIndex = 0;
        });

        form.querySelectorAll('.validation-error').forEach(error => {
            error.style.display = 'none';
        });
    }

    document.querySelectorAll('input, select').forEach(element => {
        element.addEventListener('input', function () {
            const error = this.closest('p').querySelector('.validation-error');

            if (error) {
                error.style.display = 'none';
            }
        });

        element.addEventListener('change', function () {
            const error = this.closest('p').querySelector('.validation-error');

            if (error) {
                error.style.display = 'none';
            }
        });
    });

    const loanAmount = document.getElementById('loanAmount');
    const interestRate = document.getElementById('interestRate');

    loanAmount.addEventListener('input', function () {
        const amount = Number(this.value);

        if (amount >= 10 && amount <= 100) {
            interestRate.value = 14.5;
        } else if (amount > 100 && amount <= 200) {
            interestRate.value = 12.0;
        } else if (amount > 200 && amount <= 300) {
            interestRate.value = 10.0;
        } else if (amount > 300 && amount <= 400) {
            interestRate.value = 8.0;
        } else if (amount > 400 && amount <= 500) {
            interestRate.value = 7.0;
        } else if (amount > 500 && amount <= 600) {
            interestRate.value = 6.0;
        } else if (amount > 600 && amount <= 700) {
            interestRate.value = 5.0;
        } else if (amount > 700 && amount <= 800) {
            interestRate.value = 4.0;
        } else if (amount > 800 && amount <= 1000) {
            interestRate.value = 0.95;
        } else {
            interestRate.value = '';
        }

        interestRate.dispatchEvent(new Event('input', { bubbles: true }));
    });

    const annualIncome = document.getElementById('annualIncome');
    const loanLimit = document.getElementById('loanLimit');

    function updateLoanLimit() {
        const income = Number(annualIncome.value);

        if (this.value === '' || Number.isNaN(income)) {
            loanLimit.textContent = '借入限度額：0万円';
            return;
        }

        const limit = Math.floor((income * 0.5) / 10) * 10;

        loanLimit.textContent = '借入限度額：' + limit + '万円';
    }

    annualIncome.addEventListener('input', updateLoanLimit);

    updateLoanLimit();
    const branchOptions = {
        "山陰共同銀行": [
        "中央支店",
        "北町支店",
        "南町支店"
        ],
        "なないろ銀行": [
        "虹ヶ丘支店",
        "若葉支店",
        "星川支店"
        ],
        "桜中央銀行": [
        "桜町支店",
        "青葉支店",
        "みどり支店"
        ],
        "みなと未来信用銀行": [
        "港中央支店",
        "海岸支店",
        "未来町支店"
        ],
        "つばさ中央銀行": [
        "つばさ支店",
        "東中央支店",
        "西中央支店"
        ]
    };

    const bankNameSelect = document.getElementById('bankName');
    const branchNameSelect = document.getElementById('branchName');
    const branchSearch = document.getElementById('branchSearch');
    const selectedBranchInput = document.getElementById('selectedBranch');

    function updateBranchOptions(selectedBranch = '', keyword = '') {

        const selectedBank = bankNameSelect.value;

        // 支店の選択肢をいったん削除
        branchNameSelect.innerHTML = '';

        // 最初の選択肢を作成
        const defaultOption = document.createElement('option');
        defaultOption.value = '';

        if (selectedBank === '') {
            defaultOption.textContent = '金融機関を先に選択してください';
        } else {
            defaultOption.textContent = '選択してください';
        }

        branchNameSelect.appendChild(defaultOption);

        // 選択された金融機関の支店を取得
        const branches = branchOptions[selectedBank];

        if (branches) {

            branches
                .filter(branch => branch.includes(keyword))
                .forEach(branch => {

                    const option = document.createElement('option');

                    option.value = branch;
                    option.textContent = branch;

                    branchNameSelect.appendChild(option);
                });
        }

        // 選択していた支店を復元
        if (selectedBranch !== '') {
            branchNameSelect.value = selectedBranch;
        }
    }


    // 金融機関を変更したとき
    bankNameSelect.addEventListener('change', function () {

        branchSearch.value = '';
        selectedBranchInput.value = '';

        updateBranchOptions();
    });


    // 支店を検索したとき
    branchSearch.addEventListener('input', function () {

        // 検索前に現在選択している支店を覚える
        const selectedBranch = branchNameSelect.value;

        selectedBranchInput.value = this.value;
    });

    // 支店を検索したとき
    branchSearch.addEventListener('input', function () {

        const currentBranch = selectedBranchInput.value;

        updateBranchOptions(
            currentBranch,
            this.value
        );
    });


    // バリデーションエラーなどで画面が再表示されたとき
    const savedBranch = selectedBranchInput.value;

    updateBranchOptions(savedBranch);
</script>

</body>

</html>
