<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8"/>
    <title>ローン申込情報入力画面</title>
    <style>
        body {
            background: linear-gradient(135deg, #f4f8fc, #e1ecf7);
            margin: 0;
            display: flex;
            flex-direction: column;
            padding: 40px 20px;
            align-items: center;
            min-height: 100vh;
        }

        .wrapper {
            width: 80%;
            max-width: 600px;
        }

        .home-back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #2b6cb0;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 16px;
            padding: 8px 14px;
            background-color: #ffffff;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
            transition: all 0.2s ease;
        }
        .home-back-link:hover {
            background-color: #ebf8ff;
            color: #2b6cb0;
            border-color: #3182ce;
            box-shadow: 0 4px 8px rgba(49, 130, 206, 0.15);
            transform: translateY(-1px);
        }

        .content {
            background-color: #ffffff;
            width: 100%;
            padding: 30px 40px;
            box-sizing: border-box;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(33, 133, 208, 0.1);
        }
        h1 {
            font-size: 22px;
            color: #1a365d;
            margin-top: 0;
            margin-bottom: 25px;
            padding-bottom: 8px;
            border-bottom: 3px solid #3182ce;
            border-left: 6px solid #3182ce;
            padding-left: 10px;
        }
        fieldset {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px 20px 10px 20px;
            margin-bottom: 20px;
            background-color: #f7fafc;
        }
        legend {
            font-weight: bold;
            color: #2b6cb0;
            padding: 0 8px;
            font-size: 15px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            font-size: 14px;
            font-weight: bold;
            color: #2d3748;
        }
        .form-control {
            width: 100%;
            padding: 8px 10px;
            margin-top: 4px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #ffffff;
        }
        .form-control:focus {
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
            outline: none;
        }
        .form-control.is-invalid {
            border-color: #e53e3e;
            background-color: #fff5f5;
        }
        .form-control:disabled {
            background-color: #edf2f7;
            cursor: not-allowed;
        }
        .input-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .input-group .form-control {
            flex: 1;
        }
        .input-suffix {
            font-size: 14px;
            font-weight: bold;
            color: #2d3748;
            white-space: nowrap;
        }
        .text-danger {
            color: #e53e3e;
        }
        .error-msg {
            display: block;
            color: #e53e3e;
            font-size: 12px;
            margin-top: 4px;
            font-weight: bold;
        }
        .warning-banner {
            background-color: #fffaf0;
            border: 1px solid #ecc94b;
            color: #c05621;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-top: 6px;
            font-weight: bold;
            display: none;
        }
        .limit-guide {
            font-size: 12px;
            color: #4a5568;
            margin-top: 5px;
            font-weight: bold;
            display: none;
        }
        .interest-notice {
            font-size: 12px;
            color: #4a5568;
            background-color: #edf2f7;
            border-left: 4px solid #3182ce;
            padding: 8px 12px;
            margin-top: 6px;
            border-radius: 0 4px 4px 0;
            line-height: 1.5;
        }
        .live-calc-box {
            background-color: #ebf8ff;
            border: 1px solid #90cdf4;
            border-radius: 8px;
            padding: 14px 16px;
            margin-top: 15px;
        }
        .live-calc-title {
            font-size: 12px;
            color: #2b6cb0;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .live-calc-grid {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }
        .live-calc-item {
            flex: 1;
        }
        .live-calc-label {
            font-size: 11px;
            color: #4a5568;
        }
        .live-calc-value {
            font-size: 17px;
            font-weight: bold;
            color: #1a365d;
        }
        .live-calc-value span {
            font-size: 12px;
            font-weight: normal;
        }
        #bonusAmountWrapper {
            display: none;
            margin-top: 8px;
            padding-left: 12px;
            border-left: 3px solid #cbd5e0;
        }
        .form-control-button {
            width: 110px;
            padding: 10px 15px;
            margin: 10px 5px 0 5px;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .form-confirmation-button {
            color: white;
            background-color: #3182ce;
            box-shadow: 0 4px 10px rgba(49, 130, 206, 0.3);
        }
        .form-confirmation-button:hover {
            background-color: #2b6cb0;
        }
        .form-clear-button {
            color: #4a5568;
            background-color: #edf2f7;
        }
        .form-clear-button:hover {
            background-color: #e2e8f0;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <a th:href="@{/}" class="home-back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        ホームページに戻る
    </a>

    <div class="content">
        <h1>ローン申込情報入力</h1>

        <form id="loanForm" action="#" th:action="@{/bankLoanConfirmation}" th:object="${bankLoanApplication}" method="post" novalidate>

            <!-- 口座情報グループ -->
            <fieldset>
                <legend>口座情報</legend>

                <div class="form-group">
                    <label for="bankName">金融機関名 <small class="text-danger">※</small></label>
                    <select id="bankName" th:field="*{bankName}" class="form-control" th:classappend="${#fields.hasErrors('bankName')} ? 'is-invalid' : ''" required>
                        <option value="">-- 金融機関を選択してください --</option>
                        <option value="あおぞら未来銀行">あおぞら未来銀行</option>
                        <option value="ネクストワン銀行">ネクストワン銀行</option>
                        <option value="新日本総合銀行">新日本総合銀行</option>
                    </select>
                    <span class="error-msg" th:if="${#fields.hasErrors('bankName')}" th:errors="*{bankName}"></span>
                </div>

                <div class="form-group">
                    <label for="branchName">支店名 <small class="text-danger">※</small></label>
                    <select id="branchName" th:field="*{branchName}" class="form-control" th:classappend="${#fields.hasErrors('branchName')} ? 'is-invalid' : ''" disabled required>
                        <option value="">-- 先に金融機関を選択してください --</option>
                    </select>
                    <span class="error-msg" th:if="${#fields.hasErrors('branchName')}" th:errors="*{branchName}"></span>
                </div>

                <div class="form-group">
                    <label>預金種別 <small class="text-danger">※</small></label>
                    <select th:field="*{bankAccountType}" class="form-control" th:classappend="${#fields.hasErrors('bankAccountType')} ? 'is-invalid' : ''" required>
                        <option value="">-- 選択してください --</option>
                        <option th:each="option : ${depositTypeOptions}"
                                th:value="${option}"
                                th:text="${option}">選択肢
                        </option>
                    </select>
                    <span class="error-msg" th:if="${#fields.hasErrors('bankAccountType')}" th:errors="*{bankAccountType}"></span>
                </div>

                <div class="form-group">
                    <label for="bankAccountNum">口座番号 <small class="text-danger">※</small></label>
                    <input type="text" id="bankAccountNum" th:field="*{bankAccountNum}" class="form-control" th:classappend="${#fields.hasErrors('bankAccountNum')} ? 'is-invalid' : ''" maxlength="7" autocomplete="off" placeholder="半角数字7桁" required/>
                    <small style="display: block; color: #718096; font-size: 12px; margin-top: 4px;">※半角数字で入力してください</small>
                    <span class="error-msg" th:if="${#fields.hasErrors('bankAccountNum')}" th:errors="*{bankAccountNum}"></span>
                </div>
            </fieldset>

            <!-- お客様情報グループ -->
            <fieldset>
                <legend>お客様情報</legend>

                <div class="form-group">
                    <label>債務者名 <small class="text-danger">※</small></label>
                    <div class="input-group">
                        <input type="text" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" placeholder="山田 太郎" autocomplete="name" required/>
                        <span class="input-suffix">様</span>
                    </div>
                    <span class="error-msg" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                </div>

                <div class="form-group">
                    <label>フリガナ <small class="text-danger">※</small></label>
                    <div class="input-group">
                        <input type="text" th:field="*{nameKana}" class="form-control" th:classappend="${#fields.hasErrors('nameKana')} ? 'is-invalid' : ''" placeholder="ヤマダ タロウ" autocomplete="name" required/>
                        <span class="input-suffix">様</span>
                    </div>
                    <span class="error-msg" th:if="${#fields.hasErrors('nameKana')}" th:errors="*{nameKana}"></span>
                </div>

                <div class="form-group">
                    <label for="birthDate">生年月日 <small class="text-danger">※</small></label>
                    <input type="date" id="birthDate" th:field="*{birthDate}" class="form-control" th:classappend="${#fields.hasErrors('birthDate')} ? 'is-invalid' : ''" autocomplete="day" required/>
                    <span class="error-msg" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></span>
                    <div id="underageWarning" class="warning-banner">
                        ⚠️ <strong>ご注意：</strong> 満20歳未満の方は原則としてローンのお申し込みができません。（保護者の同意などが必要になる場合があります）
                    </div>
                </div>

                <div class="form-group">
                    <label for="phoneNumber">電話番号 <small class="text-danger">※</small></label>
                    <input type="tel" id="phoneNumber" th:field="*{phoneNumber}" class="form-control" th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid' : ''" placeholder="090-1234-5678" autocomplete="tel" required/>
                    <span class="error-msg" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></span>
                </div>

                <div class="form-group">
                    <label>メールアドレス <small class="text-danger">※</small></label>
                    <input type="email" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" placeholder="example@email.com" autocomplete="email" required/>
                    <span class="error-msg" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </div>

                <div class="form-group">
                    <label for="postalCode">郵便番号 <small class="text-danger">※</small></label>
                    <input type="text" id="postalCode" th:field="*{postalCode}" class="form-control" th:classappend="${#fields.hasErrors('postalCode')} ? 'is-invalid' : ''" placeholder="810-0001" autocomplete="postal-code" required/>
                    <span class="error-msg" th:if="${#fields.hasErrors('postalCode')}" th:errors="*{postalCode}"></span>
                </div>

                <div class="form-group">
                    <label>住所 <small class="text-danger">※</small></label>
                    <input type="text" th:field="*{address}" class="form-control" th:classappend="${#fields.hasErrors('address')} ? 'is-invalid' : ''" placeholder="福岡県福岡市中央区天神1-1-1" autocomplete="street-address" required/>
                    <span class="error-msg" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></span>
                </div>
            </fieldset>

            <!-- ローン条件グループ -->
            <fieldset>
                <legend>ローン条件</legend>

                <div class="form-group">
                    <label for="accountType">ローン種類 <small class="text-danger">※</small></label>
                    <select id="accountType" th:field="*{accountType}" class="form-control" th:classappend="${#fields.hasErrors('accountType')} ? 'is-invalid' : ''" required>
                        <option value="">-- 選択してください --</option>
                        <option th:each="option : ${accountTypeOptions}"
                                th:value="${option}"
                                th:text="${option}">選択肢
                        </option>
                    </select>
                    <span class="error-msg" th:if="${#fields.hasErrors('accountType')}" th:errors="*{accountType}"></span>
                </div>

                <div class="form-group">
                    <label for="interestType">金利タイプ <small class="text-danger">※</small></label>
                    <select id="interestType" th:field="*{interestType}" class="form-control" th:classappend="${#fields.hasErrors('interestType')} ? 'is-invalid' : ''" required>
                        <option value="">-- 選択してください --</option>
                        <option value="変動金利">変動金利</option>
                        <option value="固定金利3年">固定金利3年</option>
                        <option value="固定金利5年">固定金利5年</option>
                        <option value="固定金利10年">固定金利10年</option>
                    </select>
                    <span class="error-msg" th:if="${#fields.hasErrors('interestType')}" th:errors="*{interestType}"></span>
                </div>

                <div class="form-group">
                    <label for="repaymentMethod">返済プラン（返済方式） <small class="text-danger">※</small></label>
                    <select id="repaymentMethod" th:field="*{repaymentMethod}" class="form-control" th:classappend="${#fields.hasErrors('repaymentMethod')} ? 'is-invalid' : ''" required>
                        <option value="">-- 選択してください --</option>
                        <option value="元利均等返済">元利均等返済</option>
                        <option value="元金均等返済">元金均等返済</option>
                    </select>
                    <span class="error-msg" th:if="${#fields.hasErrors('repaymentMethod')}" th:errors="*{repaymentMethod}"></span>
                </div>

                <div class="form-group">
                    <label for="bonusOption">ボーナス併用払い <small class="text-danger">※</small></label>
                    <select id="bonusOption" th:field="*{bonusOption}" class="form-control" th:classappend="${#fields.hasErrors('bonusOption')} ? 'is-invalid' : ''" required>
                        <option value="利用しない">利用しない</option>
                        <option value="利用する">利用する（年2回ボーナス月増額）</option>
                    </select>
                    <div id="bonusAmountWrapper">
                        <label style="margin-top:6px; font-weight:normal; font-size:13px;">ボーナス月追加返済額（1回あたり）</label>
                        <input type="text" id="bonusAmount" th:field="*{bonusAmount}" class="form-control" placeholder="例：50,000"/>
                        <small style="display: block; color: #718096; font-size: 11px; margin-top: 2px;">※半角数字で入力してください</small>
                    </div>
                    <span class="error-msg" th:if="${#fields.hasErrors('bonusOption')}" th:errors="*{bonusOption}"></span>
                </div>

                <div class="form-group">
                    <label for="loanYears">返済期間（ローン年数） <small class="text-danger">※</small></label>
                    <select id="loanYears" th:field="*{loanYears}" class="form-control" th:classappend="${#fields.hasErrors('loanYears')} ? 'is-invalid' : ''" required>
                        <option value="">-- 選択してください --</option>
                        <option th:each="option : ${loanYearsOptions}"
                                th:value="${option}"
                                th:text="${option}">選択肢
                        </option>
                    </select>
                    <span class="error-msg" th:if="${#fields.hasErrors('loanYears')}" th:errors="*{loanYears}"></span>
                </div>

                <div class="form-group">
                    <label for="annualIncome">借入年収（万円） <small class="text-danger">※</small></label>
                    <input type="text" id="annualIncome" th:field="*{annualIncome}" class="form-control" th:classappend="${#fields.hasErrors('annualIncome')} ? 'is-invalid' : ''" placeholder="400" required/>
                    <small style="display: block; color: #718096; font-size: 12px; margin-top: 4px;">※半角数字で入力してください</small>
                    <span class="error-msg" th:if="${#fields.hasErrors('annualIncome')}" th:errors="*{annualIncome}"></span>
                </div>

                <div class="form-group">
                    <label for="loanAmount">借入金額（円） <small class="text-danger">※</small></label>
                    <input type="text" id="loanAmount" th:field="*{loanAmount}" class="form-control" th:classappend="${#fields.hasErrors('loanAmount')} ? 'is-invalid' : ''" placeholder="1,000,000" required/>
                    <small style="display: block; color: #718096; font-size: 12px; margin-top: 4px;">※半角数字で入力してください</small>
                    <div id="loanLimitGuide" class="limit-guide"></div>
                    <span class="error-msg" th:if="${#fields.hasErrors('loanAmount')}" th:errors="*{loanAmount}"></span>
                </div>

                <div class="form-group">
                    <label for="interestRate">金利（％） <small class="text-danger">※</small></label>
                    <input type="number" step="0.01" id="interestRate" th:field="*{interestRate}" class="form-control" th:classappend="${#fields.hasErrors('interestRate')} ? 'is-invalid' : ''" placeholder="1.5" required/>

                    <div class="live-calc-box">
                        <div class="live-calc-title">📊 ご返済額シミュレーション（リアルタイム試算）</div>
                        <div class="live-calc-grid">
                            <div class="live-calc-item">
                                <div class="live-calc-label">毎月の返済額（目安）</div>
                                <div class="live-calc-value" id="liveMonthlyPay">-- <span>円</span></div>
                            </div>
                            <div class="live-calc-item">
                                <div class="live-calc-label">総返済額（目安）</div>
                                <div class="live-calc-value" id="liveTotalPay">-- <span>円</span></div>
                            </div>
                        </div>
                    </div>

                    <div class="interest-notice" style="margin-top: 12px;">
                        ℹ️ 表示されている金利は目安です。実際の適用金利は審査結果やご選択いただく返済プラン、市場金利の動向によって変動する場合があります。
                    </div>

                    <span class="error-msg" th:if="${#fields.hasErrors('interestRate')}" th:errors="*{interestRate}"></span>
                </div>
            </fieldset>

            <p style="text-align: center; margin-top: 25px;">
                <input type="submit" value="確認" class="form-control-button form-confirmation-button"/>
                <button type="button" class="form-control-button form-clear-button" id="clearBtn">クリア</button>
            </p>
        </form>
    </div>
</div>

<script th:inline="javascript">
    const bankBranchMap = {
        "あおぞら未来銀行": ["さくら中央支店", "ひまわり通り支店", "青葉台支店"],
        "ネクストワン銀行": ["デジタル本店", "フロンティア支店", "クラウド支店"],
        "新日本総合銀行": ["丸の内中央支店", "ベイサイド支店", "グランフロント支店"]
    };

    const defaultInterestRates = {
        "住宅ローン": 0.85,
        "マイカーローン": 2.50,
        "教育ローン": 1.80,
        "フリーローン": 5.00,
        "カードローン": 14.00
    };

    const interestTypeRates = {
        "変動金利": 0.0,
        "固定金利3年": 0.3,
        "固定金利5年": 0.5,
        "固定金利10年": 0.8
    };

    const loanLimits = {
        "住宅ローン": { min: 1000000, max: 100000000, minStr: "100万円", maxStr: "1億円" },
        "マイカーローン": { min: 100000, max: 5000000, minStr: "10万円", maxStr: "500万円" },
        "教育ローン": { min: 100000, max: 3000000, minStr: "10万円", maxStr: "300万円" },
        "フリーローン": { min: 50000, max: 2000000, minStr: "5万円", maxStr: "200万円" },
        "カードローン": { min: 10000, max: 1000000, minStr: "1万円", maxStr: "100万円" }
    };

    const bankNameSelect = document.getElementById('bankName');
    const branchNameSelect = document.getElementById('branchName');
    const birthDateInput = document.getElementById('birthDate');
    const underageWarning = document.getElementById('underageWarning');
    const accountTypeSelect = document.getElementById('accountType');
    const interestTypeSelect = document.getElementById('interestType');
    const repaymentMethodSelect = document.getElementById('repaymentMethod');
    const interestRateInput = document.getElementById('interestRate');
    const loanLimitGuide = document.getElementById('loanLimitGuide');
    const postalCodeInput = document.getElementById('postalCode');
    const loanAmountInput = document.getElementById('loanAmount');
    const annualIncomeInput = document.getElementById('annualIncome');
    const bankAccountNumInput = document.getElementById('bankAccountNum');

    const bonusOption = document.getElementById('bonusOption');
    const bonusAmountWrapper = document.getElementById('bonusAmountWrapper');
    const bonusAmountInput = document.getElementById('bonusAmount');

    const liveMonthlyPay = document.getElementById('liveMonthlyPay');
    const liveTotalPay = document.getElementById('liveTotalPay');
    const loanYearsSelect = document.getElementById('loanYears');

    function updateBranchOptions(selectedBranchValue = "") {
        if (!bankNameSelect || !branchNameSelect) return;

        const selectedBank = bankNameSelect.value;
        branchNameSelect.innerHTML = '';

        if (selectedBank && bankBranchMap[selectedBank]) {
            const defaultOption = document.createElement('option');
            defaultOption.value = "";
            defaultOption.textContent = "-- 支店を選択してください --";
            branchNameSelect.appendChild(defaultOption);

            bankBranchMap[selectedBank].forEach(branch => {
                const opt = document.createElement('option');
                opt.value = branch;
                opt.textContent = branch;
                if (branch === selectedBranchValue) {
                    opt.selected = true;
                }
                branchNameSelect.appendChild(opt);
            });

            branchNameSelect.disabled = false;
        } else {
            const defaultOption = document.createElement('option');
            defaultOption.value = "";
            defaultOption.textContent = "-- 先に金融機関を選択してください --";
            branchNameSelect.appendChild(defaultOption);
            branchNameSelect.disabled = true;
        }
    }

    function updateInterestRate() {
        const selectedType = accountTypeSelect.value;
        const selectedInterestType = interestTypeSelect.value;

        if (!selectedInterestType) {
            interestRateInput.value = '';
            calculateLiveSimulation();
            return;
        }

        let baseRate = defaultInterestRates[selectedType] !== undefined ? defaultInterestRates[selectedType] : 1.5;
        let addRate = interestTypeRates[selectedInterestType] !== undefined ? interestTypeRates[selectedInterestType] : 0.0;

        interestRateInput.value = (baseRate + addRate).toFixed(2);
        calculateLiveSimulation();
    }

    function calculateLiveSimulation() {
        if (!loanAmountInput || !loanYearsSelect || !interestRateInput) return;

        const rawAmount = loanAmountInput.value.replace(/,/g, '');
        const principal = parseFloat(rawAmount) || 0;
        const years = parseInt(loanYearsSelect.value) || 0;
        const annualRate = parseFloat(interestRateInput.value) || 0;

        if (principal > 0 && years > 0 && annualRate > 0) {
            const months = years * 12;
            const monthlyRate = (annualRate / 100) / 12;
            let monthlyPayment = 0;

            if (monthlyRate === 0) {
                monthlyPayment = principal / months;
            } else {
                monthlyPayment = principal * (monthlyRate * Math.pow(1 + monthlyRate, months)) / (Math.pow(1 + monthlyRate, months) - 1);
            }

            const totalPayment = monthlyPayment * months;

            liveMonthlyPay.innerHTML = Math.round(monthlyPayment).toLocaleString() + " <span>円</span>";
            liveTotalPay.innerHTML = Math.round(totalPayment).toLocaleString() + " <span>円</span>";
        } else {
            liveMonthlyPay.innerHTML = "-- <span>円</span>";
            liveTotalPay.innerHTML = "-- <span>円</span>";
        }
    }

    if (bankNameSelect) {
        bankNameSelect.addEventListener('change', function() {
            updateBranchOptions();
            if (this.classList.contains('is-invalid')) {
                const formGroup = this.closest('.form-group');
                if (formGroup) formGroup.querySelectorAll('.error-msg-js').forEach(el => el.remove());
                this.classList.remove('is-invalid');
            }
        });
    }

    if (accountTypeSelect) {
        accountTypeSelect.addEventListener('change', function() {
            updateInterestRate();
            updateLoanLimitGuide();
        });
    }

    if (interestTypeSelect) {
        interestTypeSelect.addEventListener('change', updateInterestRate);
    }

    if (loanYearsSelect) {
        loanYearsSelect.addEventListener('change', calculateLiveSimulation);
    }

    if (loanAmountInput) {
        loanAmountInput.addEventListener('input', function() {
            let val = this.value.replace(/[^0-9]/g, '');
            if (val !== '') {
                this.value = Number(val).toLocaleString();
            } else {
                this.value = '';
            }
            calculateLiveSimulation();
        });
    }

    function updateBonusDisplay() {
        if (bonusOption && bonusOption.value === '利用する') {
            bonusAmountWrapper.style.display = 'block';
        } else {
            bonusAmountWrapper.style.display = 'none';
            if (bonusAmountInput) bonusAmountInput.value = '';
        }
    }

    if (bonusOption) {
        bonusOption.addEventListener('change', updateBonusDisplay);
    }

    if (bonusAmountInput) {
        bonusAmountInput.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
        });
    }

    if (bankAccountNumInput) {
        bankAccountNumInput.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        bankAccountNumInput.addEventListener('blur', function() {
            let val = this.value.trim();
            if (val !== '' && !isNaN(val) && val.length < 7) {
                this.value = val.padStart(7, '0');
            }
        });
    }

    function initBirthDateSettings() {
        if (birthDateInput) {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            birthDateInput.max = `${yyyy}-${mm}-${dd}`;
        }
    }

    function checkAgeWarning() {
        if (birthDateInput && birthDateInput.value) {
            const birthDate = new Date(birthDateInput.value);
            const today = new Date();
            let adultDate = new Date(today.getFullYear() - 20, today.getMonth(), today.getDate());

            if (birthDate > adultDate) {
                underageWarning.style.display = 'block';
            } else {
                underageWarning.style.display = 'none';
            }
        } else {
            underageWarning.style.display = 'none';
        }
    }

    function updateLoanLimitGuide() {
        const selectedType = accountTypeSelect ? accountTypeSelect.value : "";
        if (selectedType && loanLimits.hasOwnProperty(selectedType)) {
            const limit = loanLimits[selectedType];
            loanLimitGuide.innerText = `💡 選択中の【${selectedType}】の借入可能範囲： ${limit.minStr} 〜 ${limit.maxStr}`;
            loanLimitGuide.style.display = 'block';
        } else {
            loanLimitGuide.innerText = '';
            loanLimitGuide.style.display = 'none';
        }
    }

    if (birthDateInput) {
        birthDateInput.addEventListener('change', checkAgeWarning);
        birthDateInput.addEventListener('input', checkAgeWarning);
    }

    if (postalCodeInput) {
        postalCodeInput.addEventListener('input', function() {
            let value = this.value.replace(/[^0-9]/g, '');
            if (value.length > 3) {
                value = value.slice(0, 3) + '-' + value.slice(3, 7);
            }
            this.value = value;
        });
    }

    if (annualIncomeInput) {
        annualIncomeInput.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        // Thymeleafから渡された支店名を取得
        const initialBranchValue = /*[[${bankLoanApplication.branchName}]]*/ "";

        if (bankNameSelect && bankNameSelect.value) {
            branchNameSelect.disabled = false;
        }

        if (loanAmountInput && loanAmountInput.value) {
            let rawVal = loanAmountInput.value.replace(/,/g, '');
            if (!isNaN(rawVal) && rawVal !== '') {
                loanAmountInput.value = Number(rawVal).toLocaleString();
            }
        }

        // 💡 正しく initialBranchValue を渡すように修正
        updateBranchOptions(initialBranchValue);

        initBirthDateSettings();
        checkAgeWarning();
        updateLoanLimitGuide();
    });

    const phoneInput = document.getElementById('phoneNumber');
    if (phoneInput) {
        phoneInput.addEventListener('input', function() {
            let value = this.value.replace(/[^0-9]/g, '');
            if (value.length > 3 && value.length <= 7) {
                value = value.slice(0, 3) + '-' + value.slice(3);
            } else if (value.length > 7) {
                value = value.slice(0, 3) + '-' + value.slice(3, 7) + '-' + value.slice(7, 11);
            }
            this.value = value;
        });
    }

    document.getElementById('loanForm').addEventListener('submit', function(e) {
        let isValid = true;
        const requiredInputs = this.querySelectorAll('[required]');

        this.querySelectorAll('.error-msg-js').forEach(el => el.remove());
        this.querySelectorAll('.form-control').forEach(input => input.classList.remove('is-invalid'));

        requiredInputs.forEach(input => {
            let val = input.value.trim();

            if (!val) {
                isValid = false;
                input.classList.add('is-invalid');

                const msg = document.createElement('span');
                msg.className = 'error-msg error-msg-js';
                msg.innerText = '※ この項目を入力（選択）してください。';

                input.closest('.form-group').appendChild(msg);
            }
        });

        if (bankAccountNumInput && bankAccountNumInput.value.trim() !== '') {
            const accVal = bankAccountNumInput.value.trim();
            if (accVal.length < 7 && /^\d+$/.test(accVal)) {
                bankAccountNumInput.value = accVal.padStart(7, '0');
            }

            if (!/^\d{7}$/.test(bankAccountNumInput.value)) {
                isValid = false;
                bankAccountNumInput.classList.add('is-invalid');
                const msg = document.createElement('span');
                msg.className = 'error-msg error-msg-js';
                msg.innerText = '※ 口座番号は7桁の数字で入力してください。';
                bankAccountNumInput.closest('.form-group').appendChild(msg);
            }
        }

        let loanAmountYen = 0;
        if (loanAmountInput && loanAmountInput.value) {
            const rawLoanVal = loanAmountInput.value.replace(/,/g, '');
            loanAmountYen = parseFloat(rawLoanVal);
            const selectedType = accountTypeSelect ? accountTypeSelect.value : "";
            const typeName = selectedType ? selectedType : "ローン";

            let minLimit = 10000;
            let maxLimit = 100000000;

            if (loanLimits[selectedType]) {
                minLimit = loanLimits[selectedType].min;
                maxLimit = loanLimits[selectedType].max;
            }

            if (isNaN(loanAmountYen)) {
                isValid = false;
                loanAmountInput.classList.add('is-invalid');
                const msg = document.createElement('span');
                msg.className = 'error-msg error-msg-js';
                msg.innerText = '※ 有効な数値を入力してください。';
                loanAmountInput.closest('.form-group').appendChild(msg);
            }
            else if (loanAmountYen < minLimit) {
                isValid = false;
                loanAmountInput.classList.add('is-invalid');
                const msg = document.createElement('span');
                msg.className = 'error-msg error-msg-js';
                msg.innerText = `※ ${typeName}の借入金額は ${minLimit.toLocaleString()}円 以上で入力してください。`;
                loanAmountInput.closest('.form-group').appendChild(msg);
            }
            else if (loanAmountYen > maxLimit) {
                isValid = false;
                loanAmountInput.classList.add('is-invalid');
                const msg = document.createElement('span');
                msg.className = 'error-msg error-msg-js';
                msg.innerText = `※ ${typeName}の借入金額は ${maxLimit.toLocaleString()}円 以下で入力してください。`;
                loanAmountInput.closest('.form-group').appendChild(msg);
            }
        }

        if (isValid) {
            if (loanAmountYen >= 1000000) {
                const isConfirmed = confirm(`お借入金額が【${loanAmountYen.toLocaleString()}円】に設定されています。\n本当に間違いありませんか？`);
                if (!isConfirmed) {
                    e.preventDefault();
                    return;
                }
            }

            if (loanAmountInput && loanAmountInput.value) {
                loanAmountInput.value = loanAmountInput.value.replace(/,/g, '');
            }
        } else {
            e.preventDefault();
            if (loanAmountInput && loanAmountInput.value) {
                let rawVal = loanAmountInput.value.replace(/,/g, '');
                if (!isNaN(rawVal) && rawVal !== '') {
                    loanAmountInput.value = Number(rawVal).toLocaleString();
                }
            }
            const firstInvalid = this.querySelector('.is-invalid');
            if (firstInvalid) {
                firstInvalid.focus();
            }
        }
    });

    // クリアボタン押下時の処理
    document.getElementById('clearBtn').addEventListener('click', function() {
        const isOk = confirm("入力された内容をすべてクリアしてもよろしいですか？");
        if (isOk) {
            const form = document.getElementById('loanForm');

            form.querySelectorAll('input, select').forEach(element => {
                if (element.type === 'text' || element.type === 'number' || element.type === 'tel' || element.type === 'date' || element.type === 'email' || element.type === 'hidden') {
                    element.value = '';
                } else if (element.tagName === 'SELECT') {
                    element.selectedIndex = 0;
                }
            });

            form.querySelectorAll('.error-msg-js').forEach(el => el.remove());
            form.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));
            if (underageWarning) underageWarning.style.display = 'none';
            if (loanLimitGuide) loanLimitGuide.style.display = 'none';

            // ボーナス併用払い関連のリセット
            if (bonusOption) bonusOption.value = '利用しない';
            if (bonusAmountWrapper) bonusAmountWrapper.style.display = 'none';
            if (bonusAmountInput) bonusAmountInput.value = '';

            // 金利（％）の入力欄も空欄にする
            if (interestRateInput) interestRateInput.value = '';

            // リアルタイム試算の表示をリセット
            if (liveMonthlyPay) liveMonthlyPay.innerHTML = '-- <span>円</span>';
            if (liveTotalPay) liveTotalPay.innerHTML = '-- <span>円</span>';

            updateBranchOptions();
        }
    });
</script>
</body>
</html>
