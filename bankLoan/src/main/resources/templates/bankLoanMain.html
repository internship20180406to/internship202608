<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>ローン申込情報入力画面</title>
    <style>
        body {
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            padding-top: 40px;
            padding-bottom: 40px;
            justify-content: center;
            align-items: center;
            min-height: 85vh;
            overflow: auto;
        }
        .content {
            background-color: #ffffff;
            width: 80%;
            max-width: 600px;
            padding: 30px 40px;
            box-sizing: border-box;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            min-height: 50vh;
            overflow: auto;
        }
        h1 {
            font-size: 22px;
            color: #333333;
            margin-top: 0;
            margin-bottom: 25px;
            padding-bottom: 8px;
            border-bottom: 3px solid #2185D0;
            border-left: 6px solid #2185D0;
            padding-left: 10px;
        }
        fieldset {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px 20px 10px 20px;
            margin-bottom: 20px;
            background-color: #fafafa;
        }
        legend {
            font-weight: bold;
            color: #2185D0;
            padding: 0 8px;
            font-size: 15px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            font-size: 14px;
            font-weight: bold;
            color: #444444;
        }
        .form-control {
            width: 100%;
            padding: 8px 10px;
            margin-top: 4px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .form-control:focus {
            border-color: #2185D0;
            outline: none;
        }

        /* 入力欄の右に単位や敬称を並べる設定 */
        .input-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .input-group .form-control {
            flex: 1;
        }
        .input-suffix {
            font-size: 14px;
            font-weight: bold;
            color: #444444;
            white-space: nowrap;
        }

        /* 未入力エラー時の赤枠 */
        .is-invalid {
            border: 2px solid #e74c3c !important;
            background-color: #fdf2f2 !important;
        }
        .error-msg {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 4px;
            display: block;
            font-weight: bold;
        }

        .text-danger {
            color: red;
        }
        .form-control-button {
            width: 110px;
            padding: 10px 15px;
            margin: 10px 5px 0 5px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px;
        }
        .form-confirmation-button {
            color: white;
            background-color: #2185D0;
        }
        .form-confirmation-button:hover {
            background-color: #1678c2;
        }
        .form-clear-button {
            color: black;
            background-color: #E0E1E2;
        }
        .form-clear-button:hover {
            background-color: #CCCCCC;
        }
    </style>
</head>
<body>
<div class="content">
    <h1>ローン申込情報入力</h1>
    <form id="loanForm" action="#" th:action="@{/bankLoanConfirmation}" th:object="${bankLoanApplication}" method="post" novalidate>

        <!-- 口座情報グループ -->
        <fieldset>
            <legend>口座情報</legend>

            <!-- 金融機関名 -->
            <div class="form-group">
                <label>金融機関名 <small class="text-danger">※</small></label>
                <select th:field="*{bankName}" class="form-control" required>
                    <option th:each="option : ${nameOptions}"
                            th:value="${option}"
                            th:text="${option}">選択肢
                    </option>
                </select>
            </div>

            <!-- 支店名 -->
            <div class="form-group">
                <label>支店名 <small class="text-danger">※</small></label>
                <input type="text" th:field="*{branchName}" class="form-control" placeholder="福岡支店" required/>
            </div>

            <!-- 預金種別 -->
            <div class="form-group">
                <label>預金種別 <small class="text-danger">※</small></label>
                <select th:field="*{bankAccountType}" class="form-control" required>
                    <option value="">-- 選択してください --</option>
                    <option th:each="option : ${depositTypeOptions}"
                            th:value="${option}"
                            th:text="${option}">選択肢
                    </option>
                </select>
            </div>

            <!-- 口座番号 -->
            <div class="form-group">
                <label>口座番号 <small class="text-danger">※</small></label>
                <input type="number" th:field="*{bankAccountNum}" class="form-control" placeholder="1234567" required/>
            </div>

            <!-- 債務者名 (見出しは「債務者名 ※」、入力欄の右側のみ「様」) -->
            <div class="form-group">
                <label>債務者名 <small class="text-danger">※</small></label>
                <div class="input-group">
                    <input type="text" th:field="*{name}" class="form-control" placeholder="山田 太郎" required/>
                    <span class="input-suffix">様</span>
                </div>
            </div>

            <!-- フリガナ -->
            <div class="form-group">
                <label>フリガナ <small class="text-danger">※</small></label>
                <input type="text" th:field="*{nameKana}" class="form-control" placeholder="ヤマダ タロウ" required/>
            </div>

            <!-- 生年月日 -->
            <div class="form-group">
                <label>生年月日 <small class="text-danger">※</small></label>
                <input type="date" th:field="*{birthDate}" class="form-control" required/>
            </div>
        </fieldset>

        <!-- ローン条件グループ -->
        <fieldset>
            <legend>ローン条件</legend>

            <!-- ローン種類 -->
            <div class="form-group">
                <label>ローン種類 <small class="text-danger">※</small></label>
                <select th:field="*{accountType}" class="form-control" required>
                    <option value="">-- 選択してください --</option>
                    <option th:each="option : ${accountTypeOptions}"
                            th:value="${option}"
                            th:text="${option}">選択肢
                    </option>
                </select>
            </div>

            <!-- 借入金額 -->
            <div class="form-group">
                <label>借入金額（円） <small class="text-danger">※</small></label>
                <input type="number" th:field="*{loanAmount}" class="form-control" placeholder="1000000" required/>
            </div>

            <!-- 借入年収 -->
            <div class="form-group">
                <label>借入年収（万円） <small class="text-danger">※</small></label>
                <input type="number" th:field="*{annualIncome}" class="form-control" placeholder="400" required/>
            </div>

            <!-- 金利 -->
            <div class="form-group">
                <label>金利（％） <small class="text-danger">※</small></label>
                <input type="number" step="0.01" th:field="*{interestRate}" class="form-control" placeholder="1.5" required/>
            </div>
        </fieldset>

        <!-- 確認ボタン / クリアボタン -->
        <p style="text-align: center; margin-top: 25px;">
            <input type="submit" value="確認" class="form-control-button form-confirmation-button"/>
            <input type="reset" value="クリア" class="form-control-button form-clear-button"/>
        </p>
    </form>
</div>

<script>
    document.getElementById('loanForm').addEventListener('submit', function(e) {
        let isValid = true;
        const requiredInputs = this.querySelectorAll('[required]');

        // 既存のエラー表示をクリア
        this.querySelectorAll('.error-msg').forEach(el => el.remove());
        requiredInputs.forEach(input => input.classList.remove('is-invalid'));

        // 未入力チェック
        requiredInputs.forEach(input => {
            if (!input.value.trim()) {
                isValid = false;
                input.classList.add('is-invalid');

                // エラーメッセージを表示
                const msg = document.createElement('span');
                msg.className = 'error-msg';
                msg.innerText = '※ この項目を入力（選択）してください。';

                // input-group 内の場合は親要素の後ろに追加
                if (input.parentNode.classList.contains('input-group')) {
                    input.parentNode.parentNode.appendChild(msg);
                } else {
                    input.parentNode.appendChild(msg);
                }
            }
        });

        // バリデーションエラー時は送信を中断し、最初のエラー項目にフォーカス
        if (!isValid) {
            e.preventDefault();
            const firstInvalid = this.querySelector('.is-invalid');
            if (firstInvalid) {
                firstInvalid.focus();
            }
        }
    });

    // クリアボタンを押したときに赤枠メッセージを消去
    document.querySelector('.form-clear-button').addEventListener('click', function() {
        const form = document.getElementById('loanForm');
        form.querySelectorAll('.error-msg').forEach(el => el.remove());
        form.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));
    });
</script>
</body>
</html>
