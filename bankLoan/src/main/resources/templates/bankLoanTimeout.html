<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>セッションタイムアウト</title>

    <link rel="stylesheet"
          th:href="@{/css/bankLoanTimeout.css}">
</head>

<body>

<div class="container">

    <div class="timeout-card">

        <div class="timeout-icon">!</div>

        <h1>申込を終了しました</h1>

        <p class="timeout-message">
            セキュリティ保護のため、
            一定時間操作がなかったため申込を終了しました。
        </p>

        <p class="timeout-sub-message">
            お手数ですが、もう一度最初から入力してください。
        </p>

        <div class="button-area">

            <input type="button"
                   value="申込画面に戻る"
                   class="return-button"
                   onclick="window.location='/bankLoan';"/>

        </div>

    </div>

</div>

</body>
</html>
