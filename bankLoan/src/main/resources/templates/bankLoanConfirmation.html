<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ローン申込確認画面</title>
</head>
<body>
<h1>ローン申込確認画面</h1>
<form action="#" th:action="@{/bankLoanCompletion}" th:object="${bankLoanApplication}" method="post">
    <p>お名前: <span th:text="*{debtorLastName}"></span>
              <span th:text="*{debtorFirstName}"></span></p>
    <p>生年月日:<span th:text="*{birthDate}"></span></p>
    <p>金融機関名: <span th:text="*{bankName}"></span></p>
    <p>支店名: <span th:text="*{branchName}"></span></p>
    <p>科目名:<span th:text="*{subjectName}"></span></p>
    <p>口座番号: <span th:text="*{bankAccountNum}"></span></p>
    <p>借入希望額:<span th:text="*{desiredLoanAmount}"></span>万円</p>
    <p>ご本人様の前年度年収（税込）:<span th:text="*{annualIncome}"></span>万円</p>
    <p>借入年数:<span th:text="*{loanYears}"></span>年</p>
    <p>金利タイプ:<span th:text="*{interestType}"></span></p>
    <p>適用金利: 年<span th:text="*{interestRate}"></span>%</p>
    <input type="hidden" name="bankName" th:value="*{bankName}"/>
    <input type="hidden" name="branchName" th:value="*{branchName}"/>
    <input type="hidden" name="bankAccountNum" th:value="*{bankAccountNum}"/>
    <input type="hidden" name="debtorLastName" th:value="*{debtorLastName}"/>
    <input type="hidden" name="debtorFirstName" th:value="*{debtorFirstName}"/>
    <input type="hidden" name="debtorName" th:value="*{debtorName}"/>
    <input type="hidden" name="desiredLoanAmount" th:value="*{desiredLoanAmount}"/>
    <input type="hidden" th:field="*{birthDate}"/>
    <input type="hidden" name="annualIncome" th:value="*{annualIncome}"/>
    <input type="hidden" th:field="*{subjectName}"/>
    <input type="hidden" th:field="*{interestType}"/>
    <input type="hidden" th:field="*{interestRate}"/>
    <input type="hidden" th:field="*{loanYears}"/>

    <p>
        <input type="submit" id="submit" value="申込"/>
        <input type="button" value="キャンセル" onclick="window.location='/bankLoan';"/>
    </p>
</form>
<script th:inline="javascript" src="/js/bankLoanConfirmation.js"></script>
</body>
</html>
