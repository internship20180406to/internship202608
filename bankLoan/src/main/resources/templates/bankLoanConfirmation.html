<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ローン申込確認画面</title>
    <style>
        body {
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            padding-top: 40px;
            padding-bottom: 40px;
            justify-content: center;
            align-items: center;
            min-height: 85vh;
            overflow: auto;
        }
        .content {
            background-color: #ffffff;
            width: 80%;
            max-width: 600px;
            padding: 30px 40px;
            box-sizing: border-box;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            min-height: 50vh;
            overflow: auto;
        }

        /* 見出しのデザイン */
        h1 {
            font-size: 22px;
            color: #333333;
            margin-top: 0;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 3px solid #2185D0;
            border-left: 6px solid #2185D0;
            padding-left: 10px;
        }

        /* 見出し下の補足メッセージ */
        .confirm-lead {
            font-size: 13px;
            color: #666666;
            margin-bottom: 25px;
        }

        /* テーブルのデザイン */
        .confirm-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0 30px 0;
            border-top: 1px solid #e0e0e0;
        }
        .confirm-table th, .confirm-table td {
            padding: 12px 14px;
            border-bottom: 1px solid #eeeeee;
            text-align: left;
            font-size: 14px;
        }
        .confirm-table th {
            width: 35%;
            color: #444444;
            font-weight: bold;
            background-color: #f8f9fa;
        }
        .confirm-table td {
            color: #333333;
        }

        /* 申込日時の行の背景色 */
        .confirm-table tr.date-row th,
        .confirm-table tr.date-row td {
            background-color: #f0f7fc;
        }

        .form-control-button {
            width: 110px;
            padding: 10px 15px;
            margin: 10px 8px 0 8px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px;
        }
        .form-confirmation-button {
            color: white;
            background-color: #2185D0;
        }
        .form-confirmation-button:hover {
            background-color: #1678c2;
        }
        .form-clear-button {
            color: black;
            background-color: #E0E1E2;
        }
        .form-clear-button:hover {
            background-color: #CCCCCC;
        }
    </style>
</head>
<body>
<div class="content">
    <h1>ローン申込内容の確認</h1>
    <p class="confirm-lead">入力内容をご確認のうえ、「申込」ボタンを押してください。</p>

    <form action="#" th:action="@{/bankLoanCompletion}" th:object="${bankLoanApplication}" method="post">

        <!-- 表示項目 -->
        <table class="confirm-table">
            <tr class="date-row">
                <th>申込日時</th>
                <td><span th:text="${applicationDate}">2026/08/25 10:00:00</span></td>
            </tr>
            <tr>
                <th>金融機関名</th>
                <td><span th:text="*{bankName}"></span></td>
            </tr>
            <tr>
                <th>支店名</th>
                <td><span th:text="*{branchName}"></span></td>
            </tr>
            <tr>
                <th>預金種別</th>
                <td><span th:text="*{depositType}"></span></td>
            </tr>
            <tr>
                <th>口座番号</th>
                <td><span th:text="*{bankAccountNum}"></span></td>
            </tr>
            <tr>
                <th>債務者名</th>
                <td><span th:text="*{debtorName}"></span></td>
            </tr>
            <tr>
                <th>ローン種類</th>
                <td><span th:text="*{accountType}"></span></td>
            </tr>
            <tr>
                <th>借入金額</th>
                <td><span th:text="*{#numbers.formatInteger(borrowingAmount, 1, 'COMMA')}">1,000,000</span> 円</td>
            </tr>
            <tr>
                <th>借入年収</th>
                <td><span th:text="*{#numbers.formatInteger(annualIncome, 1, 'COMMA')}">400</span> 万円</td>
            </tr>
            <tr>
                <th>金利</th>
                <td><span th:text="*{interestRate}"></span> ％</td>
            </tr>
        </table>

        <!-- 次の画面へ引き継ぐhiddenデータ -->
        <input type="hidden" th:field="*{bankName}"/>
        <input type="hidden" th:field="*{branchName}"/>
        <input type="hidden" th:field="*{depositType}"/>
        <input type="hidden" th:field="*{bankAccountNum}"/>
        <input type="hidden" th:field="*{debtorName}"/>
        <input type="hidden" th:field="*{accountType}"/>
        <input type="hidden" th:field="*{borrowingAmount}"/>
        <input type="hidden" th:field="*{annualIncome}"/>
        <input type="hidden" th:field="*{interestRate}"/>

        <!-- ボタン配置 -->
        <p style="text-align: center;">
            <input type="submit" id="submit" value="申込" class="form-control-button form-confirmation-button"/>
            <input type="button" value="キャンセル" class="form-control-button form-clear-button" onclick="window.location='/bankLoan';"/>

        </p>
    </form>
</div>
<script th:inline="javascript" src="/js/bankLoanConfirmation.js"></script>
</body>
</html>
