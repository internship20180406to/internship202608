<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ローン申込確認画面</title>

    <style>
        body {
            background: linear-gradient(135deg, #f4f8fc, #e1ecf7);
            margin: 0;
            padding: 0;
            display: flex;
            padding-top: 40px;
            padding-bottom: 40px;
            justify-content: center;
            align-items: center;
            min-height: 85vh;
            overflow: auto;
        }
        .content {
            background-color: #ffffff;
            width: 80%;
            max-width: 600px;
            padding: 30px 40px;
            box-sizing: border-box;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(33, 133, 208, 0.1);
            min-height: 50vh;
            overflow: auto;
        }

        /* 見出しのデザイン */
        h1 {
            font-size: 22px;
            color: #1a365d;
            margin-top: 0;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 3px solid #3182ce;
            border-left: 6px solid #3182ce;
            padding-left: 10px;
        }

        /* 見出し下の補足メッセージ */
        .confirm-lead {
            font-size: 13px;
            color: #4a5568;
            margin-bottom: 25px;
        }

        /* テーブルのデザイン */
        .confirm-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0 25px 0;
            border-top: 1px solid #edf2f7;
        }
        .confirm-table th, .confirm-table td {
            padding: 12px 14px;
            border-bottom: 1px solid #edf2f7;
            text-align: left;
            font-size: 14px;
        }
        .confirm-table th {
            width: 35%;
            color: #2d3748;
            font-weight: 600;
            background-color: #f7fafc;
        }
        .confirm-table td {
            color: #2d3748;
        }

        /* 申込日時の行の背景色 */
        .confirm-table tr.date-row th,
        .confirm-table tr.date-row td {
            background-color: #ebf8ff;
            color: #2b6cb0;
            font-weight: 500;
        }

        /* 青色に統一した金額の強調用スタイル */
        .highlight-amount {
            color: #2b6cb0;
            font-size: 16px;
            font-weight: bold;
        }

        /* ボタンスタイル */
        .form-control-button {
            width: 110px;
            padding: 12px 10px;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s ease;
            text-align: center;
        }
        .form-confirmation-button {
            color: white;
            background-color: #3182ce;
            box-shadow: 0 4px 10px rgba(49, 130, 206, 0.3);
        }
        .form-confirmation-button:hover {
            background-color: #2b6cb0;
        }
        /* 修正ボタン用のスタイル */
        .form-edit-button {
            color: #2b6cb0;
            background-color: #e2e8f0;
        }
        .form-edit-button:hover {
            background-color: #cbd5e0;
        }
        .form-clear-button {
            color: #4a5568;
            background-color: #edf2f7;
        }
        .form-clear-button:hover {
            background-color: #e2e8f0;
        }

        /* 下部のアクションエリア（中央寄せ） */
        .bottom-action-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 25px;
        }
    </style>
</head>
<body>
<div class="content">
    <h1>ローン申込内容の確認</h1>
    <p class="confirm-lead">入力内容をご確認のうえ、「申込」ボタンを押してください。</p>

    <!-- メインの申込フォーム -->
    <form id="actionForm" action="#" th:action="@{/bankLoanCompletion}" th:object="${bankLoanApplication}" method="post">

        <!-- 表示項目テーブル -->
        <table class="confirm-table">
            <tr class="date-row">
                <th>申込日時</th>
                <td><span th:text="${applicationDate}">2026/08/27 11:19:00</span></td>
            </tr>
            <tr>
                <th>金融機関名</th>
                <td><span th:text="*{bankName}"></span></td>
            </tr>
            <tr>
                <th>支店名</th>
                <td><span th:text="*{branchName}"></span></td>
            </tr>
            <tr>
                <th>預金種別</th>
                <td><span th:text="*{bankAccountType}"></span></td>
            </tr>
            <tr>
                <th>口座番号</th>
                <td><span th:text="*{bankAccountNum}"></span></td>
            </tr>
            <tr>
                <th>債務者名</th>
                <td><span th:text="*{name}"></span></td>
            </tr>
            <tr>
                <th>フリガナ</th>
                <td><span th:text="*{nameKana}"></span></td>
            </tr>
            <tr>
                <th>生年月日</th>
                <td><span th:text="*{birthDate}"></span></td>
            </tr>
            <tr>
                <th>電話番号</th>
                <td><span th:text="*{phoneNumber}"></span></td>
            </tr>
            <tr>
                <th>メールアドレス</th>
                <td><span th:text="*{email}"></span></td>
            </tr>
            <tr>
                <th>郵便番号</th>
                <td><span th:text="*{postalCode}"></span></td>
            </tr>
            <tr>
                <th>住所</th>
                <td><span th:text="*{address}"></span></td>
            </tr>
            <tr>
                <th>ローン種類</th>
                <td><span th:text="*{accountType}"></span></td>
            </tr>
            <tr>
                <th>返済期間（ローン年数）</th>
                <td><span th:text="*{loanYears}"></span></td>
            </tr>
            <tr>
                <th>借入年収</th>
                <td><span th:text="*{#numbers.formatInteger(annualIncome, 1, 'COMMA')}">400</span> 万円</td>
            </tr>
            <tr>
                <th>借入金額</th>
                <td><span class="highlight-amount"><span th:text="*{#numbers.formatInteger(loanAmount, 1, 'COMMA')}">1,000,000</span> 円</span></td>
            </tr>
            <tr>
                <th>金利</th>
                <td><span th:text="*{interestRate}"></span> ％</td>
            </tr>
        </table>

        <!-- 引き継ぐhiddenデータ -->
        <input type="hidden" th:field="*{bankName}"/>
        <input type="hidden" th:field="*{branchName}"/>
        <input type="hidden" th:field="*{bankAccountType}"/>
        <input type="hidden" th:field="*{bankAccountNum}"/>
        <input type="hidden" th:field="*{name}"/>
        <input type="hidden" th:field="*{nameKana}"/>
        <input type="hidden" th:field="*{birthDate}"/>
        <input type="hidden" th:field="*{phoneNumber}"/>
        <input type="hidden" th:field="*{email}"/>
        <input type="hidden" th:field="*{postalCode}"/>
        <input type="hidden" th:field="*{address}"/>
        <input type="hidden" th:field="*{accountType}"/>
        <input type="hidden" th:field="*{loanYears}"/>
        <input type="hidden" th:field="*{annualIncome}"/>
        <input type="hidden" th:field="*{loanAmount}"/>
        <input type="hidden" th:field="*{interestRate}"/>

        <!-- 最下部の中央寄せボタンエリア（キャンセル・修正・申込） -->
        <div class="bottom-action-area">
            <button type="button" class="form-control-button form-clear-button" onclick="window.location.href='/bankLoan';">キャンセル</button>
            <!-- 💡 修正ボタン：/bankLoan/edit へデータを保持したままPOST送信 -->
            <button type="submit" class="form-control-button form-edit-button" th:formaction="@{/bankLoan/edit}">修正</button>
            <button type="submit" class="form-control-button form-confirmation-button">申込</button>
        </div>
    </form>
</div>
</body>
</html>
