<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ローン申込確認画面</title>
</head>
<body>
<h1>ローン申込確認画面</h1>
<form action="#" th:action="@{/bankLoanCompletion}" th:object="${bankLoanApplication}" method="post">
    <!-- 表示項目 -->
    <p>金融機関名: <span th:text="*{bankName}"></span></p>
    <p>支店名: <span th:text="*{branchName}"></span></p>
    <p>科目名: <span th:text="*{accountType}"></span></p>
    <p>口座番号: <span th:text="*{bankAccountNum}"></span></p>
    <p>口座名義: <span th:text="*{accountHolder}"></span></p>
    <p>金額: <span th:text="*{amount}"></span> 円</p>
    <p>振込指定日: <span th:text="*{transferDate}"></span></p>

    <!-- 次の画面へ引き継ぐhiddenデータ -->
    <input type="hidden" th:field="*{bankName}"/>
    <input type="hidden" th:field="*{branchName}"/>
    <input type="hidden" th:field="*{accountType}"/>
    <input type="hidden" th:field="*{bankAccountNum}"/>
    <input type="hidden" th:field="*{accountHolder}"/>
    <input type="hidden" th:field="*{amount}"/>
    <input type="hidden" th:field="*{transferDate}"/>

    <p>
        <input type="submit" id="submit" value="申込"/>
        <input type="button" value="キャンセル" onclick="window.location='/bankLoan';"/>
    </p>
</form>
<script th:inline="javascript" src="/js/bankLoanConfirmation.js"></script>
</body>
</html>
