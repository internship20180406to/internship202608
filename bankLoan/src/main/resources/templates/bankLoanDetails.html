<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>借入内容入力画面</title>

    <style>
        body {
            background-color: #f2f2f2;
            color: #111111;
            margin: 0;
            padding: 50px 0;
            display: flex;
            justify-content: center;
            min-height: 85vh;
            font-family:
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    "Hiragino Kaku Gothic ProN",
                    "Yu Gothic",
                    sans-serif;
        }

        .content {
            background-color: #ffffff;
            width: 80%;
            max-width: 950px;
            padding: 35px;
            border: 1px solid #d0d0d0;
            border-radius: 6px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            padding-bottom: 15px;
            border-bottom: 3px solid #111111;
            font-size: 30px;
        }

        form label {
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            max-width: 600px;
            padding: 11px;
            margin: 7px 0;
            box-sizing: border-box;
            color: #111111;
            background-color: #ffffff;
            border: 1px solid #777777;
            border-radius: 3px;
            font-size: 15px;
        }

        .form-control:focus {
            border: 2px solid #111111;
            outline: none;
        }

        .form-control[readonly] {
            background-color: #eeeeee;
            color: #333333;
        }

        .text-danger {
            color: #c00000;
        }

        .button-area {
            margin-top: 30px;
            text-align: center;
        }

        .form-button {
            min-width: 100px;
            padding: 12px 22px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: 0.2s;
        }

        .next-button {
            color: #ffffff;
            background-color: #111111;
            border: 2px solid #111111;
        }

        .next-button:hover {
            color: #111111;
            background-color: #ffffff;
        }

        .back-button {
            color: #111111;
            background-color: #ffffff;
            border: 2px solid #777777;
        }

        .back-button:hover {
            background-color: #e5e5e5;
        }

        .form-control:user-invalid {
            border: 2px solid #dc3545 !important;
            background-color: #fff5f5;
            outline: none;
        }

        .form-control:user-invalid:focus {
            box-shadow: 0 0 4px rgba(220, 53, 69, 0.5);
        }

        .was-validated .form-control:invalid {
            border: 2px solid #dc3545;
            background-color: #fff5f5;
            outline: none;
        }

        .step-progress {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-bottom: 30px;
        }

        .progress-step {
            padding: 10px 5px;
            text-align: center;
            color: #555555;
            background-color: #e0e0e0;
            border-radius: 3px;
            font-size: 14px;
        }

        .progress-step.active {
            color: #ffffff;
            background-color: #111111;
            font-weight: bold;
        }

        .progress-step.completed {
            color: #111111;
            background-color: #bfbfbf;
        }

        @media (max-width: 700px) {
            body {
                padding: 20px 0;
            }

            .content {
                width: 90%;
                padding: 20px;
            }

            h1 {
                font-size: 25px;
            }
        }

        .form-control.is-invalid {
            border: 2px solid #dc3545 !important;
            background-color: #fff5f5;
            outline: none;
        }

        .field-error {
            display: block;
            max-width: 600px;
            margin-top: 5px;
            color: #c00000;
            font-size: 13px;
            font-weight: 600;
        }

    </style>
</head>

<body>
<div class="content">
    <div class="step-progress">
        <div class="progress-step completed">1. 基本情報</div>
        <div class="progress-step active" aria-current="step">2. 借入内容</div>
        <div class="progress-step">3. 内容確認</div>
        <div class="progress-step">4. 申込完了</div>
    </div>
    <h1>お借入内容</h1>

    <form th:action="@{/bankLoanConfirmation}"
          th:object="${bankLoanApplication}"
          method="post" class="needs-validation">

        <!-- 1ページ目の情報を保持 -->
        <input type="hidden" th:field="*{bankName}"/>
        <input type="hidden" th:field="*{branchName}"/>
        <input type="hidden" th:field="*{bankAccountNum}"/>
        <input type="hidden" th:field="*{debtorLastName}"/>
        <input type="hidden" th:field="*{debtorFirstName}"/>
        <input type="hidden" th:field="*{birthDate}"/>
        <input type="hidden" th:field="*{subjectName}"/>
        <input type="hidden" th:field="*{annualIncome}"/>

        <p>
            <label>
                借入希望金額:
                <small class="text-danger">※</small>
            </label><br>

            <input type="text"
                   th:field="*{desiredLoanAmount}"
                   class="form-control"
                   inputmode="numeric"
                   data-comma-format
                   data-min="1"
                   data-max="50000"
                   data-range-message="借入希望額は1万円以上5億円以下で入力してください"
                   placeholder="3,000"
                   title="借入希望額は1万円以上5億円以下で入力してください"
                   autocomplete="off"
                   required/>
            <span>万円</span>
        </p>

        <p>
            <label>
                借入年数:
                <small class="text-danger">※</small>
            </label><br>

            <select th:field="*{loanYears}"
                    class="form-control"
                    required>

                <option value="">選択してください</option>

                <option th:each="year : ${#numbers.sequence(1, 40)}"
                        th:value="${year}"
                        th:text="|${year}年|">
                </option>
            </select>
        </p>

        <p>
            <label>
                金利タイプ:
                <small class="text-danger">※</small>
            </label><br>

            <select id="interestType"
                    th:field="*{interestType}"
                    class="form-control"
                    required>

                <option value="">選択してください</option>

                <option th:each="rateEntry : ${rateOptions}"
                        th:value="${rateEntry.key}"
                        th:text="|${rateEntry.key}（年${rateEntry.value}%）|"
                        th:attr="data-rate=${rateEntry.value}">
                </option>
            </select>
        </p>

        <p>
            <label>適用予定金利:</label><br>

            <input type="text"
                   id="interestRateDisplay"
                   class="form-control"
                   readonly
                   placeholder="金利タイプを選択してください"/>
        </p>

        <p class="button-area">
            <input type="submit"
                   th:formaction="@{/bankLoanEdit}"
                   value="戻る"
                   class="form-button back-button"
                   formnovalidate/>

            <input type="submit"
                   value="確認"
                   class="form-button next-button"/>
        </p>
    </form>
</div>
<script>
    const interestType =
        document.getElementById("interestType");

    const interestRateDisplay =
        document.getElementById("interestRateDisplay");

    interestType.addEventListener("change", () => {
        const selectedOption =
            interestType.options[interestType.selectedIndex];

        const rate = selectedOption.dataset.rate;

        if (rate) {
            interestRateDisplay.value = "年" + rate + "%";
        } else {
            interestRateDisplay.value = "";
        }
    });
    interestType.dispatchEvent(new Event("change"));
</script>
<script th:src="@{/js/bankLoanAmountFormat.js}"></script>
<script src="/js/bankLoanValidation.js"></script>
</body>
</html>
