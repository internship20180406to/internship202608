<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8"/>
    <title>申込完了画面</title>

    <link rel="stylesheet"
          href="/css/bankLoanCompletion.css">
</head>

<body>

<div class="container">
    <div class="completion-card">

        <div class="completion-icon">✓</div>

        <h1>申込完了</h1>

        <p class="completion-message">
            カードローンのお申し込みを受け付けました。
        </p>

        <p class="completion-sub-message">
            お申し込みありがとうございました。
        </p>

        <div class="button-area">
            <input type="button"
                   value="申込画面に戻る"
                   class="return-button"
                   onclick="window.location='/bankLoan';"/>
        </div>

    </div>
</div>

</body>
</html>
