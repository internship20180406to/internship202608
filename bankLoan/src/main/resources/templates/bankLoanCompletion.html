<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8"/>
    <title>ローン申込完了画面</title>
    <style>
        body {
            background: linear-gradient(135deg, #f4f8fc, #e1ecf7);
            margin: 0;
            padding: 40px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 85vh;
        }
        .content {
            background-color: #ffffff;
            width: 80%;
            max-width: 600px;
            padding: 30px 40px;
            box-sizing: border-box;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(33, 133, 208, 0.1);
        }
        h1 {
            font-size: 22px;
            color: #1a365d;
            margin-top: 0;
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 3px solid #3182ce;
            border-left: 6px solid #3182ce;
            padding-left: 10px;
        }
        p {
            color: #2d3748;
            font-size: 14px;
            line-height: 1.6;
        }
        .btn-home {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 24px;
            background-color: #3182ce;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }
        .btn-home:hover {
            background-color: #2b6cb0;
        }
    </style>
</head>
<body>
<div class="content" style="text-align: center;">
    <h1>ローンのお申し込みが完了しました</h1>
    <p>お申し込み手続きが正常に完了いたしました。<br>ご登録いただいた内容に基づき、審査を進めさせていただきます。</p>

    <!-- もしコントローラーから申込情報オブジェクト（bankLoanApplication）を渡している場合は、以下のように結果を表示することも可能です -->
    <!--
    <div style="text-align: left; margin-top: 20px; background: #f7fafc; padding: 15px; border-radius: 8px;" th:if="${bankLoanApplication != null}">
        <p><strong>金融機関名：</strong> <span th:text="${bankLoanApplication.bankName}"></span></p>
        <p><strong>お借入金額：</strong> <span th:text="${bankLoanApplication.loanAmount}"></span> 円</p>
    </div>
    -->

    <div>
        <a th:href="@{/bankLoan}" class="btn-home">トップページ（入力画面）へ戻る</a>
    </div>
</div>
</body>
</html>
