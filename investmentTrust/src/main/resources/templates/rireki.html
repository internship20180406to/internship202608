<!doctype html>
<html>

<head>

    <meta charset="UTF-8">

    <title>投資信託注文履歴</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            background-color: #f0f0f0;

            margin: 0;

            padding: 40px 20px;

            font-family:
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    "Hiragino Kaku Gothic ProN",
                    "Hiragino Sans",
                    Meiryo,
                    sans-serif;
        }

        .content {

            width: 80%;

            max-width: 1200px;

            margin: 0 auto;

            padding: 30px;

            background-color: #ffffff;

            border-radius: 10px;

            box-shadow:
                    0 4px 8px rgba(0,0,0,0.1);
        }

        h1 {

            margin-top: 0;

            margin-bottom: 40px;

            color: #333333;
        }


        /* =========================
           上部ボタン
        ========================= */

        .navigation {

            display: flex;

            margin-bottom: 40px;

            border-bottom: 1px solid #dddddd;
        }

        .navigation-button {

            width: 180px;

            padding: 15px;

            text-align: center;

            text-decoration: none;

            font-size: 18px;

            font-weight: bold;

            border: 1px solid #cccccc;

            border-bottom: none;

            border-radius: 8px 8px 0 0;

            background-color: #ffffff;

            color: #333333;
        }

        .navigation-button:hover {

            background-color: #eeeeee;
        }


        /* 現在のページ */

        .navigation-button.active {

            background-color: #2185D0;

            color: #ffffff;

            border-color: #2185D0;
        }


        /* =========================
           履歴テーブル
        ========================= */

        .history-table {

            width: 100%;

            border-collapse: collapse;

            margin-bottom: 40px;
        }

        .history-table th {

            padding: 15px;

            background-color: #f0f0f0;

            border: 1px solid #dddddd;

            text-align: center;
        }

        .history-table td {

            padding: 15px;

            border: 1px solid #dddddd;

            text-align: center;
        }


        /* =========================
           注文ボタン
        ========================= */

        .order-button-area {

            text-align: center;
        }

        .order-button {

            display: inline-block;

            width: 250px;

            padding: 15px 20px;

            border-radius: 7px;

            background-color: #2185D0;

            color: #ffffff;

            text-decoration: none;

            font-size: 18px;

            font-weight: bold;
        }

        .order-button:hover {

            background-color: #1678c2;
        }


        @media (max-width: 700px) {

            .content {

                width: 100%;

                padding: 20px;
            }

            .history-table {

                font-size: 14px;
            }

            .history-table th,
            .history-table td {

                padding: 10px 5px;
            }

        }

    </style>

</head>


<body>

<div class="content">


    <!-- =========================
         上部ナビゲーション
    ========================== -->

    <div class="navigation">

        <!-- 注文 -->

        <a href="/investmentTrust"
           class="navigation-button">

            注文

        </a>


        <!-- 現在表示中のページ -->

        <a href="/investmentTrustHistory"
           class="navigation-button active">

            注文履歴

        </a>

    </div>


    <h1>
        投資信託注文履歴
    </h1>


    <!-- =========================
         履歴
    ========================== -->

    <table class="history-table">

        <thead>

        <tr>

            <th>
                注文日
            </th>

            <th>
                銘柄
            </th>

            <th>
                購入金額
            </th>

        </tr>

        </thead>


        <tbody>

        <!-- 仮データ -->

        <tr>

            <td>
                2026/08/26
            </td>

            <td>
                A株式会社
            </td>

            <td>
                2,800円
            </td>

        </tr>


        <tr>

            <td>
                2026/08/20
            </td>

            <td>
                B株式会社
            </td>

            <td>
                5,000円
            </td>

        </tr>


        <tr>

            <td>
                2026/08/10
            </td>

            <td>
                C株式会社
            </td>

            <td>
                3,000円
            </td>

        </tr>

        </tbody>

    </table>


    <!-- =========================
         注文画面へ
    ========================== -->

    <div class="order-button-area">

        <a href="/investmentTrust"
           class="order-button">

            新しく注文する

        </a>

    </div>


</div>

</body>

</html>
