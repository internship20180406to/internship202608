<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>投資信託注文履歴</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            background-color: #f0f0f0;

            margin: 0;
            padding: 40px 20px;

            font-family:
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    "Hiragino Kaku Gothic ProN",
                    "Hiragino Sans",
                    Meiryo,
                    sans-serif;
        }

        .content {
            width: 80%;
            max-width: 1200px;

            margin: 0 auto;
            padding: 30px;

            background-color: #ffffff;
            border-radius: 10px;

            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 40px;

            color: #333333;
        }

        /* ナビゲーション */

        .navigation {
            display: flex;

            margin-bottom: 40px;

            border-bottom: 1px solid #dddddd;
        }

        .navigation-button {
            width: 180px;

            padding: 15px;

            border: 1px solid #cccccc;
            border-bottom: none;
            border-radius: 8px 8px 0 0;

            background-color: #ffffff;
            color: #333333;

            text-align: center;
            text-decoration: none;

            font-size: 18px;
            font-weight: bold;
        }

        .navigation-button:hover {
            background-color: #eeeeee;
        }

        .navigation-button.active {
            background-color: #2185D0;
            color: #ffffff;
            border-color: #2185D0;
        }

        /* 履歴テーブル */

        .history-table {
            width: 100%;

            margin-bottom: 40px;

            border-collapse: collapse;
        }

        .history-table th {
            padding: 15px;

            background-color: #f0f0f0;

            border: 1px solid #dddddd;

            text-align: center;
        }

        .history-table td {
            padding: 15px;

            border: 1px solid #dddddd;

            text-align: center;
        }

        /* ステータス */

        .status-confirming {
            color: #e6a700;
            font-weight: bold;
        }

        .status-completed {
            color: #4CAF50;
            font-weight: bold;
        }

        /* 注文ボタン */

        .order-button-area {
            text-align: center;
        }

        .order-button {
            display: inline-block;

            width: 250px;

            padding: 15px 20px;

            border-radius: 7px;

            background-color: #2185D0;
            color: #ffffff;

            text-decoration: none;

            font-size: 18px;
            font-weight: bold;
        }

        .order-button:hover {
            background-color: #1678c2;
        }

        @media (max-width: 700px) {

            .content {
                width: 100%;
                padding: 20px;
            }

            .history-table {
                font-size: 14px;
            }

            .history-table th,
            .history-table td {
                padding: 10px 5px;
            }

        }

    </style>

</head>

<body>

<div class="content">

    <div class="navigation">

        <a href="/investmentTrust"
           class="navigation-button">
            注文
        </a>

        <a href="/investmentTrustHistory"
           class="navigation-button active">
            注文履歴
        </a>

    </div>

    <h1>
        投資信託注文履歴
    </h1>

    <table class="history-table">

        <thead>

        <tr>
            <th>申込日時</th>
            <th>購入日</th>
            <th>銘柄</th>
            <th>購入金額</th>
            <th>ステータス</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="history : ${history}">

            <td th:text="${history.applicationDate}">
                2026/08/27 16:20
            </td>

            <td>

                <span th:if="${history.purchaseDate != null}"
                      th:text="${history.purchaseDate}">
                    2026/08/28
                </span>

                <span th:if="${history.purchaseDate == null}">
                    -
                </span>

            </td>

            <td th:text="${history.fundName}">
                A株式会社
            </td>

            <td>

                <span th:text="${history.money}">
                    2,800
                </span>

                円

            </td>

            <td>

                <span th:if="${history.status == '確認中'}"
                      class="status-confirming"
                      th:text="${history.status}">
                    確認中
                </span>

                <span th:if="${history.status == '購入済み'}"
                      class="status-completed"
                      th:text="${history.status}">
                    購入済み
                </span>

                <span th:if="${history.status != '確認中' and history.status != '購入済み'}"
                      th:text="${history.status}">
                </span>

            </td>

        </tr>

        <tr th:if="${#lists.isEmpty(history)}">

            <td colspan="5">
                注文履歴はありません。
            </td>

        </tr>

        </tbody>

    </table>

    <div class="order-button-area">

        <a href="/investmentTrust"
           class="order-button">
            新しく注文する
        </a>

    </div>

</div>

</body>

</html>
