<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>注文完了画面</title>
    <link rel="stylesheet" th:href="@{/css/bank-theme.css}"/>

    <style>
        .content{
            width: 90%;
            max-width: 859px;

            margin: 80px auto;
            padding: 50px 35px;

            background-color: var(--color-surface);

            border-radius: var(--radius-card);

            box-shadow: 0 2px 8px rgba(30, 58, 95, 0.08);

            border: 1px solid var(--color-border);

            text-align: center;
        }

        /* 注文日時 */
        .order-date {
            margin: 25px auto 30px;

            padding: 15px 20px;

            max-width: 400px;

            border-radius: var(--radius-card);

            background-color: var(--color-bg);

            border: 1px solid var(--color-border);

            font-size: 15px;
        }

        /* 注文日時のラベル */
        .order-date-label {
            margin-right: 15px;

            font-weight: bold;

            color: var(--color-text-muted);
        }

        /* ボタン(このページの唯一の操作なので幅を少し広めに) */
        .form-control-button {
            min-width: 170px;
        }

        .badge {
            margin-left: 8px;
        }
    </style>
</head>

<body>
<div th:replace="~{fragments/appHeader :: header(pageStatus='注文完了')}"></div>

<!-- 投資信託 完了画面: 注文確定後に注文日時・約定日を表示する画面 -->
<div class="content">

    <!-- ステップ4/4: すべて完了 -->
    <div class="chevron-row">
        <div class="chevron done">お客様情報・口座情報 ✓</div>
        <div class="chevron done">注文内容 ✓</div>
        <div class="chevron done">確認 ✓</div>
        <div class="chevron done">完了 ✓</div>
    </div>

    <p>
        ご注文を受け付けました。
    </p>

    <!-- 注文日時 -->
    <div class="order-date">

        <span class="order-date-label">
            注文日時
        </span>

        <span th:text="${orderDate}">　　<!----controllerからサーバー側で渡されたorderdataをここに標示する時間---->
<!--dezainnkakuninnyoiu  2026年8月25日 15:32-->
        </span>

    </div>

    <!-- 約定日 -->
    <div class="order-date">

        <span class="order-date-label">
            約定日
        </span>

        <span th:text="${#temporals.format(tradeDate, 'yyyy年M月d日')}"></span>
        <span th:if="${sameDayTrade}" class="badge badge-same-day">本日中の約定</span>
        <span th:unless="${sameDayTrade}" class="badge badge-next-day">翌営業日扱い</span>

    </div>

    <!-- 直近の基準価額をもとにした概算購入口数。約定後、正式な基準価額で確定口数に置き換わる -->
    <div class="order-date">
        <span class="order-date-label">概算購入口数</span>
        <span th:text="${#numbers.formatInteger(estimatedUnits, 1, 'COMMA')} + '口'"></span>
    </div>

    <!-- 信託報酬・信託財産留保額は購入代金からは差し引かれないため、参考情報として料率と概算額を開示する -->
    <p class="cost-disclosure">
        信託報酬(年率)： <span th:text="${trustFeeRatePercent}"></span>
        (概算年間費用: <span th:text="${#numbers.formatInteger(trustFeeEstimate, 1, 'COMMA')}"></span>円)
        ／
        信託財産留保額：
        <span th:unless="${hasRedemptionReserve}">なし</span>
        <span th:if="${hasRedemptionReserve}"
              th:text="${redemptionReserveRatePercent} + '(解約時概算: ' + ${#numbers.formatInteger(redemptionReserveEstimate, 1, 'COMMA')} + '円)'"></span>
        ／ <a th:href="@{/investmentTrust/glossary}" target="_blank">用語の意味はこちら</a>
    </p>

    <!-- お客様モード(連絡先+パスワードでのログイン)から、注文状況(申込受付／発注済み／約定済み)をいつでも確認できることを案内する -->
    <p class="cost-disclosure">
        ご注文の状況(申込受付／発注済み／約定済み)は
        <a th:href="@{/investmentTrust/myOrders/login}">こちら(注文履歴・状況の確認)</a>
        からいつでもご確認いただけます。
    </p>

    <p style="text-align: right;">
        <input type="button"
               value="投資信託トップへ"
               class="form-control-button"
               onclick="window.location='/investmentTrust';"/>
    </p>

</div>

</body>

</html>
