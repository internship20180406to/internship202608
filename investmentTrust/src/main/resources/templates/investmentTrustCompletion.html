<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <!-- スマートフォンでPC用の幅に縮小表示されないようにする -->
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>注文完了画面</title>
    <!-- 見た目はチャット画面以外の全画面で共通。/css/style.css にまとめてある -->
    <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<main class="content">
    <header class="page_head">
        <h1>注文完了</h1>
    </header>

    <div class="notice_success">
        <p>お申込みを受け付けました。</p>
    </div>

    <!-- ここに出している値は、POSTの処理からリダイレクトで渡された flash attribute。
         flash attribute は1回だけ取り出せる一時的な入れ物で、URLには出ないので
         申込内容がアドレスバーや履歴に残らない。

         この画面はリダイレクト後のGETなので、再読み込みしても申込は繰り返されない。
         flash attribute が空のまま直接開かれた場合は、コントローラが入力画面へ戻す。 -->
    <dl class="summary">
        <div class="summary_row">
            <dt class="summary_label">金融機関</dt>
            <dd class="summary_value">
                <span th:text="${completedOrder.bankCode}"></span>
                <span th:text="${completedOrder.bankName}"></span>
            </dd>
        </div>
        <div class="summary_row">
            <dt class="summary_label">支店</dt>
            <dd class="summary_value">
                <span th:text="${completedOrder.branchCode}"></span>
                <span th:text="${completedOrder.branchName}"></span>
            </dd>
        </div>
        <div class="summary_row">
            <dt class="summary_label">科目名</dt>
            <dd class="summary_value" th:text="${completedOrder.bankAccountType}"></dd>
        </div>
        <div class="summary_row">
            <dt class="summary_label">口座番号</dt>
            <dd class="summary_value" th:text="${completedOrder.bankAccountNum}"></dd>
        </div>
        <div class="summary_row">
            <dt class="summary_label">購入者名</dt>
            <dd class="summary_value" th:text="${completedOrder.name}"></dd>
        </div>
        <div class="summary_row">
            <dt class="summary_label">銘柄</dt>
            <dd class="summary_value" th:text="${completedOrder.fundName}"></dd>
        </div>
        <div class="summary_row">
            <dt class="summary_label">購入金額</dt>
            <dd class="summary_value">
                <span th:text="${#numbers.formatInteger(completedOrder.money, 1, 'COMMA')}"></span>円
            </dd>
        </div>
        <!-- この画面で一番見たいのは引き落とし後の残高なので、色を変えて最後に置いている -->
        <div class="summary_row summary_row_highlight">
            <dt class="summary_label">引き落とし後の残高</dt>
            <dd class="summary_value">
                <span th:text="${#numbers.formatInteger(balanceAfter, 1, 'COMMA')}"></span>円
            </dd>
        </div>
    </dl>

    <div class="form_actions">
        <input type="button" value="注文に戻る" class="btn btn_primary"
               onclick="window.location='/investmentTrust';"/>
        <input type="button" value="メニューへ" class="btn btn_secondary"
               onclick="window.location='/menu';"/>
    </div>
</main>
</body>
</html>
