<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>注文完了画面</title>

    <style>
        *  {
            box-sizing:border-box;
        }

        body{
            margin:0;
            padding:0;
            background-color: #f4f8fc;
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
            color:#333;
        }

        .content{
            width: 90%;
            max-width: 859px;

            margin: 80px auto;
            padding: 50px 35px;

            background-color: white;

            border-radius: 12px;

            box-shadow: 0 3px 12px rgba(0, 60, 120, 0.08);

            border: 1px solid #e1eaf2;

            text-align: center;
        }

        /* 注文日時 */
        .order-date {
            margin: 25px auto 30px;

            padding: 15px 20px;

            max-width: 400px;

            border-radius: 8px;

            background-color: #f4f8fc;

            border: 1px solid #e1eaf2;

            font-size: 15px;
        }

        /* 注文日時のラベル */
        .order-date-label {
            margin-right: 15px;

            font-weight: bold;

            color: #555;
        }

        /* ボタン */
        input[type="button"] {
            min-width: 170px;
            height: 45px;

            padding: 10px 25px;

            margin: 5px;

            border: none;
            border-radius: 6px;

            cursor: pointer;

            font-size: 15px;
            font-weight: bold;

            color: white;

            background-color: #0072c6;

            box-shadow:
                    0 3px 6px rgba(0, 114, 198, 0.25);

            transition: 0.2s;
        }

        /* ボタン hover */
        input[type="button"]:hover {
            background-color: #005bac;

            transform: translateY(-1px);
        }

        /* ステップ表示(シェブロン矢印型。入力→確認→完了の進み具合を示す) */
        .chevron-row {
            display: flex;
            max-width: 560px;
            margin: 0 auto 20px;
        }
        .chevron {
            flex: 1 1 0;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            background-color: #eef1f5;
            color: #8993a3;
            clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 0 100%, 18px 50%);
        }
        .chevron:first-child {
            clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 0 100%);
        }
        .chevron:last-child {
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 18px 50%);
        }
        .chevron:not(:first-child) {
            margin-left: -18px;
        }
        .chevron.done {
            background-color: #1a9563;
            color: #fff;
        }

    </style>
</head>

<body>

<!-- 投資信託 完了画面: 注文確定後に注文日時・約定日を表示する画面 -->
<div class="content">

    <!-- ステップ3/3: すべて完了 -->
    <div class="chevron-row">
        <div class="chevron done">入力 ✓</div>
        <div class="chevron done">確認 ✓</div>
        <div class="chevron done">完了 ✓</div>
    </div>

    <h1>注文完了</h1>

    <p>
        ご注文を受け付けました。
    </p>

    <!-- 注文日時 -->
    <div class="order-date">

        <span class="order-date-label">
            注文日時
        </span>

        <span th:text="${orderDate}">　　<!----controllerからサーバー側で渡されたorderdataをここに標示する時間---->
<!--dezainnkakuninnyoiu  2026年8月25日 15:32-->
        </span>

    </div>

    <!-- 約定日 -->
    <div class="order-date">

        <span class="order-date-label">
            約定日
        </span>

        <span th:text="${#temporals.format(tradeDate, 'yyyy年M月d日')}"></span>

    </div>

    <p>
        <input type="button"
               value="投資信託トップへ"
               onclick="window.location='/investmentTrust';"/>
    </p>

</div>

</body>

</html>
