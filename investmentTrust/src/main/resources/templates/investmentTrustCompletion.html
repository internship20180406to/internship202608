<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>注文完了画面</title>

    <style>
        *  {
            box-sizing:border-box;
        }

        body{
            margin:0;
            padding:0;
            background-color: #f4f8fc;
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
            color:#333;
        }

        .content{
            width: 90%;
            max-width: 859px;

            margin: 80px auto;
            padding: 50px 35px;

            background-color: white;

            border-radius: 12px;

            box-shadow: 0 3px 12px rgba(0, 60, 120, 0.08);

            border: 1px solid #e1eaf2;

            text-align: center;
        }

        /* 注文日時 */
        .order-date {
            margin: 25px auto 30px;

            padding: 15px 20px;

            max-width: 400px;

            border-radius: 8px;

            background-color: #f4f8fc;

            border: 1px solid #e1eaf2;

            font-size: 15px;
        }

        /* 注文日時のラベル */
        .order-date-label {
            margin-right: 15px;

            font-weight: bold;

            color: #555;
        }

        /* ボタン */
        input[type="button"] {
            min-width: 170px;
            height: 45px;

            padding: 10px 25px;

            margin: 5px;

            border: none;
            border-radius: 6px;

            cursor: pointer;

            font-size: 15px;
            font-weight: bold;

            color: white;

            background-color: #0072c6;

            box-shadow:
                    0 3px 6px rgba(0, 114, 198, 0.25);

            transition: 0.2s;
        }

        /* ボタン hover */
        input[type="button"]:hover {
            background-color: #005bac;

            transform: translateY(-1px);
        }

    </style>
</head>

<body>

<div class="content">

    <h1>注文完了</h1>

    <p>
        ご注文を受け付けました。
    </p>

    <!-- 注文日時 -->
    <div class="order-date">

        <span class="order-date-label">
            注文日時
        </span>

        <span th:text="${orderDate}">　　<!----controllerからサーバー側で渡されたorderdataをここに標示する時間---->
<!--dezainnkakuninnyoiu  2026年8月25日 15:32-->
        </span>

    </div>

    <p>
        <input type="button"
               value="投資信託トップへ"
               onclick="window.location='/investmentTrust';"/>
    </p>

</div>

</body>

</html>
