<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <!-- スマートフォンでPC用の幅に縮小表示されないようにする -->
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>口座登録画面</title>
    <!-- 見た目はチャット画面以外の全画面で共通。/css/style.css にまとめてある -->
    <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<main class="content">
    <header class="page_head">
        <div>
            <a class="back_link" href="/menu">← メニュー</a>
            <h1>口座登録</h1>
        </div>
        <a class="btn btn_secondary btn_head" href="/investmentTrust">投資信託の申込へ</a>
    </header>
    <p class="page_lead">
        投資信託の申込は、ここで登録した口座に対してのみ行えます。
        <small class="text-danger">※</small> は入力必須の項目です。
    </p>

    <form id="accountRegistrationForm" action="#" th:action="@{/accountRegistrationCompletion}"
          th:object="${accountRegistration}" method="post" novalidate>

        <!-- フォーム全体に対するエラー。
             「既に登録されている」は金融機関・支店・科目・口座番号の“組み合わせ”に対する
             判定なので、4項目には赤枠だけを付け、理由はここで1回だけ説明している。 -->
        <div class="form_error_summary" th:if="${#fields.hasGlobalErrors()}">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">エラー内容</p>
        </div>

        <!-- 金融機関・支店の入力は申込画面とまったく同じ作り。
             動きは共通の bankBranchPicker.js が担当していて、
             要素のidもあちらが探しにくる名前に合わせている。 -->
        <div class="field">
            <label class="field_label" for="bankCode">金融機関コード <small class="text-danger">※</small></label>
            <small class="form_hint">半角数字4桁（例: 0001）。入力すると候補が表示されます。
                候補を選んで「選択」を押すと確定します。</small>
            <div class="field_control">
                <input type="text" id="bankCode" th:field="*{bankCode}" class="form-control-code"
                       placeholder="0001" maxlength="4" inputmode="numeric" autocomplete="off"
                       th:errorclass="input-error"/>
                <input type="button" id="bankCodeSelect" value="選択" class="btn btn_secondary btn_inline"/>
                <span class="master_name" id="bankName_view"></span>
            </div>
            <div class="candidate-list hidden" id="bankCode_candidates"></div>
            <span class="form_error" id="bankCode_error"
                  th:text="${#strings.listJoin(#fields.errors('bankCode'), ' ')}"></span>
        </div>

        <div class="field">
            <label class="field_label" for="branchCode">支店コード <small class="text-danger">※</small></label>
            <small class="form_hint">半角数字3桁（例: 002）。金融機関コードを先に選択してください。</small>
            <div class="field_control">
                <input type="text" id="branchCode" th:field="*{branchCode}" class="form-control-code"
                       placeholder="002" maxlength="3" inputmode="numeric" autocomplete="off"
                       th:errorclass="input-error"/>
                <input type="button" id="branchCodeSelect" value="選択" class="btn btn_secondary btn_inline"/>
                <span class="master_name" id="branchName_view"></span>
            </div>
            <div class="candidate-list hidden" id="branchCode_candidates"></div>
            <span class="form_error" id="branchCode_error"
                  th:text="${#strings.listJoin(#fields.errors('branchCode'), ' ')}"></span>
        </div>

        <!-- 科目名はラジオボタン。th:field を付けると id が accountType1, accountType2 … と
             連番になるため、見出しは特定の <input> を指せない。そのため <label> ではなく <span> にしている -->
        <div class="field">
            <span class="field_label">科目名 <small class="text-danger">※</small></span>
            <span class="radio-group" id="accountType_group"
                  th:classappend="${#fields.hasErrors('accountType')} ? 'input-error' : ''">
                <label class="radio-label" th:each="type : ${typeOptions}">
                    <input type="radio" th:field="*{accountType}" th:value="${type}"/>
                    <span th:text="${type}">選択肢</span>
                </label>
            </span>
            <span class="form_error" id="accountType_error"
                  th:text="${#strings.listJoin(#fields.errors('accountType'), ' ')}"></span>
        </div>

        <div class="field">
            <label class="field_label" for="accountNum">口座番号 <small class="text-danger">※</small></label>
            <input type="text" id="accountNum" th:field="*{accountNum}" class="form-control"
                   placeholder="1234567" maxlength="7" inputmode="numeric" th:errorclass="input-error"/>
            <span class="form_error" id="accountNum_error"
                  th:text="${#strings.listJoin(#fields.errors('accountNum'), ' ')}"></span>
        </div>

        <div class="field">
            <label class="field_label" for="accountName">口座名義 <small class="text-danger">※</small></label>
            <small class="form_hint">半角カナと半角スペースで入力してください（例: ﾔﾏﾀﾞ ﾀﾛｳ）。<br>
                かな・全角カナで入力しても自動で半角カナに変換されます。</small>
            <input type="text" id="accountName" th:field="*{accountName}" class="form-control"
                   placeholder="ﾔﾏﾀﾞ ﾀﾛｳ" maxlength="20" th:errorclass="input-error"/>
            <span class="form_error" id="accountName_error"
                  th:text="${#strings.listJoin(#fields.errors('accountName'), ' ')}"></span>
        </div>

        <div class="field">
            <label class="field_label" for="balance">初期残高 <small class="text-danger">※</small></label>
            <small class="form_hint">0円以上10,000,000,000円以下。</small>
            <input type="text" id="balance" th:field="*{balance}" class="form-control"
                   placeholder="1,000,000" maxlength="14" inputmode="numeric" th:errorclass="input-error"/>
            <span class="form_error" id="balance_error"
                  th:text="${#strings.listJoin(#fields.errors('balance'), ' ')}"></span>
        </div>

        <div class="form_actions">
            <input type="submit" id="register" value="登録" class="btn btn_success"/>
            <input type="reset" id="clear" value="クリア" class="btn btn_secondary"/>
        </div>
    </form>

    <nav class="page_nav">
        <a href="/menu">メニューへ戻る</a>
        <a href="/investmentTrust">投資信託の申込画面へ</a>
    </nav>

    <!-- bankBranchPicker.js が先。accountRegistration.js はそこで定義された
         BANK_CODE_PATTERN / setupBankBranchPickers などを使うため -->
    <script src="/js/bankBranchPicker.js"></script>
    <script src="/js/numberFormat.js"></script>
    <script src="/js/hankakuKana.js"></script>
    <script src="/js/accountRegistration.js"></script>
</main>
</body>
</html>
