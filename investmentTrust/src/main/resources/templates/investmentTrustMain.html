<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <!-- スマートフォンでPC用の幅に縮小表示されないようにする -->
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>投資信託注文情報入力画面</title>
    <!-- 見た目はチャット画面以外の全画面で共通。/css/style.css にまとめてある -->
    <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<main class="content">
    <header class="page_head">
        <div>
            <a class="back_link" href="/menu">← メニュー</a>
            <h1>投資信託注文情報入力</h1>
        </div>
        <a class="btn btn_secondary btn_head" href="/accountRegistration">口座登録はこちら</a>
    </header>
    <p class="page_lead">
        <small class="text-danger">※</small> は入力必須の項目です。
    </p>

    <!-- novalidate: ブラウザ標準のエラー表示を止めて、JSで出すメッセージに統一する -->
    <!-- 各項目の <span class="form_error"> にはサーバサイドのエラーメッセージを表示する。
         th:errors はエラーが無いと span ごと消えてしまい JS 側が要素を取得できなくなるため、
         代わりに #fields.errors(...) を文字列化して th:text で埋めている（エラーが無ければ空文字）。 -->
    <form id="investmentTrustForm" action="#" th:action="@{/investmentTrustConfirmation}"
          th:object="${investmentTrustApplication}" method="post" novalidate>

        <!-- フォーム全体に対するエラー。
             「口座が見つからない」は金融機関・支店・科目・口座番号の“組み合わせ”に対する
             エラーで、どれか1つが間違っていると分かっているわけではない。
             そのため4項目には赤枠だけを付け、理由はここで1回だけ説明している。 -->
        <div class="form_error_summary" th:if="${#fields.hasGlobalErrors()}">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">エラー内容</p>
        </div>

        <!-- 金融機関はコードで指定する。名称は入力させず、コードからマスタを引いて表示する。
             ・コードを打つと下に候補が並び、候補をクリックするとコード欄に入る
             ・「選択」ボタンを押した時点で確定し、金融機関名が表示される
             ・表示された名称は画面に出すだけで、サーバへは送らない（サーバ側で引き直す）。
               hidden項目で名称を送り返すと、開発者ツールで書き換えられてしまうため -->
        <div class="field">
            <label class="field_label" for="bankCode">金融機関コード <small class="text-danger">※</small></label>
            <small class="form_hint">半角数字4桁（例: 0001）。入力すると候補が表示されます。
                候補を選んで「選択」を押すと確定します。</small>
            <div class="field_control">
                <input type="text" id="bankCode" th:field="*{bankCode}" class="form-control-code"
                       placeholder="0001" maxlength="4" inputmode="numeric" autocomplete="off"
                       th:errorclass="input-error"/>
                <input type="button" id="bankCodeSelect" value="選択" class="btn btn_secondary btn_inline"/>
                <span class="master_name" id="bankName_view" th:text="*{bankName}"></span>
            </div>
            <div class="candidate-list hidden" id="bankCode_candidates"></div>
            <span class="form_error" id="bankCode_error"
                  th:text="${#strings.listJoin(#fields.errors('bankCode'), ' ')}"></span>
        </div>

        <div class="field">
            <label class="field_label" for="bankAccountNum">口座番号 <small class="text-danger">※</small></label>
            <input type="text" id="bankAccountNum" th:field="*{bankAccountNum}" class="form-control"
                   placeholder="1234567" maxlength="7" inputmode="numeric"
                   th:errorclass="input-error"/>
            <span class="form_error" id="bankAccountNum_error"
                  th:text="${#strings.listJoin(#fields.errors('bankAccountNum'), ' ')}"></span>
        </div>

        <!-- 支店コードは金融機関コードとセットで初めて支店を特定できるので、
             候補も1件検索も /api/banks/{bankCode}/branches... の形で両方を渡す。
             金融機関が確定していない間は候補を出さず、その旨を表示する。 -->
        <div class="field">
            <label class="field_label" for="branchCode">支店コード <small class="text-danger">※</small></label>
            <small class="form_hint">半角数字3桁（例: 002）。金融機関コードを先に選択してください。</small>
            <div class="field_control">
                <input type="text" id="branchCode" th:field="*{branchCode}" class="form-control-code"
                       placeholder="002" maxlength="3" inputmode="numeric" autocomplete="off"
                       th:errorclass="input-error"/>
                <input type="button" id="branchCodeSelect" value="選択" class="btn btn_secondary btn_inline"/>
                <span class="master_name" id="branchName_view" th:text="*{branchName}"></span>
            </div>
            <div class="candidate-list hidden" id="branchCode_candidates"></div>
            <span class="form_error" id="branchCode_error"
                  th:text="${#strings.listJoin(#fields.errors('branchCode'), ' ')}"></span>
        </div>

        <!-- 科目名はラジオボタン。1つの項目が選択肢の数だけ <input> に分かれる点がプルダウンと異なる。
             ・th:field を付けると id は bankAccountType1, bankAccountType2 … と連番になるため、
               JS側は id ではなく name（bankAccountType）でまとめて取得している。
               見出しも特定の <input> を指せないので <label> ではなく <span> にしている。
             ・選択肢ごとに赤枠を付けても見づらいので、エラー時は全体を囲む span に .input-error を付ける。
               th:errorclass は入力欄そのものに付けるものなので、代わりに th:classappend で判定している。
             ・未選択のまま送信するとブラウザは値を送らない（bankAccountTypeはnullになる）ので、
               サーバ側の @NotBlank でそのまま未選択エラーになる。 -->
        <div class="field">
            <span class="field_label">科目名 <small class="text-danger">※</small></span>
            <span class="radio-group" id="bankAccountType_group"
                  th:classappend="${#fields.hasErrors('bankAccountType')} ? 'input-error' : ''">
                <label class="radio-label" th:each="type : ${typeOptions}">
                    <input type="radio" th:field="*{bankAccountType}" th:value="${type}"/>
                    <span th:text="${type}">選択肢</span>
                </label>
            </span>
            <span class="form_error" id="bankAccountType_error"
                  th:text="${#strings.listJoin(#fields.errors('bankAccountType'), ' ')}"></span>
        </div>

        <div class="field">
            <label class="field_label" for="name">購入者名 <small class="text-danger">※</small></label>
            <small class="form_hint">半角カナと半角スペースで入力してください（例: ﾔﾏﾀﾞ ﾀﾛｳ）。<br>
                全角カナ「ヤマダ」・漢字「山田」・英数字は使用できません。</small>
            <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="ﾔﾏﾀﾞ ﾀﾛｳ"
                   maxlength="20" th:errorclass="input-error"/>
            <span class="form_error" id="name_error"
                  th:text="${#strings.listJoin(#fields.errors('name'), ' ')}"></span>
        </div>

        <div class="field">
            <label class="field_label" for="fundName">銘柄選択 <small class="text-danger">※</small></label>
            <select id="fundName" th:field="*{fundName}" class="form-control" th:errorclass="input-error">
                <option value="">選択してください</option>
                <option th:each="fund : ${fundOptions}"
                        th:value="${fund}"
                        th:text="${fund}">選択肢
                </option>
            </select>
            <span class="form_error" id="fundName_error"
                  th:text="${#strings.listJoin(#fields.errors('fundName'), ' ')}"></span>
        </div>

        <div class="field">
            <label class="field_label" for="money">金額 <small class="text-danger">※</small></label>
            <input type="text" id="money" th:field="*{money}" class="form-control"
                   placeholder="10,000" maxlength="12" inputmode="numeric"
                   th:errorclass="input-error"/>
            <span class="form_error" id="money_error"
                  th:text="${#strings.listJoin(#fields.errors('money'), ' ')}"></span>
        </div>

        <div class="form_actions">
            <input type="submit" id="confirm" value="確認" class="btn btn_primary"/>
            <input type="reset" id="clear" value="クリア" class="btn btn_secondary"/>
        </div>
    </form>

    <nav class="page_nav">
        <a href="/menu">メニューへ戻る</a>
        <a href="/investmentTrustChat">チャット形式で入力する</a>
    </nav>

    <!-- 共通の部品を先に読み込む。inputConfirmation.js はここで定義された
         BANK_CODE_PATTERN / setupBankBranchPickers / setupCommaInput / setupHankakuInput
         などを使うため、順番を入れ替えないこと。
         これらは口座登録画面（accountRegistrationMain.html）でも同じものを使っている。 -->
    <script src="/js/bankBranchPicker.js"></script>
    <script src="/js/numberFormat.js"></script>
    <script src="/js/hankakuKana.js"></script>
    <script th:inline="javascript" src="/js/inputConfirmation.js"></script>
</main>
</body>
</html>
