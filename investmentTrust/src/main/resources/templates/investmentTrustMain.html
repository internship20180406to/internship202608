<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>お客様情報・口座情報入力画面</title>
    <link rel="stylesheet" th:href="@{/css/bank-theme.css}"/>
    <style>
        .header-title {
            max-width: 900px;
            margin: 0 auto;
            font-size: 20px;
            font-weight: bold;
        }

        /* メイン */
        .content {
            width: 90%;
            max-width: 850px;
            margin: 35px auto 50px;
        }

        /* ページタイトル */
        h1 {
            margin-bottom: 30px;
        }

        /* セクション */
        .form-section {
            margin-bottom: 25px;
            padding: 0 35px 30px;
        }

        /* セクションタイトル */
        .section-title {
            margin: 0 -35px 25px;
            padding: 15px 25px;
        }

        /* ボタンエリア(次の画面へ進むボタンは右、その場で完結するボタンは左) */
        .button-area {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        /* 項目ごとの入力済みマーク(入力が終わると※から緑の✓に切り替わる) */
        .field-done {
            display: none;
            color: var(--color-accent-green);
            font-weight: bold;
            margin-left: 6px;
        }

        /* レスポンシブ対応: 画面幅に十分な余裕がある場合は項目を2カラムに並べ、縦の高さを抑える(ノートPC・タブレットでも窮屈にならないようにする) */
        @media (min-width: 900px) {
            .form-section {
                display: grid;
                grid-template-columns: 1fr 1fr;
                column-gap: 30px;
            }

            .section-title {
                grid-column: 1 / -1;
            }
        }

        /* レスポンシブ対応: 画面の高さが小さい(ノートPC・タブレット程度)場合は、余白・文字サイズを詰めてスクロールなしで収まりやすくする */
        @media (max-height: 800px) {
            .content {
                margin: 15px auto 20px;
            }

            h1 {
                font-size: clamp(20px, 2.5vh, 28px);
                margin-bottom: 15px;
            }

            .form-section {
                padding-bottom: 15px;
                margin-bottom: 15px;
            }

            .section-title {
                padding: 10px 25px;
                margin-bottom: 15px;
            }

            .form-control {
                height: 40px;
                padding: 8px 14px;
            }
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/appHeader :: header(pageStatus='お客様情報・口座情報の入力')}"></div>
<!-- 投資信託 申し込みStep1: お客様情報(姓・名・住所・連絡先・パスワード)と口座情報(金融機関・支店・口座番号・科目名)をまとめて入力する画面 -->
<div class="content">
    <p class="staff-mode-link" style="display: flex; justify-content: space-between;">
        <a th:href="@{/investmentTrust/glossary}" target="_blank">投資信託が初めての方へ(用語集)</a>
        <span>
            <a th:href="@{/investmentTrust/myOrders/login}">注文履歴・状況の確認</a>
            ｜ <a th:href="@{/investmentTrust/staff/login}">行員モードへ切替</a>
        </span>
    </p>

    <!-- ステップ1/4: お客様情報・口座情報を入力中 -->
    <div class="chevron-row">
        <div class="chevron active">お客様情報・口座情報</div>
        <div class="chevron">注文内容</div>
        <div class="chevron">確認</div>
        <div class="chevron">完了</div>
    </div>

    <form action="#" th:action="@{/investmentTrust/order}" th:object="${investmentTrustApplication}" method="post">

        <!-- セクション1: お客様情報(氏名・住所・連絡先・パスワード。口座情報とは見出しを分けて誤入力・混同を防ぐ) -->
        <div class="form-section">
            <div class="section-title">お客様情報</div>

            <!-------氏名(姓・名を分けて誤入力・混同を防ぐ)-------->
            <p>
                <label class="ml-1">姓: <small class="text-danger ml-1" id="required-lastName">※</small><span class="field-done" id="done-lastName">✓</span></label><br>
                <input type="text" id="lastName" th:field="*{lastName}" class="form-control" placeholder="投資" required>
            </p>
            <p>
                <label class="ml-1">名: <small class="text-danger ml-1" id="required-firstName">※</small><span class="field-done" id="done-firstName">✓</span></label><br>
                <input type="text" id="firstName" th:field="*{firstName}" class="form-control" placeholder="信託" required>
            </p>

            <!-------住所-------->
            <p>
                <label class="ml-1">住所: <small class="text-danger ml-1" id="required-address">※</small><span class="field-done" id="done-address">✓</span></label><br>
                <input type="text" id="address" th:field="*{address}" class="form-control" placeholder="福岡県福岡市中央区〇〇1-2-3" required>
            </p>

            <!-------連絡先-------->
            <p>
                <label class="ml-1">連絡先: <small class="text-danger ml-1" id="required-contact">※</small><span class="field-done" id="done-contact">✓</span></label><br>
                <input type="text" id="contact" th:field="*{contact}" class="form-control" placeholder="090-1234-5678" inputmode="numeric" maxlength="13" required>
                <span class="field-error" id="error-contact"></span>
            </p>

            <!-------パスワード(お客様モードでの注文履歴確認時、連絡先とあわせて使用)-------->
            <p>
                <label class="ml-1">パスワード(注文履歴確認用): <small class="text-danger ml-1" id="required-password">※</small><span class="field-done" id="done-password">✓</span></label><br>
                <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="半角英数字4文字以上" minlength="4" required>
            </p>
        </div>

        <!-- セクション2: 口座情報(引き落とし口座を特定するための項目) -->
        <div class="form-section">
            <div class="section-title">口座情報</div>

            <p><label class="ml-1">金融機関名: <small class="text-danger ml-1" id="required-institutionCode">※</small><span class="field-done" id="done-institutionCode">✓</span></label><br>
                <select id="institutionCode" th:field="*{institutionCode}" class="form-control" required>
                    <option value="">選択してください</option>
                    <option th:each="institution : ${institutionList}"
                            th:value="${institution.institutionCode}"
                            th:text="${institution.institutionName}"></option>
                </select></p>

            <!----口座番号------>
            <p><label class="ml-1">口座番号: <small class="text-danger ml-1" id="required-bankAccountNum">※</small><span class="field-done" id="done-bankAccountNum">✓</span></label><br>
                <input type="text" id="bankAccountNum" th:field="*{bankAccountNum}" class="form-control" placeholder="1234567" maxlength="7" inputmode="numeric" pattern="[0-9]{7}" required>
                <span class="field-error" id="error-bankAccountNum"></span></p>

            <!-----支店名------->
            <p>
                <label class="ml-1">支店名: <small class="text-danger ml-1" id="required-branchCode">※</small><span class="field-done" id="done-branchCode">✓</span></label><br>
                <select id="branchCode" th:field="*{branchCode}" class="form-control" required>
                    <option value="">金融機関を選択してください</option>
                </select>
            </p>

            <p><!------科目名------>
                <label class="ml-1">科目名: <small class="text-danger ml-1" id="required-bankSubject">※</small><span class="field-done" id="done-bankSubject">✓</span></label><br>
                <select id="bankSubject" th:field="*{bankSubject}" class="form-control" required>
                    <option value="">選択してください</option>
                    <option value="普通預金">普通預金</option>
                    <option value="定期預金">定期預金</option>
                    <option value="当座預金">当座預金</option>
                    <option value="貯蓄預金">貯蓄預金</option>
                </select>
            </p>
        </div>

        <!-- 他ステップ(注文内容)の入力内容は、このステップでは表示せずhiddenで引き継ぐ -->
        <input type="hidden" name="fundCode" th:value="*{fundCode}"/>
        <input type="hidden" name="purchaseAmount" th:value="*{purchaseAmount}"/>

        <div class="button-area">
            <input type="reset"
                   value="入力内容をクリア"
                   class="form-control-button form-clear-button"/>

            <input type="submit"
                   value="次へ"
                   class="form-control-button form-confirmation-button"/>
        </div>
    </form>
</div>

<!-- サーバー側のマスタデータをJSに渡す(支店の絞り込みに使う)。必須項目の✓マーク切替は共通スクリプトが担当する -->
<script th:inline="javascript">
    /*<![CDATA[*/
    const branchMasterList = /*[[${branchList}]]*/ [];
    const initialBranchCode = /*[[${investmentTrustApplication.branchCode}]]*/ '';
    const requiredFieldIds = ["lastName", "firstName", "address", "contact", "password",
        "institutionCode", "bankAccountNum", "branchCode", "bankSubject"];
    /*]]>*/
</script>
<script src="/js/investmentTrustMain.js"></script>
<script src="/js/investmentTrustAccountInfo.js"></script>
<script src="/js/investmentTrustFieldCheck.js"></script>

</body>

</html>
