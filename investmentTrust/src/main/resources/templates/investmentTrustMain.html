<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>投資信託注文情報入力画面</title>
    <style>
        * {
            box-sizing: border-box;
        }
        /*全体*/
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f8fc;
            font-family:
                /*フォント（）文字の書式設定・*/
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    "Noto Sans JP",
                    sans-serif;
            color: #333;
        }



        .header-title {
            max-width: 900px;
            margin: 0 auto;
            font-size: 20px;
            font-weight: bold;
        }

        /* メイン */
        .content {
            width: 90%;
            max-width: 850px;
            margin: 35px auto 50px;
        }

        /* ページタイトル */
        h1 {
            text-align: center;
            color: #005bac;
            font-size: 28px;
            margin: 0 0 30px;
            font-weight: 600;
        }

        /* セクション */
        .form-section {
            background-color: white;
            border-radius: 12px;
            margin-bottom: 25px;
            padding: 0 35px 30px;
            box-shadow: 0 3px 12px rgba(0, 60, 120, 0.08);
            border: 1px solid #e1eaf2;
        }

        /* セクションタイトル */
        .section-title {
            margin: 0 -35px 25px;
            padding: 15px 25px;

            color: white;
            background-color: #005bac;
            /*角マルク↓*/
            border-radius: 12px 12px 0 0;

            font-size: 17px;
            font-weight: bold;
        }

        /* 入力項目 */


        /* ラベル口座番号とか */
        label {
            display: block;


            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        /* 必須マーク */
        .text-danger {
            color: #d60000;
            font-size: 11px;
            margin-left: 6px;
            font-weight: normal;
        }

        /* 入力欄 */
        .form-control {
            width: 100%;
            height: 44px;

            padding: 10px 14px;

            border: 1px solid #c7d5e2;
            border-radius: 7px;

            background-color: #fff;

            font-size: 14px;
            color: #333;

            outline: none;

            transition: all 0.2s ease;
        }

        /* フォーカス */
        .form-control:focus {
            border-color: #0072c6;

            box-shadow:
                    0 0 0 2px rgba(0, 114, 198, 0.15);
        }

        /* select 押したところを指さしで視覚的にわかりやすく*/
        select.form-control {
            cursor: pointer;
        }

        /* ボタンエリア */
        .button-area {
            text-align: center;
            margin-top: 30px;
        }

        /* ボタン共通　 */
        .form-control-button {
            min-width: 140px;
            height: 45px;
            padding: 10px 25px;
            margin: 5px;
            border: none;
            border-radius: 6px;

            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: 0.2s;
        }

        /* 確認ボタン */
        .form-confirmation-button {
            color: white;
            background-color: #0072c6;
            /*ボタンに影をつけて浮いているように*/
            box-shadow:
                    0 3px 6px rgba(0, 114, 198, 0.25);
        }
        /*まうすをカーソルの上に乗せたときに見た目を変更する*/
        .form-confirmation-button:hover {
            background-color: #005bac;
            transform: translateY(-1px);
        }
        /* クリア */
        .form-clear-button {
            color: #555;
            background-color: #e7edf3;
        }
        .form-clear-button:hover {
            background-color: #d8e1e9;
        }
        /* スマホ６００いかはここをしよう */
        /*      @media (max-width: 600px) {    いったんいらない

                  .header {
                      padding: 15px 20px;
                  }

                  .content {
                      width: 95%;
                      margin-top: 25px;
                  }

                  .form-section {
                      padding: 0 20px 25px;
                  }

                  .section-title {
                      margin-left: -20px;
                      margin-right: -20px;
                  }

                  h1 {
                      font-size: 23px;
                  }

                  .form-control-button {
                      width: 90%;
                      margin: 5px auto;
                  }
              }*/
    </style>
</head>
<body>
<div class="content">
    <h1>投資信託注文情報入力</h1>
    <form action="#" th:action="@{/investmentTrustConfirmation}" th:object="${investmentTrustApplication}" method="post">
        <p><label class="ml-1">金融機関名: <small class="text-danger ml-1">※</small></label><br>
            <select th:field="*{bankName}" class="form-control"required>
                <option value="">選択してください</option>
                <option value="海銀行">海銀行</option>
                <option value="山陰共同銀行">山陰共同銀行</option>
                <option value="流れ星銀行">流れ星銀行</option>
                <option value="ハレルヤ銀行">ハレルヤ銀行</option>
            </select></p>
        <!----口座番号------>
        <p><label class="ml-1">口座番号: <small class="text-danger ml-1">※</small></label><br>
            <input type="number" th:field="*{bankAccountNum}" class="form-control" placeholder="1234567"  maxlength="7"  inputmode="mumeric" required></p>

        <!-----支店名------->
        <p>
            <label class="ml-1">支店名: <small class="text-danger ml-1">※</small></label><br>
            <select id="branch" th:field="*{branch}" class="form-control" required>
                <option value="">選択してください</option>
                <option value="小倉店">小倉店</option>
                <option value="福岡店">福岡店</option>
                <option value="久留米店">久留米店</option>
                <option value="飯塚店">飯塚店</option>
            </select>
        </p>

        <p><!------科目名------>
            <label class="ml-1">科目名: <small class="text-danger ml-1">※</small></label><br>
            <select id="bankSubject" th:field="*{bankSubject}" class="form-control" required>
                <option value="">選択してください</option>
                <option value="普通預金">普通預金</option>
                <option value="定期預金">定期預金</option>
                <option value="当座預金">当座預金</option>
                <option value="貯蓄預金">貯蓄預金</option>
            </select>
        </p>

        <!-------購入者名-------->
        <p>
            <label class="ml-1">購入者名: <small class="text-danger ml-1">※</small></label><br>
            <input type="text" id="purchaserName" th:field="*{purchaserName}" class="form-control" placeholder="投資　信託" required>

        </p>

        <!-----銘柄選択（SelectBoX）------->
        <p>
            <label class="ml-1">銘柄選択: <small class="text-danger ml-1">※</small></label><br>
            <select id="investmentTrustName" th:field="*{investmentTrustName}" class="form-control" required>
                <option value="">選択してください</option>
                <option value="モビリティ・イノベーション・ファンド">モビリティ・イノベーション・ファンド</option>
                <option value="HSBCインドオープン">HSBCインドオープン</option>
                <option value="新興国連続増配成長株オープン">新興国連続増配成長株オープン</option>
                <option value="日本高配当リバランスオープン">日本高配当リバランスオープン</option>
                <option value="損保ジャパン・グリーン・オープン 愛称：ぶなの森">損保ジャパン・グリーン・オープン 愛称：ぶなの森</option>
                <option value="みずほ好配当日本株オープン">みずほ好配当日本株オープン</option>
            </select>
        </p>

        <!-------購入金額-------->
        <p>
            <!-最低限１０００円マックス----->
            <label class="ml-1">購入金額: <small class="text-danger ml-1">※</small></label><br>
            <input type="number"
                   id="purchaseAmount"
                   th:field="*{purchaseAmount}"
                   class="form-control"
                   placeholder="1000円以上の金額を入力してください"
                   min="1000"
                   max="1000000000000000000000"
                   required>
        </p>

        <p style="text-align: center;">
            <input type="submit"
                   value="注文内容を確認する"
                   class="form-control-button form-confirmation-button"/>

            <input type="reset"
                   value="入力内容をクリア"
                   class="form-control-button form-clear-button"/>
        </p>
    </form>
</div>

<!-- STEP1：購入金額チェック用JavaScript -->
<script src="/js/investmentTrust.js"></script>
<!--外部javascript読み込みここではinvestmentTrust.jsダイヤログ-->

</body>

</html>
