<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>投資信託注文情報入力画面</title>
    <style>
        * {
            box-sizing: border-box;
        }
        /*全体*/
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f8fc;
            font-family:
                /*フォント（）文字の書式設定・*/
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    "Noto Sans JP",
                    sans-serif;
            color: #333;
        }



        .header-title {
            max-width: 900px;
            margin: 0 auto;
            font-size: 20px;
            font-weight: bold;
        }

        /* メイン */
        .content {
            width: 90%;
            max-width: 850px;
            margin: 35px auto 50px;
        }

        /* ページタイトル */
        h1 {
            text-align: center;
            color: #005bac;
            font-size: 28px;
            margin: 0 0 30px;
            font-weight: 600;
        }

        /* セクション */
        .form-section {
            background-color: white;
            border-radius: 12px;
            margin-bottom: 25px;
            padding: 0 35px 30px;
            box-shadow: 0 3px 12px rgba(0, 60, 120, 0.08);
            border: 1px solid #e1eaf2;
        }

        /* セクションタイトル */
        .section-title {
            margin: 0 -35px 25px;
            padding: 15px 25px;

            color: white;
            background-color: #005bac;
            /*角マルク↓*/
            border-radius: 12px 12px 0 0;

            font-size: 17px;
            font-weight: bold;
        }

        /* 入力項目 */


        /* ラベル口座番号とか */
        label {
            display: block;


            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        /* 必須マーク */
        .text-danger {
            color: #d60000;
            font-size: 11px;
            margin-left: 6px;
            font-weight: normal;
        }

        /* 入力欄 */
        .form-control {
            width: 100%;
            height: 44px;

            padding: 10px 14px;

            border: 1px solid #c7d5e2;
            border-radius: 7px;

            background-color: #fff;

            font-size: 14px;
            color: #333;

            outline: none;

            transition: all 0.2s ease;
        }

        /* フォーカス */
        .form-control:focus {
            border-color: #0072c6;

            box-shadow:
                    0 0 0 2px rgba(0, 114, 198, 0.15);
        }

        /* select 押したところを指さしで視覚的にわかりやすく*/
        select.form-control {
            cursor: pointer;
        }

        /* ボタンエリア */
        .button-area {
            text-align: center;
            margin-top: 30px;
        }

        /* ボタン共通　 */
        .form-control-button {
            min-width: 140px;
            height: 45px;
            padding: 10px 25px;
            margin: 5px;
            border: none;
            border-radius: 6px;

            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: 0.2s;
        }

        /* 確認ボタン */
        .form-confirmation-button {
            color: white;
            background-color: #0072c6;
            /*ボタンに影をつけて浮いているように*/
            box-shadow:
                    0 3px 6px rgba(0, 114, 198, 0.25);
        }
        /*まうすをカーソルの上に乗せたときに見た目を変更する*/
        .form-confirmation-button:hover {
            background-color: #005bac;
            transform: translateY(-1px);
        }
        /* クリア */
        .form-clear-button {
            color: #555;
            background-color: #e7edf3;
        }
        .form-clear-button:hover {
            background-color: #d8e1e9;
        }
        /* スマホ６００いかはここをしよう */
        /*      @media (max-width: 600px) {    いったんいらない

                  .header {
                      padding: 15px 20px;
                  }

                  .content {
                      width: 95%;
                      margin-top: 25px;
                  }

                  .form-section {
                      padding: 0 20px 25px;
                  }

                  .section-title {
                      margin-left: -20px;
                      margin-right: -20px;
                  }

                  h1 {
                      font-size: 23px;
                  }

                  .form-control-button {
                      width: 90%;
                      margin: 5px auto;
                  }
              }*/

        /* ステップ表示(シェブロン矢印型。入力→確認→完了の進み具合を示す) */
        .chevron-row {
            display: flex;
            max-width: 560px;
            margin: 0 auto 30px;
        }
        .chevron {
            flex: 1 1 0;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            background-color: #eef1f5;
            color: #8993a3;
            clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 0 100%, 18px 50%);
        }
        .chevron:first-child {
            clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 0 100%);
        }
        .chevron:last-child {
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 18px 50%);
        }
        .chevron:not(:first-child) {
            margin-left: -18px;
        }
        /* 現在のステップ */
        .chevron.active {
            background-color: #0072c6;
            color: #fff;
        }
        /* 完了済みのステップ */
        .chevron.done {
            background-color: #1a9563;
            color: #fff;
        }

        /* 項目ごとの入力済みマーク(入力が終わると※から緑の✓に切り替わる) */
        .field-done {
            display: none;
            color: #1a9563;
            font-weight: bold;
            margin-left: 6px;
        }
    </style>
</head>
<body>
<!-- 投資信託 入力画面: 顧客が金融機関・支店・銘柄・購入金額などを入力する画面 -->
<div class="content">
    <p style="display: flex; justify-content: space-between;">
        <a th:href="@{/investmentTrust/intro}">← 紹介ページに戻る</a>
        <a th:href="@{/investmentTrust/staff/login}">行員モードへ切替</a>
    </p>

    <!-- ステップ1/3: 入力中 -->
    <div class="chevron-row">
        <div class="chevron active">入力</div>
        <div class="chevron">確認</div>
        <div class="chevron">完了</div>
    </div>

    <h1>投資信託注文情報入力</h1>
    <form action="#" th:action="@{/investmentTrustConfirmation}" th:object="${investmentTrustApplication}" method="post">

        <!-- セクション1: お客様情報(氏名・住所・連絡先。口座情報とは分けて誤入力・混同を防ぐ) -->
        <div class="form-section">
            <div class="section-title">お客様情報</div>

            <!-------氏名(姓・名を分けて誤入力・混同を防ぐ)-------->
            <p>
                <label class="ml-1">姓: <small class="text-danger ml-1" id="required-lastName">※</small><span class="field-done" id="done-lastName">✓</span></label><br>
                <input type="text" id="lastName" th:field="*{lastName}" class="form-control" placeholder="投資" required>
            </p>
            <p>
                <label class="ml-1">名: <small class="text-danger ml-1" id="required-firstName">※</small><span class="field-done" id="done-firstName">✓</span></label><br>
                <input type="text" id="firstName" th:field="*{firstName}" class="form-control" placeholder="信託" required>
            </p>

            <!-------住所-------->
            <p>
                <label class="ml-1">住所: <small class="text-danger ml-1" id="required-address">※</small><span class="field-done" id="done-address">✓</span></label><br>
                <input type="text" id="address" th:field="*{address}" class="form-control" placeholder="福岡県福岡市中央区〇〇1-2-3" required>
            </p>

            <!-------連絡先-------->
            <p>
                <label class="ml-1">連絡先: <small class="text-danger ml-1" id="required-contact">※</small><span class="field-done" id="done-contact">✓</span></label><br>
                <input type="text" id="contact" th:field="*{contact}" class="form-control" placeholder="090-1234-5678" required>
            </p>
        </div>

        <!-- セクション2: 口座情報(引き落とし口座を特定するための項目) -->
        <div class="form-section">
            <div class="section-title">口座情報</div>

            <p><label class="ml-1">金融機関名: <small class="text-danger ml-1" id="required-institutionCode">※</small><span class="field-done" id="done-institutionCode">✓</span></label><br>
                <select id="institutionCode" th:field="*{institutionCode}" class="form-control" required>
                    <option value="">選択してください</option>
                    <option th:each="institution : ${institutionList}"
                            th:value="${institution.institutionCode}"
                            th:text="${institution.institutionName}"></option>
                </select></p>

            <!----口座番号------>
            <p><label class="ml-1">口座番号: <small class="text-danger ml-1" id="required-bankAccountNum">※</small><span class="field-done" id="done-bankAccountNum">✓</span></label><br>
                <input type="text" id="bankAccountNum" th:field="*{bankAccountNum}" class="form-control" placeholder="1234567" maxlength="7" inputmode="numeric" pattern="[0-9]{7}" required></p>

            <!-----支店名------->
            <p>
                <label class="ml-1">支店名: <small class="text-danger ml-1" id="required-branchCode">※</small><span class="field-done" id="done-branchCode">✓</span></label><br>
                <select id="branchCode" th:field="*{branchCode}" class="form-control" required>
                    <option value="">金融機関を選択してください</option>
                </select>
            </p>

            <p><!------科目名------>
                <label class="ml-1">科目名: <small class="text-danger ml-1" id="required-bankSubject">※</small><span class="field-done" id="done-bankSubject">✓</span></label><br>
                <select id="bankSubject" th:field="*{bankSubject}" class="form-control" required>
                    <option value="">選択してください</option>
                    <option value="普通預金">普通預金</option>
                    <option value="定期預金">定期預金</option>
                    <option value="当座預金">当座預金</option>
                    <option value="貯蓄預金">貯蓄預金</option>
                </select>
            </p>
        </div>

        <!-- セクション3: 注文内容(銘柄・金額・手数料プレビュー) -->
        <div class="form-section">
            <div class="section-title">注文内容</div>

            <!-----銘柄選択（SelectBoX）------->
            <p>
                <label class="ml-1">銘柄選択: <small class="text-danger ml-1" id="required-fundCode">※</small><span class="field-done" id="done-fundCode">✓</span></label><br>
                <select id="fundCode" th:field="*{fundCode}" class="form-control" required>
                    <option value="">選択してください</option>
                    <option th:each="fund : ${fundList}"
                            th:value="${fund.fundCode}"
                            th:text="${fund.fundName}"></option>
                </select>
            </p>

            <!-------購入金額-------->
            <p>
                <!-最低限１０００円マックス----->
                <label class="ml-1">購入金額: <small class="text-danger ml-1" id="required-purchaseAmount">※</small><span class="field-done" id="done-purchaseAmount">✓</span></label><br>
                <input type="text"
                       id="purchaseAmount"
                       th:field="*{purchaseAmount}"
                       class="form-control"
                       placeholder="1000円以上の金額を入力してください"
                       inputmode="numeric"
                       required>
            </p>

            <!-------購入手数料(見込み)-------->
            <p>
                <label class="ml-1">購入手数料(見込み):</label><br>
                <span id="feePreview">銘柄と購入金額を入力してください</span>
            </p>
        </div>

        <p style="text-align: center;">
            <input type="submit"
                   value="注文内容を確認する"
                   class="form-control-button form-confirmation-button"/>

            <input type="reset"
                   value="入力内容をクリア"
                   class="form-control-button form-clear-button"/>
        </p>
    </form>
</div>

<!-- サーバー側のマスタデータをJSに渡す(支店の絞り込み・手数料プレビュー用) -->

</body>

</html>
