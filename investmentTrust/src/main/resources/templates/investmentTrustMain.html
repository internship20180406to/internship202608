<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>投資信託注文情報入力画面</title>
    <style>
        body {
        background-color: #f0f0f0;
        margin: 0;
        padding: 0;
        display: flex;
        padding-top: 40px;
        padding-bottom: 40px;
        justify-content: center;
        align-items: center;
        min-height: 85vh;
        overflow: auto;
        }
        .content {
         background-color: #ffffff;
         width: 80%;
         padding: 20px;
         border-radius: 10px;
         box-shadow: 0 4px 8px rgba(0,0,0,0.1);
         min-height: 50vh;
         overflow: auto;
        }
        .form-control {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            box-sizing: border-box;
        }
        .text-danger {
        color: red;
        }
        .form-control-button {
        width: 80px;
        padding: 10px 20px;
        margin-top: 10px;
        border: none;
        cursor: pointer;
        border-radius: 5px;
        }
        .form-confirmation-button{
        color: white;
        background-color: #2185D0;
        }
        .form-confirmation-button:hover {
        background-color: #1678c2;
        }
        .form-clear-button{
        color: black;
        background-color: #E0E1E2;
        }
        .form-clear-button:hover {
        background-color: #CCCCCC;
        }

    </style>
</head>
<body>
<div class="content">
    <h1>投資信託注文情報入力</h1>
    <form action="#" th:action="@{/investmentTrustConfirmation}" th:object="${investmentTrustApplication}" method="post">
        <p><label class="ml-1">金融機関コード: <small class="text-danger ml-1">※</small></label><br>
            <input type="text"
                   th:field="*{bankAccountNum}"
                   class="form-control"
                   placeholder="9999"
                   maxlength="4"
                   pattern="[0-9]{4}"
                   inputmode="numeric"
                   title="4桁の半角数字で入力してください"
                   required/>
        </p>
        <p><label class="ml-1">支店名: <small class="text-danger ml-1">※</small></label><br>
            <input type="text"
                   th:field="*{bankAccountNum}"
                   class="form-control"
                   placeholder="999"
                   maxlength="3"
                   pattern="[0-9]{3}"
                   inputmode="numeric"
                   title="4桁の半角数字で入力してください"
                   required/>
        </p>
        <p><label class="ml-1">科目名: <small class="text-danger ml-1">※</small></label><br>
            <select th:field="*{bankName}" class="form-control">
                <option value="普通預金">普通預金</option>
                <option value="当座預金">当座預金</option>
                <option value="定期預金">定期預金</option>
                <option value="貯蓄預金">貯蓄預金</option>
                <option value="定期積金">定期積金</option>
                <option value="通知預金">通知預金</option>
                <option value="別段預金">別段預金</option>
                <option value="外貨預金">外貨預金</option>
                <option value="納税準備預金">納税準備預金</option>
            </select>
        </p>
        <p><label class="ml-1">口座番号: <small class="text-danger ml-1">※</small></label><br>
            <input type="text"
                   th:field="*{bankAccountNum}"
                   class="form-control"
                   placeholder="9999999"
                   maxlength="7"
                   pattern="[0-9]{7}"
                   inputmode="numeric"
                   title="4桁の半角数字で入力してください"
                   required/>
        </p>
        <p><label class="ml-1">購入者名: <small class="text-danger ml-1">※</small></label><br>

        <div class="row">
            <!-- 苗字（姓） -->
            <div class="col">
                <input type="text"
                       th:field="*{lastName}"
                       class="form-control"
                       placeholder="山田"
                       maxlength="25"
                       required/>
            </div>
            <!-- 名前（名） -->
            <div class="col">
                <input type="text"
                       th:field="*{firstName}"
                       class="form-control"
                       placeholder="太郎"
                       maxlength="25"
                       required/>
            </div>
        </div>

        </p>

        <p><label class="ml-1">銘柄選択: <small class="text-danger ml-1">※</small></label><br>
            <select th:field="*{bankName}" class="form-control">
                <option value="　">　</option>

            </select>
        </p>
        <p><label class="ml-1">購入金額:
            <br>（自分で自由に投資をしたい方）<small class="text-danger ml-1">※</small></label><br>
            <input type="text"
                   th:field="*{bankAccountNum}"
                   class="form-control"
                   placeholder="9999999"
                   maxlength="7"
                   pattern="[0-9]{7}"
                   inputmode="numeric"
                   title="4桁の半角数字で入力してください"
                   required/>
        </p>
        <p>（選択肢の中から選びたい方）
        <label class="ml-1"><small class="text-danger ml-1">※</small></label><br>
            <select th:field="*{bankName}" class="form-control">
                <option value="　">　</option>

            </select>
        </p>
        <form id="myForm" onsubmit="return checkFields()">
            <!-- 入力欄1（※requiredは外しておきます） -->
            <input type="text" id="phone1" class="form-control" placeholder="固定電話">

            <!-- 入力欄2 -->
            <input type="text" id="phone2" class="form-control" placeholder="携帯電話">

            <button type="submit">次へ進む</button>
        </form>
        <p style="text-align: center;"><input type="submit" value="確認"
                                              class="form-control-button form-confirmation-button"/>
            <input type="reset" value="クリア" class="form-control-button form-clear-button"/></p>
    </form>
</div>
</body>

</html>
