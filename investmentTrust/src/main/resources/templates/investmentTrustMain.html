<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>投資信託注文情報入力画面</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            background-color: #f0f0f0;

            margin: 0;
            padding: 40px 20px;

            min-height: 100vh;

            font-family:
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    "Hiragino Kaku Gothic ProN",
                    "Hiragino Sans",
                    Meiryo,
                    sans-serif;
        }

        .content {
            width: 80%;
            max-width: 1000px;
            min-height: 70vh;

            margin: 0 auto;

            padding: 30px 40px 40px;

            background-color: #ffffff;

            border-radius: 10px;

            box-shadow:
                    0 4px 8px rgba(0, 0, 0, 0.1);
        }


        /* =========================
           ナビゲーション
           ========================= */

        .navigation {
            display: flex;

            margin-bottom: 25px;

            border-bottom:
                    1px solid #dddddd;
        }

        .navigation-button {
            display: flex;

            justify-content: center;
            align-items: center;

            width: 160px;

            padding: 12px 20px;

            border:
                    1px solid #cccccc;

            border-bottom: none;

            border-radius:
                    8px 8px 0 0;

            background-color: #ffffff;

            color: #333333;

            text-decoration: none;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition:
                    background-color 0.2s ease,
                    color 0.2s ease;
        }

        .navigation-button:hover {
            background-color: #eeeeee;
        }

        .navigation-button.active {
            background-color: #2185D0;

            border-color: #2185D0;

            color: #ffffff;
        }

        .navigation-button.active:hover {
            background-color: #1678c2;
        }


        /* =========================
           タイトル
           ========================= */

        .page-title {
            margin: 0;

            color: #333333;

            font-size: 28px;

            text-align: left;
        }

        .page-description {
            margin:
                    8px 0 35px;

            color: #777777;

            font-size: 14px;
        }


        /* =========================
           ステップ
           ========================= */

        .step-progress {
            position: relative;

            width: 90%;

            height: 100px;

            margin:
                    0 auto 40px;
        }

        .progress-line {
            position: absolute;

            top: 18px;
            left: 0;

            width: 100%;
            height: 6px;

            background-color: #e0e0e0;

            border-radius: 10px;

            overflow: hidden;

            z-index: 1;
        }

        .progress-bar {
            width: 0%;

            height: 100%;

            background-color: #4CAF50;

            border-radius: 10px;

            transition:
                    width 0.3s ease;
        }

        .step-circle {
            position: absolute;

            top: 0;

            width: 38px;
            height: 38px;

            padding: 0;

            border:
                    3px solid #d5d5d5;

            border-radius: 50%;

            background-color: #ffffff;

            color: #777777;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            transform:
                    translateX(-50%);

            z-index: 2;

            transition:
                    background-color 0.3s ease,
                    border-color 0.3s ease,
                    color 0.3s ease,
                    transform 0.2s ease;
        }

        #stepCircle1 {
            left: 0%;
        }

        #stepCircle2 {
            left: 20%;
        }

        #stepCircle3 {
            left: 40%;
        }

        #stepCircle4 {
            left: 60%;
        }

        #stepCircle5 {
            left: 80%;
        }

        #stepCircle6 {
            left: 100%;
        }

        .step-circle.active,
        .step-circle.completed {
            background-color: #4CAF50;

            border-color: #4CAF50;

            color: #ffffff;
        }

        .step-circle:disabled {
            background-color: #ffffff;

            border-color: #d5d5d5;

            color: #999999;

            cursor: default;
        }

        .step-circle:not(:disabled):hover {
            transform:
                    translateX(-50%)
                    scale(1.08);
        }

        .step-labels {
            position: absolute;

            top: 48px;
            left: 0;

            width: 100%;
            height: 30px;

            color: #666666;

            font-size: 13px;

            text-align: center;

            pointer-events: none;
        }

        .step-labels span {
            position: absolute;

            width: 80px;

            transform:
                    translateX(-50%);

            white-space: nowrap;
        }

        .step-labels span:nth-child(1) {
            left: 0%;
        }

        .step-labels span:nth-child(2) {
            left: 20%;
        }

        .step-labels span:nth-child(3) {
            left: 40%;
        }

        .step-labels span:nth-child(4) {
            left: 60%;
        }

        .step-labels span:nth-child(5) {
            left: 80%;
        }

        .step-labels span:nth-child(6) {
            left: 100%;
        }


        /* =========================
           現在のステップ
           ========================= */

        .current-step-info {
            margin-bottom: 30px;

            text-align: center;
        }

        .current-step-number {
            margin-bottom: 5px;

            color: #4CAF50;

            font-size: 14px;

            font-weight: bold;
        }

        .current-step-title {
            margin: 0;

            color: #333333;

            font-size: 23px;
        }


        /* =========================
           エラー
           ========================= */

        .text-danger {
            color: red;
        }

        .global-error {
            margin-bottom: 20px;

            padding: 10px 15px;

            background-color: #fff0f0;

            border-left:
                    4px solid red;

            border-radius: 4px;
        }


        /* =========================
           フォーム
           ========================= */

        .form-control {
            width: 100%;

            min-height: 45px;

            margin: 5px 0;

            padding: 10px;

            border:
                    1px solid #cccccc;

            border-radius: 5px;

            font-size: 16px;
        }

        .form-control:focus {
            outline: none;

            border-color: #4CAF50;

            box-shadow:
                    0 0 0 2px
                    rgba(76, 175, 80, 0.15);
        }


        /* =========================
           ボタン
           ========================= */

        .form-control-button {
            width: 220px;

            min-height: 45px;

            margin-top: 10px;

            padding: 10px 20px;

            border:
                    1px solid black;

            border-radius: 5px;

            background-color: #FFFFFF;

            color: black;

            font-size: 15px;

            cursor: pointer;
        }

        .form-control-button:hover {
            background-color: #f5f5f5;
        }

        .step-buttons {
            display: flex;

            justify-content:
                    space-between;

            gap: 20px;

            margin-top: 25px;
        }

        #step1 .step-buttons {
            justify-content: flex-end;
        }

        .next-button,
        .form-confirmation-button {
            border-color: #2185D0;

            background-color: #2185D0;

            color: white;
        }

        .next-button:hover,
        .form-confirmation-button:hover {
            background-color: #1678c2;
        }


        /* =========================
           銘柄検索
           ========================= */

        .fund-search-container {
            position: relative;

            width: 100%;
        }

        .fund-search-results {
            display: none;

            position: absolute;

            top: 100%;
            left: 0;

            width: 100%;

            max-height: 300px;

            overflow-y: auto;

            background-color: #ffffff;

            border:
                    1px solid #cccccc;

            border-top: none;

            box-shadow:
                    0 4px 8px
                    rgba(0, 0, 0, 0.1);

            z-index: 100;
        }

        .fund-search-results > div {
            background-color: #ffffff;
        }

        .fund-search-results > div:hover {
            background-color: #f5f5f5;
        }


        /* 選択中の銘柄 */

        .selected-fund {
            display: none;

            margin-top: 10px;

            padding: 10px 15px;

            background-color: #f0f8ff;

            border:
                    1px solid #2185D0;

            border-radius: 5px;

            color: #333333;
        }


        /* =========================
           スマートフォン
           ========================= */

        @media (max-width: 600px) {

            body {
                padding: 20px 10px;
            }

            .content {
                width: 100%;

                padding:
                        20px 15px 30px;
            }

            .navigation-button {
                width: 50%;

                padding:
                        10px 5px;

                font-size: 14px;
            }

            .page-title {
                font-size: 22px;
            }

            .step-progress {
                width: 92%;

                height: 90px;
            }

            .step-circle {
                width: 32px;
                height: 32px;

                top: 2px;

                font-size: 12px;
            }

            .progress-line {
                top: 15px;

                height: 5px;
            }

            .step-labels {
                top: 42px;

                font-size: 10px;
            }

            .step-labels span {
                width: 50px;
            }

            .current-step-title {
                font-size: 20px;
            }

            .step-buttons {
                flex-direction: column;
            }

            .form-control-button {
                width: 100%;
            }

        }

    </style>

</head>


<body>

<div class="content">


    <!-- =========================
         ナビゲーション
         ========================= -->

    <div class="navigation">

        <a href="/investmentTrust"
           class="navigation-button active">

            注文

        </a>

        <a href="/investmentTrustHistory"
           class="navigation-button">

            注文履歴

        </a>

    </div>


    <!-- =========================
         タイトル
         ========================= -->

    <h1 class="page-title">

        投資信託注文情報入力

    </h1>

    <p class="page-description">

        必要な情報を順番に入力してください。

    </p>


    <!-- =========================
         ステップ表示
         ========================= -->

    <div class="step-progress">

        <div class="progress-line">

            <div id="progressBar"
                 class="progress-bar">
            </div>

        </div>


        <button type="button"
                id="stepCircle1"
                class="step-circle active"
                onclick="goToStep(1)">

            1

        </button>


        <button type="button"
                id="stepCircle2"
                class="step-circle"
                onclick="goToStep(2)"
                disabled>

            2

        </button>


        <button type="button"
                id="stepCircle3"
                class="step-circle"
                onclick="goToStep(3)"
                disabled>

            3

        </button>


        <button type="button"
                id="stepCircle4"
                class="step-circle"
                onclick="goToStep(4)"
                disabled>

            4

        </button>


        <button type="button"
                id="stepCircle5"
                class="step-circle"
                onclick="goToStep(5)"
                disabled>

            5

        </button>


        <button type="button"
                id="stepCircle6"
                class="step-circle"
                onclick="goToStep(6)"
                disabled>

            6

        </button>


        <div class="step-labels">

            <span>金融機関</span>

            <span>支店</span>

            <span>科目</span>

            <span>口座番号</span>

            <span>購入者</span>

            <span>注文内容</span>

        </div>

    </div>


    <!-- =========================
         現在のステップ
         ========================= -->

    <div class="current-step-info">

        <div id="currentStepNumber"
             class="current-step-number">

            STEP 1 / 6

        </div>

        <h2 id="currentStepTitle"
            class="current-step-title">

            金融機関

        </h2>

    </div>


    <!-- =========================
         エラー
         ========================= -->

    <div th:if="${error}"
         class="text-danger global-error">

        <p th:text="${error}">
        </p>

    </div>


    <!-- =========================
         入力フォーム
         ========================= -->

    <form th:action="@{/investmentTrustConfirmation}"
          th:object="${investmentTrustApplication}"
          method="post">


        <!-- =========================
     STEP1 金融機関
     ========================= -->

        <div id="step1">

            <p>

                <label>

                    金融機関名:
                    <small class="text-danger">※</small>

                </label>

                <br>


                <select th:field="*{bankName}"
                        id="bankName"
                        class="form-control"
                        onchange="updateFeeRate()">

                    <option value="">

                        選択してください

                    </option>

                    <option th:each="option : ${bankNameOptions}"
                            th:value="${option}"
                            th:text="${option}">

                    </option>

                </select>

            </p>


            <div class="step-buttons">

                <input type="button"
                       value="次へ"
                       class="form-control-button next-button"
                       onclick="nextStep(1)">

            </div>

        </div>


        <!-- =========================
             STEP2 支店
             ========================= -->

        <div id="step2"
             style="display: none;">

            <p>

                <label>

                    支店名:
                    <small class="text-danger">※</small>

                </label>

                <br>


                <select th:field="*{branchName}"
                        class="form-control">

                    <option value="">

                        選択してください

                    </option>

                    <option th:each="option : ${branchNameOptions}"
                            th:value="${option}"
                            th:text="${option}">

                    </option>

                </select>

            </p>


            <div class="step-buttons">

                <input type="button"
                       value="戻る"
                       class="form-control-button"
                       onclick="prevStep(2)">


                <input type="button"
                       value="次へ"
                       class="form-control-button next-button"
                       onclick="nextStep(2)">

            </div>

        </div>


        <!-- =========================
             STEP3 科目
             ========================= -->

        <div id="step3"
             style="display: none;">

            <p>

                <label>

                    科目名:
                    <small class="text-danger">※</small>

                </label>

                <br>


                <select th:field="*{bankAccountTypeName}"
                        class="form-control">

                    <option value="">

                        選択してください

                    </option>

                    <option th:each="option : ${bankAccountTypeOptions}"
                            th:value="${option}"
                            th:text="${option}">

                    </option>

                </select>

            </p>


            <div class="step-buttons">

                <input type="button"
                       value="戻る"
                       class="form-control-button"
                       onclick="prevStep(3)">


                <input type="button"
                       value="次へ"
                       class="form-control-button next-button"
                       onclick="nextStep(3)">

            </div>

        </div>


        <!-- =========================
             STEP4 口座番号
             ========================= -->

        <div id="step4"
             style="display: none;">

            <p>

                <label>

                    口座番号:
                    <small class="text-danger">※</small>

                </label>

                <br>


                <input type="text"
                       id="bankAccountNum"
                       th:field="*{bankAccountNum}"
                       class="form-control"
                       placeholder="1234567"
                       inputmode="numeric"
                       maxlength="7">


                <span id="bankAccountNumError"
                      class="text-danger"
                      style="display: none;">

                </span>

            </p>


            <div class="step-buttons">

                <input type="button"
                       value="戻る"
                       class="form-control-button"
                       onclick="prevStep(4)">


                <input type="button"
                       value="次へ"
                       class="form-control-button next-button"
                       onclick="validateBankAccountNum()">

            </div>

        </div>


        <!-- =========================
             STEP5 購入者名
             ========================= -->

        <div id="step5"
             style="display: none;">

            <p>

                <label>

                    購入者名:
                    <small class="text-danger">※</small>

                </label>

                <br>


                <input type="text"
                       id="name"
                       th:field="*{name}"
                       class="form-control"
                       placeholder="ひらがなで入力してください">


                <span id="nameError"
                      class="text-danger"
                      style="display: none;">

                </span>

            </p>


            <div class="step-buttons">

                <input type="button"
                       value="戻る"
                       class="form-control-button"
                       onclick="prevStep(5)">


                <input type="button"
                       value="次へ"
                       class="form-control-button next-button"
                       onclick="validateName()">

            </div>

        </div>


        <!-- =========================
             STEP6 注文内容
             ========================= -->

        <div id="step6"
             style="display: none;">


            <!-- 銘柄検索 -->

            <p>

                <label>

                    銘柄名:
                    <small class="text-danger">※</small>

                </label>

                <br>


            <div class="fund-search-container">

                <!--
                    ユーザーが入力する検索欄
                -->

                <input type="text"
                       id="fundSearch"
                       class="form-control"
                       placeholder="銘柄名を入力してください"
                       autocomplete="off">


                <!--
                    実際にInvestmentTrustFormへ送る銘柄名
                -->

                <input type="hidden"
                       id="fundName"
                       th:field="*{fundName}">


                <!--
                    選択された銘柄名を表示
                -->

                <div id="selectedFundName"
                     class="selected-fund">

                </div>


                <!--
                    DB検索結果を表示する場所
                -->

                <div id="fundSearchResults"
                     class="fund-search-results">

                </div>

            </div>

            </p>


            <!-- 1口の価格 -->

            <p>

                <label>

                    1口の価格:

                </label>

                <br>


                <input type="text"
                       id="unitPrice"
                       class="form-control"
                       readonly>

            </p>


            <!-- 購入金額 -->

            <p>

                <label>

                    購入金額:
                    <small class="text-danger">※</small>

                </label>

                <br>


                <input type="number"
                       id="money"
                       class="form-control"
                       placeholder="購入金額を入力してください"
                       min="0"
                       oninput="calculateQuantity()">


                <!-- 内手数料 -->

            <div id="feeDisplay"
                 style="
            margin-top: 8px;
            color: #555555;
            font-size: 14px;
         ">

                内手数料：0円

            </div>


            <!-- 手数料込みの購入金額 -->

            <div id="totalMoneyDisplay"
                 style="
            margin-top: 5px;
            color: #333333;
            font-weight: bold;
            font-size: 16px;
         ">

                手数料込み：0円

            </div>


            <!-- Spring Bootへ送信する実際の金額 -->

            <input type="hidden"
                   id="totalMoney"
                   th:field="*{money}">


            <span id="moneyError"
                  class="text-danger"
                  style="display: none;">

    </span>

            </p>


            <!-- 口数 -->

            <p>

                <label>

                    口数:

                </label>

                <br>


                <input type="number"
                       id="quantity"
                       class="form-control"
                       readonly>


                <span id="quantityError"
                      class="text-danger"
                      style="display: none;">

                </span>

            </p>


            <!-- ボタン -->

            <div class="step-buttons">

                <input type="button"
                       value="戻る"
                       class="form-control-button"
                       onclick="prevStep(6)">


                <input type="button"
                       value="確認"
                       class="form-control-button form-confirmation-button"
                       onclick="validateInvestment()">

            </div>

        </div>


    </form>

</div>


<!-- =========================
     JavaScript設定
     ========================= -->

<script th:inline="javascript">

    const initialStep =
        /*[[${targetStep}]]*/ 1;

    const editMode =
        /*[[${editMode}]]*/ false;

</script>


<script src="/js/test.js"></script>


</body>

</html>
