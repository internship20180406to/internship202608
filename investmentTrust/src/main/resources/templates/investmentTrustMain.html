<!doctype html>
<html>
<head>
    <meta charset="UTF-8"/>
    <title>投資信託注文情報入力画面</title>
    <style>
        body {
        background-color: #f0f0f0;
        margin: 0;
        padding: 0;
        display: flex;
        padding-top: 40px;
        padding-bottom: 40px;
        justify-content: center;
        align-items: center;
        min-height: 85vh;
        overflow: auto;
        }
        .content {
         background-color: #ffffff;
         padding: 20px;
         border-radius: 10px;
         box-shadow: 0 4px 8px rgba(0,0,0,0.1);
         min-height: 50vh;
         overflow: auto;
        }
        .form-control {
            padding: 8px;
            margin: 5px 0;
            box-sizing: border-box;
        }
        .text-danger {
        color: red;
        }
        .form-control-button {
        padding: 10px 20px;
        margin-top: 10px;
        border: none;
        cursor: pointer;
        border-radius: 5px;
        }
        .form-confirmation-button{
        color: white;
        background-color: #2185D0;
        }
        .form-confirmation-button:hover {
        background-color: #1678c2;
        }
        .form-clear-button{
        color: black;
        background-color: #E0E1E2;
        }
        .form-clear-button:hover {
        background-color: #CCCCCC;
        }

    </style>
</head>
<body>
<div class="content">
    <h1>投資信託注文情報入力</h1>
    <form action="#" th:action="@{/investmentTrustConfirmation}"
                     th:object="${investmentTrustApplication}"
                        method="post"
                        id="investmentForm"
                        onsubmit="return checkInvestment()">
            <p><label class="ml-1">金融機関コード:<small class="text-danger ml-1">※</small></label><br>
                <input type="text"
                   th:field="*{bankCode}"
                   class="form-control"
                   placeholder="9999"
                   maxlength="4"
                   pattern="[0-9]{4}"
                   inputmode="numeric"
                   title="4桁の半角数字で入力してください"
                   required/>
            </p>
            <p><label class="ml-1">支店コード: <small class="text-danger ml-1">※</small></label><br>
                <input type="text"
                   th:field="*{branchName}"
                   class="form-control"
                   placeholder="999"
                   maxlength="3"
                   pattern="[0-9]{3}"
                   inputmode="numeric"
                   title="3桁の半角数字で入力してください"
                   required/>
            </p>

            <p><label class="ml-1">科目名: <small class="text-danger ml-1">※</small></label><br>
                <select th:field="*{accountType}" class="form-control" required>
                    <option value="">選択してください</option>
                    <option value="普通預金">普通預金</option>
                    <option value="当座預金">当座預金</option>
                    <option value="定期預金">定期預金</option>
                    <option value="貯蓄預金">貯蓄預金</option>
                    <option value="定期積金">定期積金</option>
                    <option value="通知預金">通知預金</option>
                    <option value="別段預金">別段預金</option>
                    <option value="外貨預金">外貨預金</option>
                </select>
            </p>

            <p><label class="ml-1">口座番号: <small class="text-danger ml-1">※</small></label><br>
                <input type="text"
                   th:field="*{bankAccountNum}"
                   class="form-control"
                   placeholder="9999999"
                   maxlength="7"
                   pattern="[0-9]{7}"
                   inputmode="numeric"
                   title="7桁の半角数字で入力してください"
                   required/>
            </p>

            <p><label class="ml-1">購入者名: <small class="text-danger ml-1">※</small></label><br>
            <div class="row">
                <div class="col">
                    <input type="text"
                       th:field="*{lastName}"
                       class="form-control"
                       placeholder="山田（姓）"
                       maxlength="25"
                       required/>
                </div>
                    <div class="col">
                        <input type="text"
                       th:field="*{firstName}"
                       class="form-control"
                       placeholder="太郎（名）"
                       maxlength="25"
                       required/>
                    </div>
            </div>

            <p><label class="ml-1">銘柄選択: <small class="text-danger ml-1">※</small></label><br>
                <select th:field="*{fundCode}" class="form-control" required>
                    <option value="">選択してください</option>
                    <option value="森林銀行おすすめファンド">森林銀行おすすめファンド</option>
                    <option value="フォレスト・バンク・オープン">フォレスト・バンク・オープン</option>
                    <option value="サステナブル・グリーン">サステナブル・グリーン</option>
                    <option value="海底米国株式">海底米国株式オープン</option>
                    <option value="未来銀行次世代テクノロジー・オープン">未来銀行次世代テクノロジー・オープン</option>
                    <option value="銀河銀行宇宙開発イノベーション株ファンド">銀河銀行次世代テクノロジー・オープン</option>
                    <option value="オーロラ・バンク・オープン">オーロラ・バンク</option>
                    <option value="北欧イノベーション株オープン">北欧イノベーション株オープン</option>
                    <option value="シャドウ・バンク">シャドウ・バンク</option>
                    <option value="オルタナティブ・アルゴリズム">オルタナティブ・アルゴリズム</option>
                </select>
            </p>

            <p>
                <label class="ml-1">購入金額:<br>
                    （自分で自由に投資をしたい方はこちら）
                </label><br>

                <input type="text"
                       th:field="*{amount}"
                       id="freeInput"
                       class="form-control"
                       placeholder="9999999"
                       maxlength="7"
                       pattern="[0-9]{1,7}"
                       inputmode="numeric"
                       title="最大7桁の半角数字で入力してください"/>
            </p>

            <p>（選択肢の中から選びたい方はこちら）<br>
                    <select th:field="*{purchaseAmount}" id="selectInput" class="form-control">
                        <option value="">選択してください</option>
                        <option value="10000">10,000円</option>
                        <option value="30000">30,000円</option>
                        <option value="50000">50,000円</option>
                    </select>

                    <script>
                        function checkInvestment() {
                        const freeInputValue = document.getElementById('freeInput').value.trim();
                        const selectInput = document.getElementById('selectInput');
                        const selectValue = selectInput.value;

                        if (freeInputValue === "" && selectValue === "") {
                            alert("「購入金額の入力」または「選択肢からの選択」の、どちらか片方は必ず行ってください。");
                            return false;
                        }

                        if (freeInputValue !== "" && selectValue !== "") {
                            alert("購入金額は「自由入力」か「選択肢」のどちらか一方のみにしてください。");
                            return false;
                        }

                        return true;
                    }
                    </script>
            </p>
            <p style="text-align: center;">
                    <input type="submit" value="確認" class="form-control-button form-confirmation-button"/>
                    <input type="reset" value="クリア" class="form-control-button form-clear-button"/>
            </p>
    </form>
</div>
</body>

</html>
