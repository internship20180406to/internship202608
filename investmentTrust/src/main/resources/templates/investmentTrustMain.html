<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>投資信託注文情報入力画面</title>
    <style>
        body {
        background-color: #f0f0f0;
        margin: 0;
        padding: 0;
        display: flex;
        padding-top: 40px;
        padding-bottom: 40px;
        justify-content: center;
        align-items: center;
        min-height: 85vh;
        overflow: auto;
        }
        .content {
         background-color: #ffffff;
         width: 80%;
         padding: 20px;
         border-radius: 10px;
         box-shadow: 0 4px 8px rgba(0,0,0,0.1);
         min-height: 50vh;
         overflow: auto;
        }
        .form-control {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            box-sizing: border-box;
        }
        .text-danger {
        color: red;
        }
        .form_error {
            color: red;
        }
        .form-control-button {
        width: 80px;
        padding: 10px 20px;
        margin-top: 10px;
        border: none;
        cursor: pointer;
        border-radius: 5px;
        }
        .form-confirmation-button{
        color: white;
        background-color: #2185D0;
        }
        .form-confirmation-button:hover {
        background-color: #1678c2;
        }
        .form-clear-button{
        color: black;
        background-color: #E0E1E2;
        }
        .form-clear-button:hover {
        background-color: #CCCCCC;
        }
        .hidden{
            display: none;
        }

    </style>
</head>
<body>
<div class="content">
    <h1>投資信託注文情報入力</h1>
    <form action="#" th:action="@{/investmentTrustConfirmation}" th:object="${investmentTrustApplication}" method="post">
        <p><label class="ml-1">金融機関名: <small class="text-danger ml-1">※</small></label><br>
            <select th:field="*{bankName}" class="form-control">
                <option th:each="sanin : ${nameOptions}"
                        th:value="${sanin}"
                        th:text="${sanin}">選択肢
                </option>
                <option th:each="kobuta : ${nameOptions1}"
                        th:value="${kobuta}"
                        th:text="${kobuta}">選択肢
                </option>
            </select></p>

        <p><label class="ml-1">口座番号: <small class="text-danger ml-1">※</small></label><br>
            <input type="number" id="number" th:field="*{bankAccountNum}" class="form-control" placeholder="1234567"/>
            <span class="form_error" id="accountnum_error_null" hidden>口座番号を入力してください。</span>
            <span class="form_error" id="accountnum_error_digit" hidden>正しい口座番号を入力してください。</span></p>

        <p><label class="ml-1">支店名: <small class="text-danger ml-1">※</small></label><br>
            <select th:field="*{BranchName}" class="form-control">
                <option th:each="wajiro : ${branchOptions}"
                        th:value="${wajiro}"
                        th:text="${wajiro}">選択肢
                </option>
                <option th:each="usa : ${branchOptions1}"
                        th:value="${usa}"
                        th:text="${usa}">選択肢
                </option>
            </select></p>

        <p><label class="ml-1">科目名: <small class="text-danger ml-1">※</small></label><br>
            <select th:field="*{bankAccountType}" class="form-control">
                <option th:each="normal : ${typeOptions}"
                        th:value="${normal}"
                        th:text="${normal}">選択肢
                </option>
                <option th:each="check : ${typeOptions1}"
                        th:value="${check}"
                        th:text="${check}">選択肢
                </option>
            </select></p>

        <p><label class="ml-1">購入者名: <small class="text-danger ml-1">※</small></label><br>
            <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="フルネーム"/>
            <span class="form_error" id="name_error" hidden>お名前を入力してください。</span></p>

        <p><label class="ml-1">銘柄選択: <small class="text-danger ml-1">※</small></label><br>
            <select th:field="*{fundName}" class="form-control">
                <option th:each="capital1 : ${fundOptions}"
                        th:value="${capital1}"
                        th:text="${capital1}">選択肢
                </option>
                <option th:each="capital2 : ${fundOptions1}"
                        th:value="${capital2}"
                        th:text="${capital2}">選択肢
                </option>
            </select></p>

        <p><label class="ml-1">金額: <small class="text-danger ml-1">※</small></label><br>
            <input type="number" id="money" th:field="*{money}" class="form-control" placeholder="1234567"/>
            <span class="form_error" id="money_error" hidden>金額を入力してください。</span></p>

        <p style="text-align: center;"><input type="submit" id="confirm" value="確認"
                                              class="form-control-button form-confirmation-button"/>
            <input type="reset" value="クリア" class="form-control-button form-clear-button"/></p>
    </form>
    <script th:inline="javascript" src="/js/inputConfirmation.js"></script>

</div>
</body>
</html>
