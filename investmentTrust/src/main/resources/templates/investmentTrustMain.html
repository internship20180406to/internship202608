<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>投資信託注文情報入力画面</title>
    <style>
        body {
        background-color: #f0f0f0;
        margin: 0;
        padding: 0;
        display: flex;
        padding-top: 40px;
        padding-bottom: 40px;
        justify-content: center;
        align-items: center;
        min-height: 85vh;
        overflow: auto;
        }
        .content {
         background-color: #ffffff;
         width: 80%;
         padding: 20px;
         border-radius: 10px;
         box-shadow: 0 4px 8px rgba(0,0,0,0.1);
         min-height: 50vh;
         overflow: auto;
        }
        .form-control {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            box-sizing: border-box;
        }
        .text-danger {
        color: red;
        }
        .form-control-button {
            width: 300px;
            padding: 10px 20px;
            margin-top: 10px;
            cursor: pointer;
            border-radius: 5px;
            border: 1px solid black;
            background-color: #FFFFFF;
            color: black;
        }
        .step-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        #step1 .step-buttons {
            justify-content: flex-end;
        }
        .form-confirmation-button{
        color: black;
        background-color: #2185D0;
        }
        .form-confirmation-button:hover {
        background-color: #1678c2;
        }
        .form-clear-button{
        color: black;
        background-color: #E0E1E2;
        }
        .form-clear-button:hover {
            background-color: #CCCCCC;
        }
        .next-button {
            background-color: #2185D0;
            color: black;
            border: 1px solid black;
        }
        .progress-container {
            width: 100%;
            height: 15px;
            background-color: #E0E0E0;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background-color: #4CAF50;
            width: 0%;
            transition: width 0.3s;
        }

    </style>
</head>
<body>
<div class="content">
    <h1>投資信託注文情報入力</h1>
    <div class="progress-container">
        <div id="progressBar" class="progress-bar"></div>
    </div>
    <div th:if="${error}" class="text-danger">
        <p th:text="${error}"></p>
    </div>
    <form action="#" th:action="@{/investmentTrustConfirmation}" th:object="${investmentTrustApplication}" method="post">
        <div id="step1">
            <p>
                <label class="ml-1">金融機関名: <small class="text-danger ml-1">※</small></label><br>
            <select th:field="*{bankName}" class="form-control">
                <option th:each="option : ${bankNameOptions}"
                        th:value="${option}"
                        th:text="${option}">選択肢
                </option>
            </select>
            </p>
            <div class="step-buttons">
            <input type="button"
                   value="次へ"
                   class="form-control-button next-button"
                   onclick="nextStep(1)">
        </div>
        </div>

        <div id="step2" style="display: none;">
            <p>
                <label class="ml-1">支店名: <small class="text-danger ml-1">※</small></label><br>
            <select th:field="*{branchName}" class="form-control">
                <option th:each="option : ${branchNameOptions}"
                        th:value="${option}"
                        th:text="${option}">選択肢
                </option>
            </select>
            </p>
            <div class="step-buttons">
                <input type="button"
                       value="戻る"
                       class="form-control-button"
                       onclick="prevStep(2)">

                <input type="button"
                       value="次へ"
                       class="form-control-button next-button"
                       onclick="nextStep(2)">
        </div>
        </div>

        <div id="step3" style="display: none;">
            <p>
                <label class="ml-1">科目名: <small class="text-danger ml-1">※</small></label><br>
            <select th:field="*{bankAccountTypeName}" class="form-control">
                <option th:each="option : ${bankAccountTypeOptions}"
                        th:value="${option}"
                        th:text="${option}">選択肢
                </option>
            </select>
            </p>
            <div class="step-buttons">
                <input type="button"
                       value="戻る"
                       class="form-control-button"
                       onclick="prevStep(3)">

                <input type="button"
                       value="次へ"
                       class="form-control-button next-button"
                       onclick="nextStep(3)">
        </div>
        </div>

        <div id="step4" style="display: none;">
            <p>
                <label class="ml-1">口座番号: <small class="text-danger ml-1">※</small></label><br>
            <input type="text"
                   id = "bankAccountNum"
                   th:field="*{bankAccountNum}"
                   class="form-control"
                   placeholder="1234567"
                   inputmode="numeric"
                   maxlength="7">

                <span id="bankAccountNumError"
                      class="text-danger"
                      style="display: none;">
                </span>
            </p>
            <div class="step-buttons">
            <input type="button"
                   value="戻る"
                   class="form-control-button"
                   onclick="prevStep(4)">

            <input type="button"
                   value="次へ"
                   class="form-control-button next-button"
                   onclick="validateBankAccountNum()">
        </div>
        </div>

        <div id="step5" style="display: none;">
            <p>
                <label class="ml-1">購入者名: <small class="text-danger ml-1">※</small></label><br>
            <input type="text"
                   id = "name"
                   th:field="*{name}"
                   class="form-control"
                   placeholder="購入者名を入力してください"/>

                <span id="nameError"
                      class="text-danger"
                      style="display: none;">
                </span>
            </p>
            <div class="step-buttons">
            <input type="button"
                   value="戻る"
                   class="form-control-button"
                   onclick="prevStep(5)">

            <input type="button"
                   value="次へ"
                   class="form-control-button next-button"
                   onclick="validateName()">
        </div>
        </div>

        <div id="step6" style="display: none;">

            <p>
                <label class="ml-1">
                    銘柄選択:
                    <small class="text-danger ml-1">※</small>
                </label>
                <br>

                <select id="fundName"
                        th:field="*{fundName}"
                        class="form-control"
                        onchange="updatePrice()">

                    <option value="">選択してください</option>

                    <option value="A株式会社">A株式会社</option>
                    <option value="B株式会社">B株式会社</option>
                    <option value="C株式会社">C株式会社</option>
                    <option value="D株式会社">D株式会社</option>

                </select>
            </p>


            <p>
                <label class="ml-1">
                    1口の価格:
                </label>
                <br>

                <input type="text"
                       id="unitPrice"
                       class="form-control"
                       readonly>
            </p>


            <p>
                <label class="ml-1">
                    口数:
                    <small class="text-danger ml-1">※</small>
                </label>
                <br>

                <input type="number"
                       id="quantity"
                       class="form-control"
                       placeholder="口数を入力してください"
                       min="0"
                       oninput="calculateMoney()">

                <span id="quantityError"
                      class="text-danger"
                      style="display: none;">
        </span>
            </p>


            <p>
                <label class="ml-1">
                    購入金額:
                    <small class="text-danger ml-1">※</small>
                </label>
                <br>

                <input type="number"
                       id="money"
                       th:field="*{money}"
                       class="form-control"
                       placeholder="購入金額を入力してください"
                       min="0"
                       oninput="calculateQuantity()">

                <span id="moneyError"
                      class="text-danger"
                      style="display: none;">
        </span>
            </p>


            <div class="step-buttons">

                <input type="button"
                       value="戻る"
                       class="form-control-button"
                       onclick="prevStep(6)">

                <input type="button"
                       value="確認"
                       class="form-control-button form-confirmation-button"
                       onclick="validateInvestment()">

            </div>

        </div>
    </form>
</div>
<script src="/js/test.js"></script>
</body>

</html>
