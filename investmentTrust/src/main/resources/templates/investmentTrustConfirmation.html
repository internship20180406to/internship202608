<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>投資信託注文確認画面</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            background-color: #f0f0f0;
            margin: 0;
            padding: 40px 20px;

            font-family:
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    "Hiragino Kaku Gothic ProN",
                    "Hiragino Sans",
                    Meiryo,
                    sans-serif;
        }

        .content {
            width: 80%;
            max-width: 1200px;

            margin: 0 auto;
            padding: 30px;

            background-color: #ffffff;
            border-radius: 10px;

            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 50px;

            color: #333333;
            font-size: 32px;
        }

        .confirmation-list {
            margin-bottom: 45px;

            border: 1px solid #dddddd;
            border-radius: 10px;

            overflow: hidden;
        }

        .confirmation-item {
            display: flex;

            min-height: 84px;

            border-bottom: 1px solid #eeeeee;
        }

        .confirmation-item:last-child {
            border-bottom: none;
        }

        .confirmation-label {
            width: 30%;

            padding: 25px 20px;

            background-color: #f7f7f7;
            color: #555555;

            font-size: 20px;
            font-weight: bold;
        }

        .confirmation-value {
            width: 55%;

            padding: 25px 20px;

            color: #222222;
            font-size: 20px;
        }

        .confirmation-edit {
            width: 15%;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #ffffff;
        }

        .edit-button {
            padding: 8px 18px;

            border: 1px solid #2185D0;
            border-radius: 5px;

            background-color: #ffffff;
            color: #2185D0;

            font-size: 15px;
            cursor: pointer;
        }

        .edit-button:hover {
            background-color: #2185D0;
            color: #ffffff;
        }

        .money-value {
            color: #2185D0;
            font-weight: bold;
        }

        .account-number-display {
            color: #2185D0;
            font-weight: bold;
            text-decoration: underline;

            cursor: pointer;
        }

        .account-number-display:hover {
            color: #1678c2;
        }

        .button-area {
            display: flex;
            justify-content: center;

            gap: 22px;
            margin-top: 10px;
        }

        .button {
            width: 225px;

            padding: 16px 20px;

            border-radius: 7px;

            font-size: 20px;
            cursor: pointer;
        }

        .submit-button {
            border: 1px solid #2185D0;

            background-color: #2185D0;
            color: #ffffff;
        }

        .submit-button:hover {
            background-color: #1678c2;
        }

        .cancel-button {
            border: 1px solid #999999;

            background-color: #ffffff;
            color: #333333;
        }

        .cancel-button:hover {
            background-color: #eeeeee;
        }

        @media (max-width: 600px) {

            body {
                padding: 20px 10px;
            }

            .content {
                width: 100%;
                padding: 20px;
            }

            h1 {
                margin-bottom: 30px;
                font-size: 25px;
            }

            .confirmation-item {
                display: flex;
                align-items: center;

                gap: 15px;

                padding: 15px;
                margin-bottom: 10px;

                border-bottom: 1px solid #eeeeee;
            }

            .confirmation-label {
                width: 120px;
                padding: 10px;

                font-size: 17px;
            }

            .confirmation-value {
                flex: 1;
                width: auto;

                padding: 10px;

                font-size: 17px;
            }

            .confirmation-edit {
                width: auto;
            }

            .edit-button {
                padding: 7px 18px;
            }

            .button-area {
                flex-direction: column;
            }

            .button {
                width: 100%;
            }
        }

    </style>

</head>

<body>

<div class="content">

    <h1>
        投資信託注文確認画面
    </h1>

    <form th:action="@{/investmentTrustCompletion}"
          th:object="${investmentTrustApplication}"
          method="post">

        <div class="confirmation-list">

            <!-- 金融機関 -->

            <div class="confirmation-item">

                <div class="confirmation-label">
                    金融機関名
                </div>

                <div class="confirmation-value"
                     th:text="*{bankName}">
                </div>

                <div class="confirmation-edit">

                    <button type="submit"
                            class="edit-button"
                            formaction="/investmentTrustEdit"
                            name="targetStep"
                            value="1">
                        修正
                    </button>

                </div>

            </div>

            <!-- 支店 -->

            <div class="confirmation-item">

                <div class="confirmation-label">
                    支店名
                </div>

                <div class="confirmation-value"
                     th:text="*{branchName}">
                </div>

                <div class="confirmation-edit">

                    <button type="submit"
                            class="edit-button"
                            formaction="/investmentTrustEdit"
                            name="targetStep"
                            value="2">
                        修正
                    </button>

                </div>

            </div>

            <!-- 科目 -->

            <div class="confirmation-item">

                <div class="confirmation-label">
                    科目名
                </div>

                <div class="confirmation-value"
                     th:text="*{bankAccountTypeName}">
                </div>

                <div class="confirmation-edit">

                    <button type="submit"
                            class="edit-button"
                            formaction="/investmentTrustEdit"
                            name="targetStep"
                            value="3">
                        修正
                    </button>

                </div>

            </div>

            <!-- 口座番号 -->

            <div class="confirmation-item">

                <div class="confirmation-label">
                    口座番号
                </div>

                <div class="confirmation-value">

                    <span id="bankAccountDisplay"
                          class="account-number-display"
                          th:attr="data-account-number=*{bankAccountNum}"
                          onclick="toggleBankAccount()">
                        ********
                    </span>

                </div>

                <div class="confirmation-edit">

                    <button type="submit"
                            class="edit-button"
                            formaction="/investmentTrustEdit"
                            name="targetStep"
                            value="4">
                        修正
                    </button>

                </div>

            </div>

            <!-- 購入者名 -->

            <div class="confirmation-item">

                <div class="confirmation-label">
                    購入者名
                </div>

                <div class="confirmation-value"
                     th:text="*{name}">
                </div>

                <div class="confirmation-edit">

                    <button type="submit"
                            class="edit-button"
                            formaction="/investmentTrustEdit"
                            name="targetStep"
                            value="5">
                        修正
                    </button>

                </div>

            </div>

            <!-- 銘柄 -->

            <div class="confirmation-item">

                <div class="confirmation-label">
                    銘柄選択
                </div>

                <div class="confirmation-value"
                     th:text="*{fundName}">
                </div>

                <div class="confirmation-edit">

                    <button type="submit"
                            class="edit-button"
                            formaction="/investmentTrustEdit"
                            name="targetStep"
                            value="6">
                        修正
                    </button>

                </div>

            </div>

            <!-- 購入金額 -->

            <div class="confirmation-item">

                <div class="confirmation-label">
                    購入金額
                </div>

                <div class="confirmation-value money-value">

                    <span th:text="*{money}"></span>
                    円

                </div>

                <div class="confirmation-edit">

                    <button type="submit"
                            class="edit-button"
                            formaction="/investmentTrustEdit"
                            name="targetStep"
                            value="6">
                        修正
                    </button>

                </div>

            </div>

        </div>

        <!-- 修正時にフォームの値を保持 -->

        <input type="hidden"
               name="bankName"
               th:value="*{bankName}">

        <input type="hidden"
               name="branchName"
               th:value="*{branchName}">

        <input type="hidden"
               name="bankAccountTypeName"
               th:value="*{bankAccountTypeName}">

        <input type="hidden"
               name="bankAccountNum"
               th:value="*{bankAccountNum}">

        <input type="hidden"
               name="name"
               th:value="*{name}">

        <input type="hidden"
               name="fundName"
               th:value="*{fundName}">

        <input type="hidden"
               name="money"
               th:value="*{money}">

        <div class="button-area">

            <button type="submit"
                    class="button submit-button"
                    onclick="return confirm('この内容で申し込みますか？');">
                申込
            </button>

            <button type="button"
                    class="button cancel-button"
                    onclick="window.location='/investmentTrust';">
                キャンセル
            </button>

        </div>

    </form>

</div>

<script>

    function toggleBankAccount() {

        const accountNumber =
            document.getElementById("bankAccountDisplay");

        const actualNumber =
            accountNumber.getAttribute("data-account-number");

        if (accountNumber.textContent.trim() === "********") {
            accountNumber.textContent = actualNumber;
        } else {
            accountNumber.textContent = "********";
        }
    }

</script>

</body>

</html>
