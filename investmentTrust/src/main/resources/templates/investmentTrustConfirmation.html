<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>投資信託注文確認画面</title>
    <link rel="stylesheet" th:href="@{/css/bank-theme.css}"/>

    <style>
        /* メイン */
        form {
            width: 90%;
            max-width: 850px;

            margin: 35px auto 50px;

            background-color: var(--color-surface);

            padding: 35px;

            border-radius: var(--radius-card);

            box-shadow:
                    0 2px 8px rgba(30, 58, 95, 0.08);

            border: 1px solid var(--color-border);
        }

        /* タイトル */
        h1 {
            width: 90%;
            max-width: 850px;

            margin: 35px auto 30px;
        }

        /* 確認項目 */
        form > p {
            margin: 0;

            padding: 16px 5px;

            border-bottom: 1px solid var(--color-border);

            font-size: 14px;
        }

        /* 入力された値 */
        form > p span {
            font-size: 16px;
            font-weight: normal;

            color: var(--color-text);
        }

        /* 購入金額だけ目立たせる */
        form > p:last-of-type span {
            color: var(--color-primary);
            font-size: 20px;
            font-weight: bold;
        }

        /* ボタン部分(次の画面へ進む「申し込む」だけ右、その他は左) */
        .confirmation-buttons {
            display: flex;
            align-items: center;

            border-bottom: none;

            margin-top: 30px;
        }

        .confirmation-buttons .form-confirmation-button {
            margin-left: auto;
        }

        /* 購入金額の内訳(注文金額＝投資される金額＋手数料) */
        .fee-breakdown {
            font-size: 15px;
        }

        .fee-breakdown span {
            font-weight: bold;
            color: var(--color-primary);
        }

        .badge {
            margin-left: 8px;
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/appHeader :: header(pageStatus='ご注文内容の確認')}"></div>
<!-- 投資信託 確認画面: 名称解決済みの入力内容・確定手数料・約定日見込みを表示して最終確認する画面 -->

<!-- ステップ3/4: 確認中(入力2画面は完了済み) -->
<div class="chevron-row">
    <div class="chevron done">お客様情報・口座情報 ✓</div>
    <div class="chevron done">注文内容 ✓</div>
    <div class="chevron active">確認</div>
    <div class="chevron">完了</div>
</div>

<form action="#" th:action="@{/investmentTrustCompletion}" th:object="${investmentTrustApplication}" method="post">
    <p>金融機関名: <span th:text="${institutionName}"></span></p>
    <p>口座番号: <span th:text="*{bankAccountNum}"></span></p>
    <p>支店名： <span th:text="${branchName}"></span></p>
    <p>科目名： <span id="bankSubject" th:text="*{bankSubject}"></span></p>
    <p>氏名： <span th:text="*{lastName} + ' ' + *{firstName}"></span></p>
    <p>住所： <span th:text="*{address}"></span></p>
    <p>連絡先： <span th:text="*{contact}"></span></p>
    <p>銘柄： <span id="investmentTrustName" th:text="${fundName}"></span></p>
    <!-- 注文金額＝投資される金額＋手数料の内訳。手数料が0円の場合は「無料」と明記する -->
    <p class="fee-breakdown">
        注文金額(<span id="purchaseAmount" th:text="${#numbers.formatInteger(investmentTrustApplication.purchaseAmount, 1, 'COMMA')}"></span>円)
        ＝ 投資される金額(<span th:text="${#numbers.formatInteger(investedAmount, 1, 'COMMA')}"></span>円)
        ＋
        <span th:if="${investmentTrustApplication.purchaseFee > 0}">手数料(<span id="purchaseFee" th:text="${#numbers.formatInteger(investmentTrustApplication.purchaseFee, 1, 'COMMA')}"></span>円)</span>
        <span th:unless="${investmentTrustApplication.purchaseFee > 0}">購入手数料 <span id="purchaseFee" th:text="0">0</span>円（無料）</span>
    </p>
    <!-- 信託報酬・信託財産留保額は購入代金からは差し引かれないため、参考情報として料率と概算額を開示する -->
    <p class="cost-disclosure">
        信託報酬(年率)： <span th:text="${trustFeeRatePercent}"></span>
        (概算年間費用: <span th:text="${#numbers.formatInteger(trustFeeEstimate, 1, 'COMMA')}"></span>円)
        ／
        信託財産留保額：
        <span th:unless="${hasRedemptionReserve}">なし</span>
        <span th:if="${hasRedemptionReserve}"
              th:text="${redemptionReserveRatePercent} + '(解約時概算: ' + ${#numbers.formatInteger(redemptionReserveEstimate, 1, 'COMMA')} + '円)'"></span>
        ／ <a th:href="@{/investmentTrust/glossary}" target="_blank">用語の意味はこちら</a>
    </p>
    <p>約定日(見込み)： <span th:text="${#temporals.format(tradeDatePreview, 'yyyy年M月d日')}"></span>
        <span th:if="${sameDayTrade}" class="badge badge-same-day">本日中の約定</span>
        <span th:unless="${sameDayTrade}" class="badge badge-next-day">翌営業日扱い</span>
    </p>
    <!-- 直近の基準価額をもとにした概算購入口数。約定後、正式な基準価額で確定口数に置き換わる -->
    <p>概算購入口数(参考)： <span th:text="${#numbers.formatInteger(estimatedUnitsPreview, 1, 'COMMA')} + '口'"></span></p>

    <!-- 同意確認チェック: チェックが入るまで「申し込む」ボタンを押せないようにする(investmentTrustConfirmation.jsで制御) -->
    <div class="agreement-check">
        <input type="checkbox" id="agreeTerms" class="agreement-checkbox">
        <label for="agreeTerms" class="agreement-label">
            <span class="agreement-mark"></span>
            上記の注文内容を確認し、同意します
        </label>
    </div>

    <input type="hidden" name="bankAccountNum" th:value="*{bankAccountNum}"/>
    <input type="hidden" name="institutionCode" th:value="*{institutionCode}"/>
    <input type="hidden" name="branchCode" th:value="*{branchCode}"/>
    <input type="hidden" name="bankSubject" th:value="*{bankSubject}"/>
    <input  type="hidden" name="lastName" th:value="*{lastName}"/>
    <input  type="hidden" name="firstName" th:value="*{firstName}"/>
    <input  type="hidden" name="address" th:value="*{address}"/>
    <input  type="hidden" name="contact" th:value="*{contact}"/>
    <input  type="hidden" name="password" th:value="*{password}"/>
    <input  type="hidden" name="fundCode" th:value="*{fundCode}"/>
    <input  type="hidden" name="purchaseAmount" th:value="*{purchaseAmount}"/>
    <input  type="hidden" name="purchaseFee" th:value="*{purchaseFee}"/>


    <div class="confirmation-buttons">
        <!--入力内容の修正        -->
        <!-- １６：１０入力画面に戻るための送信先を指定 -->
        <input type="submit"
               id="action"
               name="action"
               value="修正内容に戻る"
               class="form-control-button form-edit-button"
               formaction="/investmentTrust/order"/>

        <!--キャンセル-->
        <input type="button" value="注文をキャンセル" class="form-control-button form-clear-button" onclick="window.location='/investmentTrust';"/>

        <!--申し込みボタン(次の画面=完了画面へ進むので右配置)。同意チェックが入るまではdisabled-->
        <input type="submit" id="submit" name="action" value="申し込む" disabled
               class="form-control-button form-confirmation-button"/>
    </div>
</form>
<script th:inline="javascript" src="/js/investmentTrustConfirmation.js"></script>
</body>
</html>
