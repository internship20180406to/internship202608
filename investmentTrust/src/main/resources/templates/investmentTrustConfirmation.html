<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- スマートフォンでPC用の幅に縮小表示されないようにする -->
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>投資信託注文確認画面</title>
    <!-- 見た目はチャット画面以外の全画面で共通。/css/style.css にまとめてある -->
    <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<main class="content">
    <header class="page_head">
        <h1>投資信託注文確認</h1>
    </header>
    <p class="page_lead">下記の内容でお申込みします。よろしければ「申込」を押してください。</p>

    <form action="#" th:action="@{/investmentTrustCompletion}" th:object="${investmentTrustApplication}" method="post">
        <!-- 項目名と値の一覧。狭い画面では項目名が値の上に回り込む（style.css の @media を参照） -->
        <dl class="summary">
            <div class="summary_row">
                <dt class="summary_label">金融機関</dt>
                <dd class="summary_value">
                    <span th:text="*{bankCode}"></span> <span th:text="*{bankName}"></span>
                </dd>
            </div>
            <div class="summary_row">
                <dt class="summary_label">支店</dt>
                <dd class="summary_value">
                    <span th:text="*{branchCode}"></span> <span th:text="*{branchName}"></span>
                </dd>
            </div>
            <div class="summary_row">
                <dt class="summary_label">科目名</dt>
                <dd class="summary_value" th:text="*{bankAccountType}"></dd>
            </div>
            <div class="summary_row">
                <dt class="summary_label">口座番号</dt>
                <dd class="summary_value" th:text="*{bankAccountNum}"></dd>
            </div>
            <div class="summary_row">
                <dt class="summary_label">購入者名</dt>
                <dd class="summary_value" th:text="*{name}"></dd>
            </div>
            <div class="summary_row">
                <dt class="summary_label">銘柄</dt>
                <dd class="summary_value" th:text="*{fundName}"></dd>
            </div>
            <!-- #numbers.formatInteger(値, 最小桁数, 'COMMA') で3桁ごとのカンマ区切りにする。
                 hidden項目にはカンマ無しの生の数値を入れて次の画面へ渡す -->
            <div class="summary_row summary_row_highlight">
                <dt class="summary_label">購入金額</dt>
                <dd class="summary_value">
                    <span th:text="${#numbers.formatInteger(investmentTrustApplication.money, 1, 'COMMA')}"></span>円
                </dd>
            </div>
        </dl>

        <!-- 申込を確定する前に、今の残高と引き落とし後の残高を見せる。
             ここに出ている残高はこの画面を表示した時点のもの。
             実際に引き落とせるかどうかは「申込」を押した時点でもう一度判定される。 -->
        <dl class="summary">
            <div class="summary_row">
                <dt class="summary_label">現在の残高</dt>
                <dd class="summary_value">
                    <span th:text="${#numbers.formatInteger(currentBalance, 1, 'COMMA')}"></span>円
                </dd>
            </div>
            <div class="summary_row summary_row_highlight">
                <dt class="summary_label">引き落とし後の残高</dt>
                <dd class="summary_value">
                    <span th:text="${#numbers.formatInteger(balanceAfter, 1, 'COMMA')}"></span>円
                </dd>
            </div>
        </dl>

        <!-- 次の画面へ持ち回るのはコードだけで、金融機関名・支店名は送らない。
             hidden項目は開発者ツールで書き換えられるので、名称まで送ると
             「コード0001・名称こぶた銀行」のような食い違った組み合わせを登録できてしまう。
             名称は登録の直前にサーバがマスタから引き直す。 -->
        <input type="hidden" name="bankAccountNum" th:value="*{bankAccountNum}"/>
        <input type="hidden" name="bankCode" th:value="*{bankCode}"/>
        <input type="hidden" name="branchCode" th:value="*{branchCode}"/>
        <input type="hidden" name="bankAccountType" th:value="*{bankAccountType}"/>
        <input type="hidden" name="name" th:value="*{name}"/>
        <input type="hidden" name="fundName" th:value="*{fundName}"/>
        <input type="hidden" name="money" th:value="*{money}"/>

        <div class="form_actions">
            <input type="submit" id="submit" value="申込" class="btn btn_primary"/>
            <input type="button" value="キャンセル" class="btn btn_secondary"
                   onclick="window.location='/investmentTrust';"/>
        </div>
    </form>
</main>
<script th:inline="javascript" src="/js/investmentTrustConfirmation.js"></script>
</body>
</html>
