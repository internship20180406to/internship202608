<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8"/>
    <!-- スマートフォンでPC用の幅に縮小表示されないようにする。
         これが無いと、どれだけCSSを書いても文字が極端に小さいまま表示される -->
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>投資信託アプリ メニュー</title>
    <!-- 見た目はチャット画面以外の全画面で共通。/css/style.css にまとめてある -->
    <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<main class="content">
    <header class="page_head">
        <h1>投資信託アプリ</h1>
    </header>
    <p class="page_lead">操作を選んでください。</p>

    <nav class="menu_list">
        <a class="menu-item" href="/accountRegistration">
            <span class="menu-title">口座を登録する</span>
            <p class="menu-description">
                金融機関・支店・科目・口座番号と初期残高を登録します。
            </p>
        </a>

        <a class="menu-item" href="/investmentTrust">
            <span class="menu-title">フォーム入力</span>
            <p class="menu-description">
                登録済みの口座から購入代金を引き落として申し込みます。
            </p>
        </a>

        <a class="menu-item" href="/investmentTrustChat">
            <span class="menu-title">チャット入力（推奨）</span>
            <p class="menu-description">
                同じ申込内容を、会話で1項目ずつ埋めていきます。送信先も判定もフォーム版と同じです。
            </p>
        </a>
    </nav>

    <p class="note">
        申込は登録済みの口座に対してのみ行えます。
        初めて使うときは、先に「口座を登録する」から口座を作成してください。
    </p>
</main>
</body>
</html>
