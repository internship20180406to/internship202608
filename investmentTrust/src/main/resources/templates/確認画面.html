<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>確認画面</title>
</head>

<h1><b>最終確認</b></h1>

<style>
    body {
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            padding-top: 40px;
            padding-bottom: 40px;
            justify-content: center;
            align-items: center;
            min-height: 85vh;
            overflow: auto;
        }
        .content {
            background-color: #ffffff;
            width: 50%;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            min-height: 50vh;
            overflow: auto;
        }
        .form-control {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            box-sizing: border-box;
        }
        .text-danger {
            color: red;
        }
        .form-control-button {
            width: 80px;
            padding: 10px 20px;
            margin-top: 10px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        .form-confirmation-button{
            color: white;
            background-color: #2185D0;
        }
        .form-confirmation-button:hover {
            background-color: #1678c2;
        }
        .form-clear-button{
            color: black;
            background-color: #E0E1E2;
        }
        .form-clear-button:hover {
            background-color: #CCCCCC;
        }

    </style>
</head>
<body>
<div class="content">
    <h1>投資信託注文情報入力</h1>
    <form action="#" th:action="@{/investmentTrustConfirmation}" th:object="${investmentTrustApplication}" method="post">
        <p><label class="ml-1">金融機関名: <small class="text-danger ml-1">※</small></label><br>
            <input type="number" th:field="*{bankAccountNum}" class="form-control" placeholder="9999"/></p>
        </p>
        <p><label class="ml-1">支店名: <small class="text-danger ml-1">※</small></label><br>
            <input type="number" th:field="*{bankAccountNum}" class="form-control" placeholder="999"/></p>
        </p>
        <p><label class="ml-1">科目名: <small class="text-danger ml-1">※</small></label><br>
            <select th:field="*{bankName}" class="form-control">
                <option value="普通預金">普通預金</option>
                <option value="当座預金">当座預金</option>
                <option value="定期預金">定期預金</option>
                <option value="貯蓄預金">貯蓄預金</option>
                <option value="定期積金">定期積金</option>
                <option value="通知預金">通知預金</option>
                <option value="別段預金">別段預金</option>
                <option value="外貨預金">外貨預金</option>
                <option value="納税準備預金">納税準備預金</option>
            </select>
        </p>
        <p><label class="ml-1">口座番号: <small class="text-danger ml-1">※</small></label><br>
            <input type="number" th:field="*{bankAccountNum}" class="form-control" placeholder="9999999"/></p>
        <p style="text-align: center;"><input type="submit" value="確認"
                                              class="form-control-button form-confirmation-button"/>
            <input type="reset" value="クリア" class="form-control-button form-clear-button"/></p>
    </form>
</div>
</body>

</html>
