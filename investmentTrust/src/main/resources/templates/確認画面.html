<!DOCTYPE html>
<html lang="ja" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>投資信託注文情報確認画面</title>
    <style>
        body {
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            padding-top: 40px;
            padding-bottom: 40px;
            justify-content: center;
            align-items: center;
            min-height: 85vh;
            overflow: auto;
        }
        .content {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            min-height: 50vh;
            overflow: auto;
            min-width: 400px;
        }
        .form-control-button {
            padding: 10px 20px;
            margin-top: 10px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        .form-confirmation-button {
            color: white;
            background-color: #2185D0;
        }
        .form-confirmation-button:hover {
            background-color: #1678c2;
        }
        .form-clear-button {
            color: black;
            background-color: #E0E1E2;
        }
        .form-clear-button:hover {
            background-color: #CCCCCC;
        }
    </style>
</head>
<body>
<div class="content">
    <h1>最終確認</h1>

    <form th:action="@{/investmentTrustCompletion}" th:object="${investmentTrustApplication}" method="post">

        <input type="hidden" th:field="*{bankCode}" />
        <input type="hidden" th:field="*{branchName}" />
        <input type="hidden" th:field="*{accountType}" />
        <input type="hidden" th:field="*{bankAccountNum}" />
        <input type="hidden" th:field="*{lastName}" />
        <input type="hidden" th:field="*{firstName}" />
        <input type="hidden" th:field="*{fundCode}" />
        <input type="hidden" th:field="*{amount}" />
        <input type="hidden" th:field="*{purchaseAmount}" />

        <p>金融機関名:
            <span th:text="*{bankCode == '0167' ? '山陰合同銀行' :
                   (bankCode == '9900' ? 'ゆうちょ銀行' :
                   (bankCode == '0001' ? 'みずほ銀行' :
                   (bankCode == '0005' ? '三菱ＵＦＪ銀行' :
                   (bankCode == '0009' ? '三井住友銀行' :
                   (bankCode == '0010' ? 'りそな銀行' :
                   (bankCode == '0036' ? '楽天銀行' :
                   (bankCode == '0033' ? 'ＰａｙＰａｙ銀行' :
                   (bankCode == '0034' ? 'セブン銀行' :
                   (bankCode == '0035' ? 'ソニー銀行' :
                   (bankCode == '0040' ? 'イオン銀行' :
                   (bankCode == '0166' ? '鳥取銀行' :
                   (bankCode == '0565' ? '島根銀行' : 'その他の金融機関'))))))))))))}">
    </span>
           （コード: <span th:text="*{bankCode}"></span>）
        </p>


        <p>支店名: <span th:text="*{branchName}"></span></p>
        <p>科目名: <span th:text="*{accountType}"></span></p>
        <p>口座番号: <span th:text="*{bankAccountNum}"></span></p>
        <p>購入者名: <span th:text="*{lastName} + ' ' + *{firstName}"></span></p>
        <p>銘柄選択: <span th:text="*{fundCode}"></span></p>

        <div th:if="*{amount != null && amount != ''}">
            <p>購入金額（自由入力）: <span th:text="*{amount}"></span> 円</p>
        </div>
        <div th:if="*{purchaseAmount != null && purchaseAmount != ''}">
            <p>購入金額（選択肢）: <span th:text="*{purchaseAmount}"></span> 円</p>
        </div>

        <p style="text-align: center;">
        <input type="submit" value="注文を確定する" onclick="'http://localhost:63342/internship202608/internship%20(3)%20(com.example)/templates/investmentTrustCompletion.html?_ijt=t9mc6mklfpc5hue6pegsg50tlb&_ij_reload=RELOAD_ON_SAVE';" />
            <input type="button" value="戻る" onclick="window.location='http://localhost:63342/internship202608/internship%20(3)%20(com.example)/templates/investmentTrustMain.html?_ijt=te73c6pl3upngaupovppsrqitt&_ij_reload=RELOAD_ON_SAVE';" />
        </p>
    </form>
</div>
</body>
</html>
