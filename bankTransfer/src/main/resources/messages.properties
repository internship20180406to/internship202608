# 型変換に失敗したときのメッセージ（未指定だとSpringの英語メッセージがそのまま画面に出る）
# 探索順: typeMismatch.<オブジェクト名>.<項目名> -> typeMismatch.<項目名> -> typeMismatch.<型名> -> typeMismatch
# 金額と振込指定日は画面4のフォーム（@ModelAttribute("amountForm")）で受けている。
# オブジェクト名が変わるとキーは解決されなくなるので、両者は必ず一緒に直す
typeMismatch.amountForm.money=金額は半角数字で入力してください
typeMismatch.amountForm.transferDateTime=振込指定日は正しい日付を入力してください

# 上記に当てはまらない項目が増えたとき用の共通メッセージ
typeMismatch=入力された値の形式が正しくありません

