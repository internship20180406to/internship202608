<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 全画面の上に出す帯。銀行名は自行（このアプリを動かしている側）を出す。
     右の3つはまだ機能が無いので、押せる見た目にせず飾りとして置く。
     読み上げに出しても行き先が無いので aria-hidden にしている -->
<header class="appbar" th:fragment="appbar">
    <a class="appbar-brand" th:href="@{/bankTransfer}">
        <svg class="appbar-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3 9.5 12 4l9 5.5" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5.5 10.5v7M10 10.5v7M14 10.5v7M18.5 10.5v7" stroke="currentColor"
                  stroke-width="1.8" stroke-linecap="round"/>
            <path d="M3.5 20h17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>ふくよか銀行</span>
    </a>

    <div class="appbar-icons" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 3a5.5 5.5 0 0 0-5.5 5.5c0 4-1.5 5.5-1.5 5.5h14s-1.5-1.5-1.5-5.5A5.5 5.5 0 0 0 12 3Z"
                  stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="M10 17.5a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.7"
                  stroke-linecap="round"/>
        </svg>
        <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/>
            <circle cx="12" cy="10" r="3" stroke="currentColor" stroke-width="1.7"/>
            <path d="M6.5 19a6 6 0 0 1 11 0" stroke="currentColor" stroke-width="1.7"
                  stroke-linecap="round"/>
        </svg>
        <svg viewBox="0 0 24 24" fill="none">
            <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round"/>
        </svg>
    </div>
</header>

</body>
</html>
