<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 進捗表示。経路によってステップの数が変わるので、ラベルの並びと現在地を受け取る。
     どの経路も必ず steps() を通るため、狭い幅での差し替え（.stepper→.step-count）が
     片方の経路だけずれることが起こらない。
     使い方: <div th:replace="~{fragments/stepper :: stepper(3)}"></div> -->

<!-- 通常の振込。金融機関から順に入力する 1〜6 -->
<div th:fragment="stepper(current)"
     th:replace="~{:: steps(${ {'金融機関','支店','口座情報','金額','確認','完了'} }, ${current})}"></div>

<!-- 履歴・登録した振込先から入ったとき。振込先は入口の一覧で決まっているので 1〜3。
     入口はまだ手順に入っておらず（そこから通常の振込へも抜けられる）ステッパーを出さない -->
<div th:fragment="stepperSaved(current)"
     th:replace="~{:: steps(${ {'金額','確認','完了'} }, ${current})}"></div>

<!-- 振込先を登録するとき。金額を入れずに登録して終わるので 1〜4 -->
<div th:fragment="stepperRegister(current)"
     th:replace="~{:: steps(${ {'金融機関','支店','口座情報','確認'} }, ${current})}"></div>

<!-- 実体。1からcurrentまでのステップに色を付ける -->
<div th:fragment="steps(labels, current)">
    <ol class="stepper">
        <li class="stepper-item" th:each="label, s : ${labels}"
            th:classappend="${current ge s.count} ? 'is-active'">
            <span class="stepper-circle" th:text="${s.count}">1</span><span
                class="stepper-label" th:text="${label}">金融機関</span>
        </li>
    </ol>

    <!-- 狭い幅では段が入りきらないので、CSSでこちらに切り替わる -->
    <p class="step-count">ステップ <span th:text="${current}">1</span>
        / <span th:text="${#lists.size(labels)}">6</span></p>
</div>

</body>
</html>
