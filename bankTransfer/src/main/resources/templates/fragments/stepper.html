<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 金融機関→支店→口座情報→金額→確認→完了 の進捗表示（6画面で共有する部品）
     呼び出し側から現在のステップ番号(1〜6)をcurrentとして受け取り、
     1からcurrentまでのステップに色を付ける
     使い方: <div th:replace="~{fragments/stepper :: stepper(3)}"></div> -->
<div th:fragment="stepper(current)">
    <ol class="stepper">
        <li class="stepper-item" th:classappend="${current ge 1} ? 'is-active'">
            <span class="stepper-circle">1</span><span class="stepper-label">金融機関</span>
        </li>
        <li class="stepper-item" th:classappend="${current ge 2} ? 'is-active'">
            <span class="stepper-circle">2</span><span class="stepper-label">支店</span>
        </li>
        <li class="stepper-item" th:classappend="${current ge 3} ? 'is-active'">
            <span class="stepper-circle">3</span><span class="stepper-label">口座情報</span>
        </li>
        <li class="stepper-item" th:classappend="${current ge 4} ? 'is-active'">
            <span class="stepper-circle">4</span><span class="stepper-label">金額</span>
        </li>
        <li class="stepper-item" th:classappend="${current ge 5} ? 'is-active'">
            <span class="stepper-circle">5</span><span class="stepper-label">確認</span>
        </li>
        <li class="stepper-item" th:classappend="${current ge 6} ? 'is-active'">
            <span class="stepper-circle">6</span><span class="stepper-label">完了</span>
        </li>
    </ol>

    <!-- 狭い幅では6段が入りきらないので、CSSでこちらに切り替わる -->
    <p class="step-count">ステップ <span th:text="${current}">1</span> / 6</p>
</div>

</body>
</html>
