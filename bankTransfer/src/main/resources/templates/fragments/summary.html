<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 振込の内容一覧。確認画面と完了画面で同じ11項目を出す。
     違うのは「変更」を出すかどうかだけなので、そこだけ引数で切り替える。
     残高（balance / balanceAfter）と経路（fromSaved）はどちらの画面でも
     モデルに入っているので、引数で渡さずここから直接読む。

     振込先の登録（bankTransferPayeeConfirm）はここを使わない。
     金額の話をしない画面で、出す項目がそもそも違うため。

     使い方: <div th:replace="~{fragments/summary :: summary(${input}, true)}"></div> -->
<dl class="summary" th:fragment="summary(data, editable)">
    <div class="summary-row">
        <dt>金融機関</dt>
        <dd th:text="|${data.bankName}（${data.bankCode}）|">AAA銀行（0001）</dd>
        <!-- 履歴・登録先から来たときは項目ごとに直せない。振込先ごと選び直してもらう -->
        <a class="link-edit" th:if="${editable and fromSaved}"
           th:href="@{/bankTransfer}">選び直す</a>
        <a class="link-edit" th:if="${editable and !fromSaved}"
           th:href="@{/bankTransfer/bank}">変更</a>
    </div>
    <div class="summary-row">
        <dt>支店</dt>
        <dd th:text="|${data.branchName}（${data.branchCode}）|">A1支店（001）</dd>
        <a class="link-edit" th:if="${editable and !fromSaved}"
           th:href="@{/bankTransfer/branch}">変更</a>
    </div>
    <div class="summary-row">
        <dt>科目</dt>
        <dd th:text="${data.bankAccountType}">普通</dd>
        <a class="link-edit" th:if="${editable and !fromSaved}"
           th:href="@{/bankTransfer/account}">変更</a>
    </div>
    <div class="summary-row">
        <dt>口座番号</dt>
        <dd th:text="${data.bankAccountNum}">1234567</dd>
        <a class="link-edit" th:if="${editable and !fromSaved}"
           th:href="@{/bankTransfer/account}">変更</a>
    </div>
    <div class="summary-row">
        <dt>口座名義</dt>
        <dd th:text="${data.name}">ﾔﾏﾀﾞ ﾀﾛｳ</dd>
        <a class="link-edit" th:if="${editable and !fromSaved}"
           th:href="@{/bankTransfer/account}">変更</a>
    </div>
    <div class="summary-row">
        <dt>振込金額</dt>
        <dd><span th:text="${#numbers.formatInteger(data.money, 1, 'COMMA')}">1,234,567</span><span
                class="unit">円</span></dd>
        <a class="link-edit" th:if="${editable}" th:href="@{/bankTransfer/amount}">変更</a>
    </div>
    <div class="summary-row">
        <dt>手数料</dt>
        <dd><span th:text="${#numbers.formatInteger(data.fee, 1, 'COMMA')}">330</span><span
                class="unit">円</span></dd>
    </div>
    <div class="summary-row is-amount">
        <dt>合計金額</dt>
        <dd><span th:text="${#numbers.formatInteger(data.total, 1, 'COMMA')}">1,234,897</span><span
                class="unit">円</span></dd>
    </div>
    <div class="summary-row">
        <dt>振込前の残高</dt>
        <dd><span th:text="${#numbers.formatInteger(balance, 1, 'COMMA')}">1,000,000</span><span
                class="unit">円</span></dd>
    </div>
    <div class="summary-row">
        <dt>振込後の残高</dt>
        <dd><span th:text="${#numbers.formatInteger(balanceAfter, 1, 'COMMA')}">998,766</span><span
                class="unit">円</span></dd>
    </div>
    <div class="summary-row">
        <dt>振込指定日</dt>
        <dd th:text="${data.transferDateTime}">2026-08-27</dd>
        <a class="link-edit" th:if="${editable}" th:href="@{/bankTransfer/amount}">変更</a>
    </div>
</dl>

</body>
</html>
