<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('支店の選択')}"></head>
<body>
<div class="content">
    <div th:replace="~{fragments/stepper :: stepper(2)}"></div>
    <h1>支店の選択</h1>
    <div th:replace="~{fragments/recap :: recap(${input})}"></div>

    <form th:action="@{/bankTransfer/branch}" method="post">
        <div class="field">
            <label class="field-label" for="searchKeyword">支店名で検索</label>
            <div class="search">
                <svg class="search-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/>
                    <path d="M10.8 10.8 L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
                <input class="form-control" id="searchKeyword" type="search"
                       placeholder="例：A1支店" autocomplete="off"/>
                <ul class="suggest" id="searchSuggest" hidden
                    data-endpoint="/bankTransfer/api/branches"
                    data-param-name="branchCode"
                    data-no-hit="該当する支店が見つかりません"></ul>
            </div>
            <span class="hint">支店名または支店コードを入力すると候補が表示されます</span>
        </div>
    </form>

    <div class="actions">
        <a class="form-control-button form-clear-button" th:href="@{/bankTransfer}">戻る</a>
        <span class="spacer"></span>
    </div>
</div>
<script src="/js/bankTransferSearch.js"></script>
</body>
</html>
