<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('支店の選択')}"></head>
<body>
<div class="content">
    <div th:replace="~{fragments/stepper :: stepper(2)}"></div>
    <h1>支店の選択</h1>
    <div th:replace="~{fragments/recap :: recap(${input})}"></div>

    <form th:action="@{/bankTransfer/branch}" method="post">
        <h2 class="section-title">支店一覧</h2>
        <div class="picklist-head">
            <span>コード</span><span>支店名</span><span></span>
        </div>
        <ul class="picklist">
            <li th:each="branch : ${branches}">
                <button class="picklist-row" type="submit" name="branchCode" th:value="${branch.branchCode()}">
                    <span class="picklist-code" th:text="${branch.branchCode()}">001</span>
                    <span th:text="${branch.branchName()}">A1支店</span>
                    <span class="picklist-chevron" aria-hidden="true">›</span>
                </button>
            </li>
        </ul>
    </form>

    <div class="actions">
        <a class="form-control-button form-clear-button" th:href="@{/bankTransfer}">戻る</a>
        <span class="spacer"></span>
    </div>
</div>
</body>
</html>
