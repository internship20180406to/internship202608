<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>銀行振込情報入力画面</title>
    <style>
        body {
        background-color: #f0f0f0;
        margin: 0;
        padding: 0;
        display: flex;
        padding-top: 40px;
        padding-bottom: 40px;
        justify-content: center;
        align-items: center;
        min-height: 85vh;
        overflow: auto;
        }
        .content {
         background-color: #ffffff;
         width: 80%;
         padding: 20px;
         border-radius: 10px;
         box-shadow: 0 4px 8px rgba(0,0,0,0.1);
         min-height: 50vh;
         overflow: auto;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            margin: 6px 0 12px;
            box-sizing: border-box;
            border: 1px solid #d5dce5;
            border-radius: 6px;
            background-color: #f8fafc;
            font-size: 15px;
            transition: 0.2s;
        }
        .form-control:focus {
            outline: none;
            border-color: #0b6b57;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(11, 107, 87, 0.12);
        }
        .text-danger {
        color: red;
        }
        .form-control-button {
            min-width: 120px;
            padding: 12px 24px;
            margin: 20px 6px 0;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            transition: 0.2s;
        }
        .form-confirmation-button {
            color: white;
            background-color: #0b6b57;
            box-shadow: 0 3px 6px rgba(11, 107, 87, 0.25);
        }
        .form-confirmation-button:hover {
            background-color: #095746;
            transform: translateY(-1px);
            box-shadow: 0 5px 10px rgba(11, 107, 87, 0.3);
        }

        .form-clear-button {
            color: #34495e;
            background-color: #eef1f5;
            border: 1px solid #d5dce5;
        }
        .form-clear-button:hover {
            background-color: #e2e7ed;
            transform: translateY(-1px);
        }
        .form-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 10px 0;
        }
        .form-title {
            text-align: center;
            color: #333;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e5eaf0;
        }
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #555;
            margin-bottom: 6px;
        }
        .required {
            color: #e05252;
            font-size: 12px;
            margin-left: 4px;
        }
        .form-container p {
            margin: 0 0 24px;
        }
        .form-container p:last-child {
            margin-bottom: 0;
        }
        .menu-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }
        .menu-button {
            width: 180px;
            padding: 12px 0;
            border-radius: 8px;
            background-color: #eef1f5;
            color: #34495e;
            text-align: center;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            box-sizing: border-box;
            transition: 0.2s;
        }
        .menu-button:hover {
            background-color: #e2e7ed;
            transform: translateY(-1px);
        }
        .menu-button.active {
            background-color: #0b6b57;
            color: white;
            box-shadow: 0 3px 6px rgba(11, 107, 87, 0.25);
        }
        .form-control:invalid {
            color: #999;
        }
        .form-control:valid {
            color: #333;
        }
        .form-control option[value=""] {
            color: #999;
        }
        .form-control option:not([value=""]) {
            color: #333;
        }

        .input-help {
            display: block;
            margin-top: 8px;
            font-size: 12px;
            color: #999;
        }
        .form-control::placeholder {
            color: #999;
            opacity: 1;
        }

        .account-type-options {
            display: flex;
            justify-content: flex-start;
            gap: 10px;
            margin: 12px 0;
        }

        .radio-label {
            position: relative;
            cursor: pointer;
            width: 110px;
        }
        .radio-label input[type="radio"] {
            position: absolute;
            opacity: 0;
        }
        .radio-label span {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 44px;
            background-color: #f8fafc;
            color: #555;
            border: 1px solid #d5dce5;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
        }
        .radio-label:hover span {
            background-color: #f1f7f5;
            border-color: #0b6b57;
        }
        .radio-label input[type="radio"]:checked + span {
            background-color: #0b6b57;
            border-color: #0b6b57;
            color: white;

            box-shadow: 0 3px 8px rgba(11, 107, 87, 0.2);
        }
        .section-title {
            display: flex;
            align-items: center;
            margin: 10px 0 20px;
            color: #333;
            font-size: 20px;
            font-weight: 700;
        }
        .section-title span {
            display: inline-block;
            width: 5px;
            height: 22px;
            margin-right: 10px;
            background-color: #0b6b57;
            border-radius: 5px;
        }
        .section-title:not(:first-child) {
            margin-top: 35px;
        }
        .transfer-content-title {
            padding-top: 40px;
        }
        .fee-summary {
            width: 320px;
            margin: -5px 0 28px auto;
            padding: 12px 16px;
            background-color: #f8faf9;
            border: 1px solid #d7e5e1;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .fee-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            color: #666;
            font-size: 14px;
        }
        .fee-row strong {
            color: #444;
            font-size: 15px;
            font-weight: 600;
        }
        .total-row strong {
            color: #0b6b57;
            font-size: 18px;
            font-weight: 700;
        }
        .total-row strong {
            color: #0b6b57;
            font-size: 20px;
            font-weight: 700;
        }
        .fee-note {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid #edf2f0;
            color: #999;
            font-size: 11px;
            line-height: 1.5;
        }
        .name-inputs {
            display: flex;
            gap: 15px;
        }
        .name-field {
            flex: 1;
        }
        .name-label {
            display: block;
            margin-bottom: 5px;
            color: #777;
            font-size: 12px;
            font-weight: 600;
        }

    </style>
</head>
<body>
<div class="content">
    <div class="menu-buttons">
        <a href="/bankTransfer" class="menu-button active">振込入力</a>
        <a href="/bankTransferFavorite" class="menu-button">振込先登録</a>
    </div>
    <h1 class="form-title">銀行振込情報入力</h1>
    <div class="form-container">
        <form action="#" id="transferForm" th:action="@{/bankTransferConfirmation}" th:object="${bankTransferApplication}" method="post">
        <div class="section-title"><span></span>振込先情報</div>
        <p><label class="form-label">金融機関名 <span class="required">※</span></label>
            <select id="bankName" th:field="*{bankName}" class="form-control" required>
                <option value="">選択してください</option>
                <option th:each="option : ${nameOptions}"
                        th:value="${option}"
                        th:text="${option}"
                    th:selected="${option == bankTransferApplication.bankName}">
                </option>
            </select>
        </p>
        <p><label class="form-label">支店名 <span class="required">※</span></label>
            <select id="branchName" th:field="*{branchName}" class="form-control" required>
                <option value="">選択してください</option>
                <option th:each="option : ${branchNameOptions}"
                        th:value="${option}"
                        th:text="${option}"
                        th:selected="${option == bankTransferApplication.branchName}">
                </option>
            </select></p>
        <p>
            <label class="form-label">科目名 <span class="required">※</span></label>
        <div class="account-type-options">
            <label th:each="option : ${accountTypeOptions}" class="radio-label">
                <input type="radio"
                       th:field="*{bankAccountType}"
                       th:value="${option}"
                       required>
                <span th:text="${option}"></span>
            </label>
        </div>
        </p>
        <p><label class="form-label">口座番号 <span class="required">※</span></label>
            <input type="text"
                   th:field="*{bankAccountNum}" id="bankAccountNum" class="form-control" placeholder="1234567" inputmode="numeric"
                   pattern="[0-9]{6,7}" maxlength="7" required/>
            <small class="input-help">※6～7桁の半角数字で入力してください</small>
        <p><label class="form-label">口座名義 <span class="required">※</span></label>
        <div class="name-inputs">
            <div class="name-field">
                <span class="name-label">姓</span>
                <input type="text" th:field="*{lastName}" class="form-control" placeholder="ｻﾄｳ" required>
            </div>
            <div class="name-field"><span class="name-label">名</span>
                <input type="text" th:field="*{firstName}" class="form-control" placeholder="ﾊﾅｺ" required>
            </div>
        </div>
        <small class="input-help">※半角カタカナで入力してください
        </small>
        </p>
        <div class="section-title transfer-content-title"><span></span>振込内容</div>
        <p><label class="form-label">金額 <span class="required">※</span></label>
            <input type="text" id="moneyDisplay" class="form-control" placeholder="10,000"
                   inputmode="numeric" maxlength="9" required/>
            <input type="hidden" id="money" th:field="*{money}"/>
            <span id="moneyError" class="text-danger"></span>
            <span th:if="${errorMessage}" th:text="${errorMessage}" class="text-danger"></span></p>
        <div class="fee-summary">
            <div class="fee-row"><span>振込手数料</span><strong><span id="fee">0</span>円</strong>
            </div>
            <div class="fee-row total-row"><span>引落予定額</span><strong><span id="totalAmount">0</span>円</strong>
            </div>
            <div class="fee-note">※手数料は振込金額に応じて自動計算されます
            </div>
        </div>
        <p><label class="form-label">振込指定日 <span class="required">※</span></label>
            <input type="date" id="transferDateTime" th:field="*{transferDateTime}" class="form-control"/></p>
        <p style="text-align: center;">
            <input type="button" value="クリア" class="form-control-button form-clear-button" onclick="clearForm()"/>
            <input type="submit" value="確認" class="form-control-button form-confirmation-button"/></p>
    </form>
    </div>
    </div>
<script>
    const accountInput = document.getElementById("bankAccountNum");
    function formatAccountNumber() {
        if (accountInput.value.length === 6 &&
            /^[0-9]{6}$/.test(accountInput.value)) {
            accountInput.value = "0" + accountInput.value;
        }
    }
    accountInput.addEventListener("blur", formatAccountNumber);
    accountInput.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            formatAccountNumber();
        }
    });
    const moneyDisplay = document.getElementById("moneyDisplay");
    const moneyInput = document.getElementById("money");
    const feeDisplay = document.getElementById("fee");
    const totalDisplay = document.getElementById("totalAmount");
    moneyDisplay.addEventListener("input", function () {
        let rawValue = this.value.replace(/,/g, "").replace(/\D/g, "");
        moneyInput.value = rawValue;
        if (rawValue !== "") {
            this.value = Number(rawValue).toLocaleString();
        } else {
            this.value = "";
        }
        const money = Number(rawValue);
        const moneyError = document.getElementById("moneyError");
        if (rawValue !== "" && money < 1) {
            moneyError.textContent = "※振込金額は1円以上で入力してください。";
        } else if (money > 1000000) {
            moneyError.textContent = "※振込金額は100万円以下で入力してください。";
        } else {
            moneyError.textContent = "";
        }
        if (!money || money <= 0) {
            feeDisplay.textContent = "0";
            totalDisplay.textContent = "0";
            return;
        }
        const fee = money < 30000 ? 330 : 550;
        const total = money + fee;
        feeDisplay.textContent = fee.toLocaleString();
        totalDisplay.textContent = total.toLocaleString();
    });


    function clearForm() {
        document.querySelector('[name="bankName"]').value = "";
        document.querySelector('[name="branchName"]').value = "";
        document.querySelectorAll('[name="bankAccountType"]').forEach(function(radio) {
            radio.checked = false;
        });
        document.querySelector('[name="bankAccountNum"]').value = "";
        document.querySelector('[name="lastName"]').value = "";
        document.querySelector('[name="firstName"]').value = "";
        document.getElementById("moneyDisplay").value = "";
        document.getElementById("money").value = "";
        document.querySelector('[name="transferDateTime"]').value = "";
        document.getElementById("fee").textContent = "0";
        document.getElementById("totalAmount").textContent = "0";
        const moneyError = document.getElementById("moneyError");
        if (moneyError) {
            moneyError.textContent = "";
        }
    }

    const transferForm = document.getElementById("transferForm");
    transferForm.addEventListener("submit", function(event) {
        const rawValue = moneyDisplay.value.replace(/,/g, "");
        const money = Number(rawValue);
        if (rawValue === "") {
            event.preventDefault();
            moneyError.textContent = "※振込金額を入力してください。";
            moneyDisplay.focus();
            return;
        }
        if (money < 1) {
            event.preventDefault();
            moneyError.textContent = "※振込金額は1円以上で入力してください。";
            moneyDisplay.focus();
            return;
        }
        if (money > 1000000) {
            event.preventDefault();
            moneyError.textContent = "※振込金額は100万円以下で入力してください。";
            moneyDisplay.focus();
            return;
        }
        moneyInput.value = rawValue;
    });

    const transferDateInput = document.getElementById("transferDateTime");
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, "0");
    const day = String(today.getDate()).padStart(2, "0");
    const todayString = `${year}-${month}-${day}`;
    transferDateInput.min = todayString;

</script>
</body>

</html>
