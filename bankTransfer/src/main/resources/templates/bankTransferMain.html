<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="stylesheet"
          th:href="@{/js/css/bankTransferMain.css}">
    <meta charset="UTF-8"/>
    <title>銀行振込情報入力画面</title>
</head>
<script th:src="@{/js/bankTransferMain.js}"></script>
<body>

<div class="content">
    <div class="progress-steps step-1">
        <div class="step">
            <span class="step-number">1</span>
            <span class="step-label">銀行振込入力</span>
        </div>

        <div class="step">
            <span class="step-number">2</span>
            <span class="step-label">振込内容確認</span>
        </div>

        <div class="step">
            <span class="step-number">3</span>
            <span class="step-label">振込完了</span>
        </div>
    </div>

    <h1>銀行振込情報入力</h1>
    <p style="margin-top:12px;"><a th:href="@{/bankTransferStatus}" class="status-button">振込履歴を確認する</a></p>
    <p class="text-danger" th:if="${errorMessage}" th:text="${errorMessage}">エラーメッセージ</p>
    <section class="recent-transfers"
             th:if="${not #lists.isEmpty(recentTransfers)}">

        <h2>最近の振込先</h2>
        <p class="recent-transfers-description">
            選択すると振込先情報が自動入力されます
        </p>

        <div class="recent-transfer-list">
            <button type="button"
                    class="recent-transfer-card"
                    th:each="transfer : ${recentTransfers}"
                    th:attr="
                    data-bank-name=${transfer.bankName},
                    data-branch-name=${transfer.branchName},
                    data-account-type=${transfer.bankAccountType},
                    data-account-num=${transfer.bankAccountNum},
                    data-account-name=${transfer.name}">

                <strong th:text="${transfer.name}">
                    口座名義
                </strong>

                <span th:text="${transfer.bankName + '　' + transfer.branchName}">
                金融機関名　支店名
            </span>

                <span th:text="${transfer.bankAccountType + '　' + transfer.bankAccountNum}">
                科目名　口座番号
            </span>
            </button>
        </div>
    </section>

    <section class="favorite-transfers"
             th:if="${not #lists.isEmpty(favoriteTransfers)}">

        <h2>登録済みの口座</h2>
        <p class="favorite-transfers-description">
            <small>選択すると振込先情報が自動入力されます</small>
        </p>

        <div class="favorite-transfer-list">
            <button type="button"
                    class="recent-transfer-card"
                    th:each="favorite : ${favoriteTransfers}"
                    th:attr="
                    data-bank-name=${favorite.bankName},
                    data-branch-name=${favorite.branchName},
                    data-account-type=${favorite.bankAccountType},
                    data-account-num=${favorite.bankAccountNum},
                    data-account-name=${favorite.name}">

                <strong th:text="${favorite.name}">
                    口座名義
                </strong>

                <span th:text="${favorite.bankName + '　' + favorite.branchName}">
                金融機関名　支店名
            </span>

                <span th:text="${favorite.bankAccountType + '　' + favorite.bankAccountNum}">
                科目名　口座番号
            </span>
            </button>
        </div>
    </section>

    <div class="new-transfer-heading">
        <div class="choice-separator" th:if="${not #lists.isEmpty(recentTransfers)} or ${not #lists.isEmpty(favoriteTransfers)}">
            <span>または</span>
        </div>
        <h2>新しい振込先を入力</h2>
        <p>振込先情報と振込内容を入力してください</p>
    </div>

    <form action="#" th:action="@{/bankTransferConfirmation}" th:object="${bankTransferApplication}" method="post">
        <p><label class="ml-1">金融機関名: <small class="text-danger ml-1">※</small></label><br>
            <!-- 統合コンボボックス（検索 + プルダウン） -->
            <div class="combo" id="bankNameCombo">
                <div class="combo-input-wrapper">
                    <input type="text" id="bankNameInput" class="form-control" placeholder="選択または検索" aria-autocomplete="list" aria-haspopup="listbox" autocomplete="off" required/>
                    <button type="button" class="combo-toggle" aria-label="候補を表示">▾</button>
                </div>

                <ul class="combo-list" id="bankNameList" role="listbox" hidden>
                    <li role="option" th:each="option : ${nameOptionsBankName}" th:attr="data-value=${option}" th:text="${option}"></li>
                </ul>

                <!-- フォームバインディング用の hidden フィールド -->
                <input type="hidden" th:field="*{bankName}" id="bankName" />
            </div>
            <small class="text-muted">候補から選ぶか入力して候補を選択できます。</small>
            </p>
        <p><label class="ml-1">支店名: <small class="text-danger ml-1">※</small></label><br>
            <select th:field="*{branchName}" class="form-control" required>
                <option value="">選択してください</option>
                <option th:each="option : ${nameOptionsBranchName}"
                        th:value="${option}"
                        th:text="${option}">選択肢
                </option>
            </select></p>
        <p>
            <label class="ml-1">科目名:　<small class="text-danger ml-1">※</small></label><br>
            <label>
                <input type="radio"
                       th:field="*{bankAccountType}"
                       value="普通" required/>普通
            </label>
            <label>
                <input type="radio"
                       th:field="*{bankAccountType}"
                       value="当座"/>当座
            </label>

            <label>
                <input type="radio"
                       th:field="*{bankAccountType}"
                       value="貯蓄"/>貯蓄
            </label>

            <label>
                <input type="radio"
                       th:field="*{bankAccountType}"
                       value="その他"/>その他
            </label>
        </p>

        <p><label class="ml-1">口座番号: <small class="text-danger ml-1">※</small></label><br>
            <input type="text" th:field="*{bankAccountNum}" class="form-control" placeholder="1234567" inputmode="numeric" pattern="[0-9]{1,7}" maxlength="7"
                   title="口座番号は半角数字7桁以内で入力してください" required/>

        </p>


        <!--振込画面 -->
        <p><label class="ml-1">口座名義: <small class="text-danger ml-1">※</small></label><br>
            <input type="text" th:field="*{name}" class="form-control" placeholder="ﾌﾘｺﾐ ﾀﾛｳ"  pattern="[ｦ-ﾟ ]+" maxlength="20"
                   title="口座名義は半角カタカナで入力してください"
                   required/>
            <small>半角カタカナで入力してください。</small>
        </p>

        <p><label class="ml-1">金額: <small class="text-danger ml-1">※</small></label><br>
            <input type="number" th:field="*{money}" th:attr="max=${balance}" class="form-control" placeholder="10000" min="1" step="1"
                   oninvalid="
           if (this.value === '') {
               this.setCustomValidity('振込金額を入力してください');
           } else if (this.validity.rangeOverflow) {
               this.setCustomValidity('振込金額が口座残高を超えています');
           } else {
               this.setCustomValidity('振込金額は1円以上で入力してください');
           }
            "
                   oninput="this.setCustomValidity('')" required/></p>

        <div class="balance-information">
            <span class="balance-label">口座残高：</span>

            <strong class="balance-amount">
        <span th:text="${#numbers.formatInteger(balance, 1, 'COMMA')}">
            60,000
        </span>円
            </strong>

            <p class="today-available">
                本日の振込可能額：
                <strong th:text="${#numbers.formatInteger(todayAvailable, 1, 'COMMA')}">0</strong>円
            </p>

            <p class="balance-note">
                <small>※振込限度額を超える振込はできません。</small>
            </p>
        </div>

        <p><label class="ml-1">振込指定日: <small class="text-danger ml-1">※</small></label><br>
            <input type="date" th:field="*{transferDateTime}" th:attr="min=${today}" class="form-control" required/></p>

        <!--ボタン -->
        <p style="text-align: center;"><input type="submit" value="次へ"
                                              class="form-control-button form-confirmation-button"/>
            <input type="reset" value="クリア" th:formaction="@{/bankTransferClear}" formmethod="post" class="form-control-button form-clear-button"/></p>

    </form>
</div>
</body>

</html>
