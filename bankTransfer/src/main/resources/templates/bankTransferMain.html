<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>銀行振込情報入力画面</title>
    <link rel="stylesheet" href="/css/bankTransfer.css"/>
</head>
<body>
<div class="content">
    <div th:replace="~{fragments/stepper :: stepper(1)}"></div>
    <h1>銀行振込情報入力</h1>
    <form action="#" th:action="@{/bankTransferConfirmation}" th:object="${bankTransferApplication}" method="post">

        <p><label class="field-label">金融機関名:</label><br>
            <select th:field="*{bankName}" class="form-control">
                <option value="">選択してください</option>
                <option th:each="option : ${nameOptions}"
                        th:value="${option}"
                        th:text="${option}">選択肢
                </option>
            </select>
            <span class="text-danger" th:if="${#fields.hasErrors('bankName')}"
                  th:errors="*{bankName}"></span></p>

        <p><label class="field-label">支店名:</label><br>
            <input type="text" th:field="*{branchName}" class="form-control" maxlength="20" placeholder="本店"/>
            <span class="text-danger" th:if="${#fields.hasErrors('branchName')}"
                  th:errors="*{branchName}"></span></p>

        <p><label class="field-label">科目:</label><br>
            <select th:field="*{bankAccountType}" class="form-control">
                <option value="">選択してください</option>
                <option th:each="option : ${accountTypeOptions}"
                        th:value="${option}"
                        th:text="${option}">選択肢
                </option>
            </select>
            <span class="text-danger" th:if="${#fields.hasErrors('bankAccountType')}"
                  th:errors="*{bankAccountType}"></span></p>

        <p><label class="field-label">口座番号:</label><br>
            <input type="text" th:field="*{bankAccountNum}" class="form-control"
                   maxlength="7" placeholder="1234567"/>
            <span class="text-danger" th:if="${#fields.hasErrors('bankAccountNum')}"
                  th:errors="*{bankAccountNum}"></span></p>

        <p><label class="field-label">口座名義:</label><br>
            <input type="text" th:field="*{name}" class="form-control" maxlength="20" placeholder="ﾔﾏﾀﾞ ﾀﾛｳ"/>
            <span class="text-danger" th:if="${#fields.hasErrors('name')}"
                  th:errors="*{name}"></span></p>

        <p><label class="field-label">金額:</label><br>
            <span class="input-with-unit">
                <input type="text" th:field="*{money}" class="form-control" inputmode="numeric" placeholder="10,000"/>
                <span class="unit">円</span>
            </span>
            <span class="text-danger" th:if="${#fields.hasErrors('money')}"
                  th:errors="*{money}"></span></p>

        <p><label class="field-label">振込指定日:</label><br>
            <input type="date" th:field="*{transferDateTime}" class="form-control" th:min="${today}"/>
            <span class="text-danger" th:if="${#fields.hasErrors('transferDateTime')}"
                  th:errors="*{transferDateTime}"></span></p>

        <p style="text-align: center;"><input type="submit" value="確認"
                                              class="form-control-button form-confirmation-button"/>
            <input type="reset" value="クリア" class="form-control-button form-clear-button"/></p>
    </form>
</div>
<script src="/js/bankTransferMain.js"></script>
</body>
</html>
