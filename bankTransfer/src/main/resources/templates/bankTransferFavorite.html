<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>振込先登録</title>

    <style>

        body {
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            padding-top: 40px;
            padding-bottom: 40px;
            justify-content: center;
            align-items: center;
            min-height: 85vh;
            overflow: auto;
        }
        .content {
            background-color: #ffffff;
            width: 80%;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            min-height: 50vh;
            overflow: auto;
        }
        .menu-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }
        .menu-button {
            width: 180px;
            padding: 12px 0;
            border-radius: 8px;
            background-color: #eef1f5;
            color: #34495e;
            text-align: center;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: 0.2s;
        }
        .menu-button:hover {
            background-color: #e2e7ed;
            transform: translateY(-1px);
        }
        .menu-button.active {
            background-color: #1f5f91;
            color: white;
            box-shadow: 0 3px 6px rgba(31, 95, 145, 0.25);
        }
        .form-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 10px 0;
        }
        .form-title {
            text-align: center;
            color: #1f3a5f;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e5eaf0;
        }
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #34495e;
            margin-bottom: 6px;
        }
        .required {
            color: #e05252;
            font-size: 12px;
            margin-left: 4px;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            margin: 6px 0 12px;
            box-sizing: border-box;
            border: 1px solid #d5dce5;
            border-radius: 6px;
            background-color: #f8fafc;
            font-size: 15px;
            transition: 0.2s;
        }
        .form-control:focus {
            outline: none;
            border-color: #2185D0;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(33, 133, 208, 0.12);
        }
        .form-control-button {
            min-width: 140px;
            padding: 12px 24px;
            margin: 20px 6px 0;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            transition: 0.2s;
        }
        .form-register-button {
            color: white;
            background-color: #1f5f91;
            box-shadow: 0 3px 6px rgba(31, 95, 145, 0.25);
        }
        .form-register-button:hover {
            background-color: #174a72;
            transform: translateY(-1px);
            box-shadow: 0 5px 10px rgba(31, 95, 145, 0.3);
        }
        .form-clear-button {
            color: #34495e;
            background-color: #eef1f5;
            border: 1px solid #d5dce5;
        }
        .form-clear-button:hover {
            background-color: #e2e7ed;
            transform: translateY(-1px);
        }
        .form-container p {
            margin: 0 0 20px;
        }
        .form-container p:last-child {
            margin-bottom: 0;
        }



        .favorite-container {
            max-width: 800px;
            margin: 40px auto 0;
            padding-top: 30px;
            border-top: 2px solid #e5eaf0;
        }
        .favorite-title {
            text-align: center;
            color: #1f3a5f;
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .favorite-card {
            background-color: #f8fafc;
            border: 1px solid #d5dce5;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.06);
            transition: 0.2s;
        }
        .favorite-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .favorite-bank {
            font-size: 18px;
            font-weight: 600;
            color: #1f3a5f;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e5eaf0;
        }
        .favorite-info {
            margin-bottom: 15px;
        }
        .favorite-info p {
            display: flex;
            margin: 8px 0;
            font-size: 14px;
        }
        .favorite-info span {
            width: 90px;
            color: #7a8793;
            font-weight: 600;
        }
        .favorite-info strong {
            color: #34495e;
            font-weight: 500;
        }
        .use-favorite-button {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border-radius: 6px;
            background-color: #1f5f91;
            color: white;
            text-align: center;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
        }
        .use-favorite-button:hover {
            background-color: #174a72;
            transform: translateY(-1px);
        }
        .no-favorite {
            text-align: center;
            padding: 25px;
            color: #7a8793;
            background-color: #f8fafc;
            border: 1px solid #d5dce5;
            border-radius: 8px;
        }

    </style>
</head>

<body>

<div class="content">
    <div class="menu-buttons">
        <a href="/bankTransfer" class="menu-button">振込入力</a>
        <a href="/bankTransferFavorite" class="menu-button active">振込先登録</a>
    </div>
    <h1 class="form-title">振込先登録</h1>
    <div class="form-container">
        <form action="/bankTransfer/favorite" method="post">
            <p><label class="form-label">金融機関名<span class="required">※必須</span></label>
                <select name="bankName" class="form-control">
                    <option>山陰共同銀行</option> <option>さくら未来銀行</option> <option>ながれぼし銀行</option> <option>ひかり中央</option> <option>ほしぞら銀行</option>
                </select></p>
            <p><label class="form-label">
                支店名<span class="required">※必須</span></label>
                <select name="branchName" class="form-control">
                    <option>博多支店</option> <option>天神支店</option> <option>小倉支店</option> <option>久留米支店</option> <option>八女支店</option>
                </select></p>
            <p><label class="form-label">科目名<span class="required">※必須</span></label>
                <select name="bankAccountType" class="form-control">
                    <option>普通預金</option> <option>当座預金</option> <option>貯蓄預金</option> <option>定期預金</option>
                </select></p>
            <p><label class="form-label">口座番号<span class="required">※必須</span></label>
                <input type="number" name="bankAccountNum" class="form-control" placeholder="1234567"/></p>
            <p><label class="form-label">口座名義<span class="required">※必須</span></label>
                <input type="text" name="name" class="form-control" placeholder="山田　太郎"/></p>
            <p style="text-align: center;">
                <input type="submit" value="振込先を登録" class="form-control-button form-register-button"/>
                <input type="reset" value="クリア" class="form-control-button form-clear-button"/></p>
        </form>
    </div>
    <div class="favorite-container">
        <h2 class="favorite-title">登録済みの振込先</h2>
        <div th:if="${#lists.isEmpty(favoriteList)}" class="no-favorite">登録されている振込先はありません。</div>
        <div th:each="favorite : ${favoriteList}" class="favorite-card">
            <div class="favorite-bank">🏦<span th:text="${favorite.bankName}"></span></div>
            <div class="favorite-info"><p><span>支店名</span><strong th:text="${favorite.branchName}"></strong></p>
                <p><span>口座種別</span><strong th:text="${favorite.bankAccountType}"></strong></p>
                <p><span>口座番号</span><strong th:text="${favorite.bankAccountNum}"></strong></p>
                <p><span>口座名義</span><strong th:text="${favorite.name}"></strong></p>
            </div>
            <a th:href="@{/bankTransfer/useFavorite(
                bankName=${favorite.bankName},
                branchName=${favorite.branchName},
                bankAccountType=${favorite.bankAccountType},
                bankAccountNum=${favorite.bankAccountNum},
                name=${favorite.name}
            )}" class="use-favorite-button">
                この振込先を使う
            </a>
        </div>
    </div>

</div>

</body>

</html>
