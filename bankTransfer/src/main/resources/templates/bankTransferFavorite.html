<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>振込先登録</title>

    <style>

        body {
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            padding-top: 40px;
            padding-bottom: 40px;
            justify-content: center;
            align-items: center;
            min-height: 85vh;
            overflow: auto;
        }
        .content {
            background-color: #ffffff;
            width: 80%;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            min-height: 50vh;
            overflow: auto;
        }
        .menu-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }
        .menu-button {
            width: 180px;
            padding: 12px 0;
            border-radius: 8px;
            background-color: #eef1f5;
            color: #34495e;
            text-align: center;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: 0.2s;
        }
        .menu-button:hover {
            background-color: #e2e7ed;
            transform: translateY(-1px);
        }
        .menu-button.active {
            background-color: #0b6b57;
            color: white;
            box-shadow: 0 3px 6px rgba(11, 107, 87, 0.25);
        }
        .form-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 10px 0;
        }
        .form-title {
            text-align: center;
            color: #333;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e5eaf0;
        }
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #555;
            margin-bottom: 6px;
        }
        .required {
            color: #e05252;
            font-size: 12px;
            margin-left: 4px;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            margin: 6px 0 12px;
            box-sizing: border-box;
            border: 1px solid #d5dce5;
            border-radius: 6px;
            background-color: #f8fafc;
            font-size: 15px;
            transition: 0.2s;
        }
        .form-control:focus {
            outline: none;
            border-color: #0b6b57;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(11, 107, 87, 0.25);
        }
        .form-control-button {
            min-width: 140px;
            padding: 12px 24px;
            margin: 20px 6px 0;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            transition: 0.2s;
        }
        .form-register-button {
            color: white;
            background-color: #0b6b57;
            box-shadow: 0 3px 6px rgba(11, 107, 87, 0.25);
        }
        .form-register-button:hover {
            background-color: #095746;
            transform: translateY(-1px);
            box-shadow: 0 5px 10px rgba(11, 107, 87, 0.3);
        }
        .form-clear-button {
            color: #34495e;
            background-color: #eef1f5;
            border: 1px solid #d5dce5;
        }
        .form-clear-button:hover {
            background-color: #e2e7ed;
            transform: translateY(-1px);
        }
        .form-container p {
            margin: 0 0 20px;
        }
        .form-container p:last-child {
            margin-bottom: 0;
        }
        .favorite-container {
            max-width: 800px;
            margin: 40px auto 0;
            padding-top: 30px;
            border-top: 2px solid #e5eaf0;
        }
        .favorite-title {
            text-align: center;
            color: #333;
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .favorite-card {
            background-color: #f8fafc;
            border: 1px solid #d5dce5;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.06);
            transition: 0.2s;
        }
        .favorite-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .favorite-bank {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e5eaf0;
        }
        .favorite-info {
            margin-bottom: 15px;
        }
        .favorite-info p {
            display: flex;
            margin: 8px 0;
            font-size: 14px;
        }
        .favorite-info span {
            width: 90px;
            color: #7a8793;
            font-weight: 600;
        }
        .favorite-info strong {
            color: #555;
            font-weight: 500;
        }
        .use-favorite-button {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border-radius: 6px;
            background-color: #0b6b57;
            color: white;
            text-align: center;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
        }
        .use-favorite-button:hover {
            background-color: #095746;
            transform: translateY(-1px);
        }
        .no-favorite {
            text-align: center;
            padding: 25px;
            color: #7a8793;
            background-color: #f8fafc;
            border: 1px solid #d5dce5;
            border-radius: 8px;
        }
        .delete-favorite-button {
            width: 100%;
            margin-top: 8px;
            padding: 10px;
            border: 1px solid #d5dce5;
            border-radius: 6px;
            background-color: #ffffff;
            color: #c0392b;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .delete-favorite-button:hover {
            background-color: #fdf0ef;
            border-color: #e05252;
            transform: translateY(-1px);
        }
        .favorite-actions {
            display: flex;
            gap: 10px;
        }
        .favorite-actions .use-favorite-button {
            flex: 1;
        }
        .favorite-actions form {
            flex: 0 0 100px;
            margin: 0;
        }
        .favorite-actions .delete-favorite-button {
            width: 100%;
            margin-top: 0;
        }
        .form-control:invalid {
            color: #999;
        }
        .form-control:valid {
            color: #333;
        }
        .form-control option[value=""] {
            color: #999;
        }
        .form-control option:not([value=""]) {
            color: #333;
        }
        .input-help {
            display: block;
            margin-top: 5px;
            font-size: 12px;
            color: #999;
        }
        .form-control::placeholder {
            color: #999;
            opacity: 1;
        }
        .account-type-options {
            display: flex;
            justify-content: flex-start;
            gap: 10px;
            margin: 12px 0;
        }
        .radio-label {
            position: relative;
            cursor: pointer;
            width: 110px;
        }
        .radio-label input[type="radio"] {
            position: absolute;
            opacity: 0;
        }
        .radio-label span {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 44px;
            background-color: #f8fafc;
            color: #555;
            border: 1px solid #d5dce5;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
        }
        .radio-label:hover span {
            background-color: #f1f7f5;
            border-color: #0b6b57;
        }
        .radio-label input[type="radio"]:checked + span {
            background-color: #0b6b57;
            border-color: #0b6b57;
            color: white;
            box-shadow: 0 3px 8px rgba(11, 107, 87, 0.2);
        }
        .success-message {
            max-width: 800px;
            margin: 0 auto 25px;
            padding: 15px 18px;
            display: flex;
            align-items: center;
            gap: 13px;
            background-color: #f1f7f5;
            border: 1px solid #c5ddd6;
            border-radius: 10px;
            box-sizing: border-box;
        }
        .success-icon {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0b6b57;
            color: white;
            border-radius: 50%;
            font-size: 18px;
            font-weight: bold;
        }
        .success-text {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .success-text strong {
            color: #0b6b57;
            font-size: 14px;
        }
        .success-text span {
            color: #777;
            font-size: 12px;
        }
        .name-inputs {
            display: flex;
            gap: 15px;
        }
        .name-field {
            flex: 1;
        }
        .name-label {
            display: block;
            margin-bottom: 5px;
            color: #777;
            font-size: 12px;
            font-weight: 600;
        }


    </style>
</head>

<body>

<div class="content">
    <div class="menu-buttons">
        <a href="/bankTransfer" class="menu-button">振込入力</a>
        <a href="/bankTransferFavorite" class="menu-button active">振込先登録</a>
    </div>
    <h1 class="form-title">振込先登録</h1>
    <div th:if="${successMessage}" class="success-message">
        <div class="success-icon">✓</div>
        <div class="success-text"><strong>振込先を登録しました</strong><span>登録済みの振込先からいつでも利用できます。</span></div>
    </div>
    <div class="form-container">
        <form action="/bankTransfer/favorite" method="post">
            <p><label class="form-label">金融機関名<span class="required">※</span></label>
                <select name="bankName" class="form-control" required>
                    <option value="">選択してください</option>
                    <option>山陰共同銀行</option> <option>さくら未来銀行</option> <option>ながれぼし銀行</option> <option>ひかり中央</option> <option>ほしぞら銀行</option>
                </select></p>
            <p><label class="form-label">支店名<span class="required">※</span></label>
                <select name="branchName" class="form-control" required>
                    <option value="">選択してください</option>
                    <option>博多支店</option> <option>天神支店</option> <option>小倉支店</option> <option>久留米支店</option> <option>八女支店</option>
                </select></p>
            <p><label class="form-label">科目名<span class="required">※</span></label>
            <div class="account-type-options">
            <label class="radio-label">
                <input type="radio" name="bankAccountType" value="普通" required><span>普通</span></label>
            <label class="radio-label">
                <input type="radio" name="bankAccountType" value="当座"><span>当座</span></label>
            <label class="radio-label">
                <input type="radio" name="bankAccountType" value="貯蓄"><span>貯蓄</span></label>
            </div></p>
            <p><label class="form-label">口座番号<span class="required">※</span></label>
                <input type="text" id="favoriteBankAccountNum" name="bankAccountNum" class="form-control"
                       placeholder="1234567" inputmode="numeric" pattern="[0-9]{6,7}" maxlength="7" required/>
                <small class="input-help">※6～7桁の半角数字で入力してください</small></p>

            <p><label class="form-label">口座名義 <span class="required">※</span></label>
            <div class="name-inputs">
                <div class="name-field"><span class="name-label">姓</span>
                    <input type="text" name="lastName" class="form-control" placeholder="ｻﾄｳ" required>
                </div>
                <div class="name-field">
                    <span class="name-label">名</span>
                    <input type="text" name="firstName" class="form-control" placeholder="ﾊﾅｺ" required>
                </div>
            </div>
            <small class="input-help">※半角カタカナで入力してください</small>
            </p>



            <p style="text-align: center;">
                <input type="reset" value="クリア" class="form-control-button form-clear-button"/>
                <input type="submit" value="振込先を登録" class="form-control-button form-register-button"/></p>
        </form>
    </div>
    <div class="favorite-container">
        <h2 class="favorite-title">登録済みの振込先</h2>
        <div th:if="${#lists.isEmpty(favoriteList)}" class="no-favorite">
            <div class="no-favorite-icon">⭐</div>
            <p class="no-favorite-title">登録されている振込先はありません</p>
            <p class="no-favorite-text">振込先を登録すると、次回から簡単に呼び出せます。</p>
        </div>
        <div th:each="favorite : ${favoriteList}" class="favorite-card">
            <div class="favorite-bank">🏦<span th:text="${favorite.bankName}"></span></div>
            <div class="favorite-info"><p><span>支店名</span><strong th:text="${favorite.branchName}"></strong></p>
                <p><span>口座種別</span><strong th:text="${favorite.bankAccountType}"></strong></p>
                <p><span>口座番号</span><strong th:text="${favorite.bankAccountNum}"></strong></p>
                <p><span>口座名義</span><strong th:text="${favorite.name}"></strong></p>
            </div>
            <div class="favorite-actions">
            <a th:href="@{/bankTransfer/useFavorite(
                bankName=${favorite.bankName},
                branchName=${favorite.branchName},
                bankAccountType=${favorite.bankAccountType},
                bankAccountNum=${favorite.bankAccountNum},
                name=${favorite.name}
            )}" class="use-favorite-button">
                この振込先を使う
            </a>
            <form th:action="@{/bankTransferFavorite/delete}" method="post"
                  onsubmit="return confirm('この振込先を削除しますか？');">
                <input type="hidden" name="id" th:value="${favorite.id}"/>
                <button type="submit" class="delete-favorite-button">
                    🗑️ 削除
                </button>
            </form>
        </div>
        </div>
    </div>

</div>
<script>
    const favoriteAccountInput =
        document.getElementById("favoriteBankAccountNum");
    function formatFavoriteAccountNumber() {
        if (favoriteAccountInput.value.length === 6 &&
            /^[0-9]{6}$/.test(favoriteAccountInput.value)) {
            favoriteAccountInput.value =
                "0" + favoriteAccountInput.value;
        }
    }
    favoriteAccountInput.addEventListener(
        "blur",
        formatFavoriteAccountNumber
    );
    favoriteAccountInput.addEventListener(
        "keydown",
        function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                formatFavoriteAccountNumber();
            }
        }
    );
</script>

</body>

</html>
