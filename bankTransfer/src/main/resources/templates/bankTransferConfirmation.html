<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('振込内容の確認')}"></head>
<body>
<div th:replace="~{fragments/appbar :: appbar}"></div>
<div class="content">
    <div th:replace="${fromSaved} ? ~{fragments/stepper :: stepperSaved(2)}
                                  : ~{fragments/stepper :: stepper(5)}"></div>
    <div th:replace="~{fragments/titlebar :: titleWithCancel('振込内容の確認')}"></div>
    <p class="lead">内容をご確認のうえ、「振込」を押してください。</p>

    <div th:replace="~{fragments/summary :: summary(${input}, true)}"></div>

    <form th:action="@{/bankTransfer/completion}" method="post">
        <!-- 二重送信防止用のワンタイムトークン -->
        <input type="hidden" name="transferToken" th:value="${transferToken}"/>
        <!-- 最後の一押しだけは右下ではなく中央に置く。ここは手順を進める操作ではなく、
             実際にお金が動く操作なので、他の画面と同じ定位置に置かない -->
        <div class="actions is-commit">
            <a class="form-control-button form-clear-button" th:href="@{/bankTransfer/amount}">戻る</a>
            <button class="form-control-button form-commit-button" type="submit" id="submit">振込</button>
        </div>
    </form>
</div>
<div th:replace="~{fragments/cancel :: cancel}"></div>
<script src="/js/bankTransferConfirmation.js"></script>
</body>
</html>
