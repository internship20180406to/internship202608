<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>銀行振込確認画面</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f4f7f9;
            color: #333;
            font-family: "Noto Sans JP", "Yu Gothic", sans-serif;
        }
        .confirmation-container {
            width: 90%;
            max-width: 720px;
            margin: 60px auto;
        }

        .page-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .bank-icon {
            width: auto;
            height: auto;
            margin: 0 auto 10px;
            background: none;
            color: #0b6b57;
            font-size: 30px;
            font-weight: 700;
            box-shadow: none;
            border-radius: 0;
        }
        .page-header h1 {
            margin: 0 0 10px;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 0.04em;
        }
        .page-header p {
            margin: 0;
            color: #777;
            font-size: 14px;
        }
        .confirmation-card {
            background: white;
            border-radius: 14px;
            padding: 10px 35px 25px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
        }
        .section-title {
            display: flex;
            align-items: center;

            margin: 20px 0 5px;

            font-size: 18px;
            font-weight: bold;
        }
        .section-title span {
            display: inline-block;

            width: 5px;
            height: 22px;

            margin-right: 10px;

            background: #0b6b57;
            border-radius: 5px;
        }
        .confirmation-row {
            display: flex;
            align-items: center;

            min-height: 58px;

            border-bottom: 1px solid #edf0f2;
        }
        .confirmation-row:last-child {
            border-bottom: none;
        }
        .label {
            width: 35%;

            color: #777;
            font-size: 14px;
            font-weight: 600;
        }
        .value {
            width: 65%;

            color: #222;
            font-size: 16px;
            font-weight: 500;

            text-align: right;
        }
        .money-row {
            margin-top: 8px;
            padding-top: 5px;
        }

        .money-value {
            color: #0b6b57;
            font-size: 25px;
            font-weight: 700;
        }
        .button-area {
            display: flex;
            justify-content: center;
            gap: 15px;

            margin-top: 30px;
        }
        .submit-button,
        .cancel-button {
            width: 200px;
            height: 52px;

            border: none;
            border-radius: 8px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }
        .submit-button {
            background: #0b6b57;
            color: white;

            box-shadow: 0 5px 12px rgba(11, 107, 87, 0.25);
        }
        .submit-button:hover {
            background: #095746;
            transform: translateY(-2px);
        }
        .cancel-button {
            background: white;
            color: #555;

            border: 1px solid #d5dadd;
        }
        .cancel-button:hover {
            background: #f5f5f5;
        }
        .security-note {
            margin-top: 25px;

            text-align: center;

            color: #888;
            font-size: 12px;
        }
        .stepper {
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 520px;
            margin: 18px auto 32px;
        }
        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 75px;
            position: relative;
        }
        .step-number {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #d9e2df;
            color: #9aa5a1;
            font-size: 14px;
            font-weight: 700;
            box-sizing: border-box;
            transition: 0.25s ease;
        }
        .step-label {
            margin-top: 8px;
            color: #929c99;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.04em;
        }
        .step-line {
            flex: 1;
            height: 2px;
            margin: 0 5px 21px;
            background: #e1e7e5;
            border-radius: 10px;
        }
        .step.active .step-number {
            background: #0b6b57;
            border-color: #0b6b57;
            color: #ffffff;
            transform: scale(1.08);
            box-shadow:
                    0 4px 10px rgba(11, 107, 87, 0.20),
                    0 0 0 5px rgba(11, 107, 87, 0.08);
        }
        .step.active .step-label {
            color: #0b6b57;
            font-weight: 700;
        }

    </style>

</head>
<body>
    <div class="confirmation-container">
        <div class="stepper">
            <div class="step">
                <div class="step-number">1</div><div class="step-label">入力</div>
            </div>
            <div class="step-line"></div>
            <div class="step active">
                <div class="step-number">2</div><div class="step-label">確認</div>
            </div>
            <div class="step-line"></div>
            <div class="step">
                <div class="step-number">3</div><div class="step-label">完了</div>
            </div>
        </div>
        <div class="page-header"><div class="bank-icon">￥</div> <h1>銀行振込確認</h1> <p>以下の内容をご確認のうえ、「振込」を押してください。</p></div>
        <form action="#" th:action="@{/bankTransferCompletion}" th:object="${bankTransferApplication}" method="post"
              onsubmit="return confirm('振込を実行しますか？');">
            <div class="confirmation-card">
                <div class="section-title"> <span></span> 振込内容 </div>
                <div class="confirmation-row"> <div class="label">金融機関名</div>
                <div class="value" th:text="${bankName}"></div></div>
                <div class="confirmation-row"> <div class="label">支店名</div>
                <div class="value" th:text="*{branchName}"></div> </div>
                <div class="confirmation-row"> <div class="label">科目名</div> <div class="value" th:text="*{bankAccountType}"></div></div>
                <div class="confirmation-row"> <div class="label">口座番号</div> <div class="value" th:text="*{bankAccountNum}"></div> </div>
                <div class="confirmation-row"> <div class="label">口座名義</div> <div class="value" th:text="*{name}"></div> </div>

                <div class="confirmation-row"><div class="label">振込金額</div>
                    <div class="value"><span th:text="${#numbers.formatInteger(money, 3, 'COMMA')}"></span> 円</div>
                </div>
                <div class="confirmation-row"><div class="label">振込手数料</div>
                    <div class="value"><span th:text="${#numbers.formatInteger(fee, 3, 'COMMA')}"></span> 円</div>
                </div>
                <div class="confirmation-row money-row"><div class="label">引落金額</div>
                    <div class="value money-value"><span th:text="${#numbers.formatInteger(totalAmount, 3, 'COMMA')}"></span> 円</div>
                </div>
                <div class="confirmation-row"> <div class="label">振込指定日</div> <div class="value" th:text="*{transferDateTime}"></div> </div> </div>
            <input type="hidden" name="transferDateTime" th:value="*{transferDateTime}"/>
            <input type="hidden" name="money" th:value="*{money}"/> <input type="hidden" name="name" th:value="*{name}"/>
            <input type="hidden" name="bankAccountNum" th:value="*{bankAccountNum}"/> <input type="hidden" name="bankAccountType" th:value="*{bankAccountType}"/>
            <input type="hidden" name="branchName" th:value="*{branchName}"/> <input type="hidden" name="bankName" th:value="*{bankName}"/>
            <div class="button-area">
                <input type="button" class="cancel-button" value="キャンセル" onclick="history.back();"/>
                <input type="submit" id="submit" class="submit-button" value="振込"/> </div> </form> <div class="security-note"> 🔒 安全な通信で処理されています</div> </div>
            <script th:inline="javascript" src="/js/bankTransferConfirmation.js"></script>
</body>
</html>
