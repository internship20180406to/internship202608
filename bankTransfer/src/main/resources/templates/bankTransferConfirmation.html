<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet"
          th:href="@{/js/css/bankTransferConfirmation.css}"/>
    <meta charset="UTF-8">
    <title>銀行振込確認画面</title>
</head>
<body>

<div class="content">

    <div class="progress-steps step-4">
        <div class="step">
            <span class="step-number">1</span>
            <span class="step-label">金融機関選択</span>
        </div>

        <div class="step">
            <span class="step-number">2</span>
            <span class="step-label">口座情報入力</span>
        </div>

        <div class="step">
            <span class="step-number">3</span>
            <span class="step-label">振込内容入力</span>
        </div>

        <div class="step">
            <span class="step-number">4</span>
            <span class="step-label">内容確認</span>
        </div>

        <div class="step">
            <span class="step-number">5</span>
            <span class="step-label">完了</span>
        </div>
    </div>

<h1>銀行振込確認画面</h1>
<form action="#" th:action="@{/bankTransferCompletion}" th:object="${bankTransferApplication}" method="post">
    <p class="confirmation-row confirmation-row--editable">
        金融機関名: <span th:text="*{bankName}"></span>
        <a class="edit-row-button"
           th:href="@{/bankTransfer(startStep=2, bankName=*{bankName}, branchName=*{branchName}, bankAccountType=*{bankAccountType}, bankAccountNum=*{bankAccountNum}, name=*{name}, money=*{money}, transferDateTime=*{transferDateTime})}">編集</a>
    </p>
    <p class="confirmation-row confirmation-row--editable">
        支店名: <span th:text="*{branchName}"></span>
        <a class="edit-row-button"
           th:href="@{/bankTransfer(startStep=2, bankName=*{bankName}, branchName=*{branchName}, bankAccountType=*{bankAccountType}, bankAccountNum=*{bankAccountNum}, name=*{name}, money=*{money}, transferDateTime=*{transferDateTime})}">編集</a>
    </p>
    <p class="confirmation-row confirmation-row--editable">
        科目名: <span th:text="*{bankAccountType}"></span>
        <a class="edit-row-button"
           th:href="@{/bankTransfer(startStep=3, bankName=*{bankName}, branchName=*{branchName}, bankAccountType=*{bankAccountType}, bankAccountNum=*{bankAccountNum}, name=*{name}, money=*{money}, transferDateTime=*{transferDateTime})}">編集</a>
    </p>
    <p class="confirmation-row confirmation-row--editable">
        口座番号: <span th:text="*{bankAccountNum}"></span>
        <a class="edit-row-button"
           th:href="@{/bankTransfer(startStep=3, bankName=*{bankName}, branchName=*{branchName}, bankAccountType=*{bankAccountType}, bankAccountNum=*{bankAccountNum}, name=*{name}, money=*{money}, transferDateTime=*{transferDateTime})}">編集</a>
    </p>

    <p class="confirmation-row confirmation-row--editable">
        口座名義: <span th:text="*{name}"></span>
        <a class="edit-row-button"
           th:href="@{/bankTransfer(startStep=3, bankName=*{bankName}, branchName=*{branchName}, bankAccountType=*{bankAccountType}, bankAccountNum=*{bankAccountNum}, name=*{name}, money=*{money}, transferDateTime=*{transferDateTime})}">編集</a>
    </p>
    <p class="confirmation-row confirmation-row--editable">
        振込金額: <span th:text="${#numbers.formatInteger(money, 1, 'COMMA') + '円'}"></span>
        <a class="edit-row-button"
           th:href="@{/bankTransfer(startStep=4, bankName=*{bankName}, branchName=*{branchName}, bankAccountType=*{bankAccountType}, bankAccountNum=*{bankAccountNum}, name=*{name}, money=*{money}, transferDateTime=*{transferDateTime})}">編集</a>
    </p>
    <p class="confirmation-row">振込手数料: <span th:text="${#numbers.formatInteger(fee, 1, 'COMMA') + '円'}"></span></p>
    <p class="confirmation-row">合計引落金額: <span th:text="${#numbers.formatInteger(totalDebit, 1, 'COMMA') + '円'}"></span></p>
    <p class="confirmation-row confirmation-row--editable">
        振込指定日: <span th:text="*{transferDateTime}"></span>
        <a class="edit-row-button"
           th:href="@{/bankTransfer(startStep=4, bankName=*{bankName}, branchName=*{branchName}, bankAccountType=*{bankAccountType}, bankAccountNum=*{bankAccountNum}, name=*{name}, money=*{money}, transferDateTime=*{transferDateTime})}">編集</a>
    </p>

    <input type="hidden" name="bankName" th:value="*{bankName}"/>
    <input type="hidden" name="branchName" th:value="*{branchName}"/>
    <input type="hidden" name="bankAccountType" th:value="*{bankAccountType}"/>
    <input type="hidden" name="bankAccountNum" th:value="*{bankAccountNum}"/>

    <input type="hidden" name="name" th:value="*{name}"/>
    <input type="hidden" name="money" th:value="*{money}"/>
    <input type="hidden" name="transferDateTime" th:value="*{transferDateTime}"/>

    <p class="confirmation-checkbox-row">
        <label>
            <input type="checkbox" name="registerFavorite" value="true"/>
            この振込先をお気に入りに登録する
        </label>
    </p>

    <p>
        <input type="submit" id="transferSubmitButton" value="振込" th:attr="data-requires-reconfirmation=${requiresReconfirmation}"/>
        <input type="button" value="キャンセル" onclick="window.location='/bankTransfer';"/>
    </p>
</form>

<div id="reconfirmModalOverlay" class="reconfirm-modal-overlay" hidden>
    <div class="reconfirm-modal" role="alertdialog" aria-modal="true"
         aria-labelledby="reconfirmModalTitle" aria-describedby="reconfirmModalDesc">
        <h2 id="reconfirmModalTitle">振込内容をもう一度ご確認ください</h2>
        <p id="reconfirmModalDesc">この振込は、高額な振込または初めての振込先への振込です。</p>
        <p>
            <label>
                <input type="checkbox" id="reconfirmCheck1"/>
                振込先・口座名義・振込金額に間違いありません
            </label>
        </p>
        <p>
            <label>
                <input type="checkbox" id="reconfirmCheck2"/>
                電話やSNSなどで、知らない相手から振込を指示されていません
            </label>
        </p>
        <p class="reconfirm-modal__actions">
            <button type="button" id="reconfirmBackButton" class="reconfirm-modal__back-btn">戻って確認する</button>
            <button type="button" id="reconfirmConfirmButton" class="reconfirm-modal__confirm-btn" disabled>確認して振り込む</button>
        </p>
    </div>
</div>

<script th:inline="javascript" src="/js/bankTransferConfirmation.js"></script>
</div>
</body>
</html>
