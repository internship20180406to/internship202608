<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>銀行振込確認画面</title>
    <link rel="stylesheet" href="/css/bankTransfer.css"/>
</head>
<body>
<div class="content">
    <div th:replace="~{fragments/stepper :: stepper(2)}"></div>
    <h1>銀行振込確認画面</h1>
    <form action="#" th:action="@{/bankTransferCompletion}" th:object="${bankTransferApplication}" method="post">

        <p>金融機関名: <span th:text="*{bankName}"></span></p>
        <p>支店名: <span th:text="*{branchName}"></span></p>
        <p>科目: <span th:text="*{bankAccountType}"></span></p>
        <p>口座番号: <span th:text="*{bankAccountNum}"></span></p>
        <p>口座名義: <span th:text="*{name}"></span></p>
        <p>金額: <span th:text="${#numbers.formatInteger(bankTransferApplication.money, 1, 'COMMA')}"></span>円</p>
        <p>振込指定日: <span th:text="*{transferDateTime}"></span></p>


        <!-- 二重送信防止用のワンタイムトークン -->
        <input type="hidden" name="transferToken" th:value="${transferToken}"/>

        <p>
            <input type="submit" id="submit" value="振込"
                   class="form-control-button form-confirmation-button"/>
            <input type="button" value="キャンセル"
                   class="form-control-button form-clear-button"
                   onclick="window.location='/bankTransfer';"/>
        </p>
    </form>
</div>
<script th:inline="javascript" src="/js/bankTransferConfirmation.js"></script>
</body>
</html>
