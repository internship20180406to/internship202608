<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('振込')}"></head>
<body>
<div class="content">
    <!-- ここはまだ振込の手順に入っていないので、ステッパーは出さない -->
    <h1>振込</h1>
    <p class="lead">振込先の指定方法を選んでください。</p>

    <ul class="startlist">
        <li>
            <a class="startlist-row" th:href="@{/bankTransfer/bank}">
                <span>
                    <span class="startlist-title">新しい振込先を指定する</span>
                    <span class="startlist-desc">金融機関・支店・口座番号を入力します</span>
                </span>
                <span class="picklist-chevron" aria-hidden="true">›</span>
            </a>
        </li>

        <!-- 押せないものは <a> にしない。リンクの形をしていると押せると読まれる -->
        <li>
            <a class="startlist-row" th:href="@{/bankTransfer/history}">
                <span>
                    <span class="startlist-title">履歴から振り込む</span>
                    <span class="startlist-desc">過去に振り込んだ相手から選びます</span>
                </span>
                <span class="picklist-chevron" aria-hidden="true">›</span>
            </a>
        </li>
        <li>
            <span class="startlist-row is-unavailable">
                <span>
                    <span class="startlist-title">登録した振込先から振り込む</span>
                    <span class="startlist-desc">登録しておいた振込先から選びます</span>
                </span>
                <span class="startlist-soon">準備中</span>
            </span>
        </li>
    </ul>
</div>
</body>
</html>
