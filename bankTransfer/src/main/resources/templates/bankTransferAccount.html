<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('口座情報の入力')}"></head>
<body>
<div th:replace="~{fragments/appbar :: appbar}"></div>
<div class="content">
    <div th:replace="${registering} ? ~{fragments/stepper :: stepperRegister(3)}
                                    : ~{fragments/stepper :: stepper(3)}"></div>
    <div th:replace="~{fragments/titlebar :: titleWithCancel('口座情報の入力')}"></div>
    <div th:replace="~{fragments/recap :: recap(${input})}"></div>

    <form th:action="@{/bankTransfer/account}" th:object="${accountForm}" method="post">

        <fieldset class="radios">
            <legend class="field-label">科目</legend>
            <div class="radio-group">
                <label class="radio">
                    <input type="radio" th:field="*{bankAccountType}" value="普通"/>普通
                </label>
                <label class="radio">
                    <input type="radio" th:field="*{bankAccountType}" value="当座"/>当座
                </label>
                <label class="radio">
                    <input type="radio" th:field="*{bankAccountType}" value="貯蓄"/>貯蓄
                </label>
            </div>
            <span class="text-danger" th:if="${#fields.hasErrors('bankAccountType')}"
                  th:errors="*{bankAccountType}"></span>
        </fieldset>

        <div class="field">
            <label class="field-label" for="bankAccountNum">口座番号</label>
            <input class="form-control is-tiny" id="bankAccountNum" type="text" th:field="*{bankAccountNum}"
                   th:classappend="${#fields.hasErrors('bankAccountNum')} ? 'has-error'"
                   inputmode="numeric" maxlength="7" placeholder="1234567" autocomplete="off"
                   data-allow="digits"/>
            <span class="hint" th:unless="${#fields.hasErrors('bankAccountNum')}">7桁以内の数字で入力してください。先頭の「0」の入力は不要です</span>
            <!-- 打った字が入らなかったときだけ出る。文言は bankTransferInput.js が入れる -->
            <span class="text-danger" data-warn-for="bankAccountNum" hidden></span>
            <span class="text-danger" th:if="${#fields.hasErrors('bankAccountNum')}"
                  th:errors="*{bankAccountNum}"></span>
        </div>

        <div class="field">
            <label class="field-label" for="name">口座名義</label>
            <input class="form-control" id="name" type="text" th:field="*{name}"
                   th:classappend="${#fields.hasErrors('name')} ? 'has-error'"
                   maxlength="20" placeholder="ﾔﾏﾀﾞ ﾀﾛｳ" autocomplete="off"
                   data-allow="kana"/>
            <span class="hint" th:unless="${#fields.hasErrors('name')}">カタカナで入力してください。ローマ字やひらがなで打っても半角カタカナになります</span>
            <span class="text-danger" data-warn-for="name" hidden></span>
            <span class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>

        <div class="actions">
            <a class="form-control-button form-clear-button" th:href="@{/bankTransfer/branch}">戻る</a>
            <button class="form-control-button form-confirmation-button" type="submit">次へ</button>
        </div>
    </form>
</div>
<div th:replace="~{fragments/cancel :: cancel}"></div>
<script src="/js/bankTransferText.js"></script>
<script src="/js/bankTransferInput.js"></script>
</body>
</html>
